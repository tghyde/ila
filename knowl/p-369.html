<p class="Ck3QC0hdxZ0U9psZY1XeN">We need to find two vectors in <span class="pretex-inline" style="width:1.08507em"><span style="height:0.86467em;vertical-align:-0.008em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">R</tspan></text>
<text transform="translate(7.701 -4.579)"><tspan y="0" x="0" class="b">2</tspan></text>
</svg></span></span> that span <span class="pretex-inline" style="width:1.08507em"><span style="height:0.86467em;vertical-align:-0.008em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">R</tspan></text>
<text transform="translate(7.701 -4.579)"><tspan y="0" x="0" class="b">2</tspan></text>

<text transform="translate(25.183 -10.266)"><tspan y="0" x="0" class="c">A</tspan></text>
<text transform="translate(30.186 -5.899)"><tspan y="0" x="0" class="b">0</tspan><tspan y="9.7089996" x="0" class="b">1</tspan></text>
<text transform="translate(34.441 -10.266)"><tspan y="0" x="0 4.9993811" class="c">BD</tspan></text>
<text transform="translate(45.573)"><tspan y="0" x="0" class="d">:</tspan></text>
</svg></span></span> </p>
<ol style="list-style-type: decimal;" class="Ck3QC0hdxZ0U9psZY1XeN">
<li>They span because any vector <span class="pretex-inline" style="width:1.27666em"><span style="height:1.331em;vertical-align:-0.3765em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0 -10.266)"><tspan y="0" x="0" class="c">A</tspan></text>
<text transform="translate(5.318 -5.899)"><tspan y="0" x="0" class="e">a</tspan><tspan y="9.7089996" x="0.25999999" class="e">b</tspan></text>
<text transform="translate(9.648 -10.266)"><tspan y="0" x="0" class="c">B</tspan></text>
</svg></span></span> can be written as a linear combination of <span class="pretex-inline" style="width:3.22183em"><span style="height:1.34817em;vertical-align:-0.3765em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0 -10.266)"><tspan y="0" x="0" class="c">A</tspan></text>

<li>They are linearly independent: if

then <span class="pretex-inline" style="width:4.66598em"><span style="height:0.904em;vertical-align:-0.2175em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="f">x</tspan></text>

<p class="Ck3QC0hdxZ0U9psZY1XeN"> This shows that the plane <span class="pretex-inline" style="width:1.08507em"><span style="height:0.86467em;vertical-align:-0.008em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">R</tspan></text>
