</h5>

<p>According to the above <a knowl="./knowl/dimension-unique-coeff.html?vers=cb75e0" knowl-id="xref-dimension-unique-coeff" alt="Fact 2.8.1 " title="Fact 2.8.1 ">fact</a>, every vector in <span class="pretex-inline" style="width:1.08507em"><span style="height:0.86467em;vertical-align:-0.008em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">R</tspan></text>
<text transform="translate(7.701 -4.579)"><tspan y="0" x="0" class="b">3</tspan></text>
</svg></span></span> can be written as a linear combination of <span class="pretex-inline" style="width:3.7022em"><span style="height:0.71567em;vertical-align:-0.23067em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="c">e</tspan></text>
