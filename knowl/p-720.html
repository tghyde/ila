<text transform="translate(15.425)"><tspan y="0" x="0" class="c">R</tspan></text>
<text transform="translate(25.795)"><tspan y="0" x="0" class="d">→</tspan></text>
<text transform="translate(40.078)"><tspan y="0" x="0" class="c">R</tspan></text>
</svg></span></span> by <span class="pretex-inline" style="width:4.67106em"><span style="height:1.07416em;vertical-align:-0.2175em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(1.435)"><tspan y="0" x="0" class="a">f</tspan></text>

<text transform="translate(19.396)"><tspan y="0" x="0 7.1788635" class="e">)=</tspan></text>

<text transform="translate(45.667 -4.579)"><tspan y="0" x="0" class="f">2</tspan></text>
<text transform="translate(50.419)"><tspan y="0" x="0" class="b">.</tspan></text>

<text transform="translate(12.005)"><tspan y="0" x="0" class="b">2</tspan></text>

<text transform="translate(7.495)"><tspan y="0" x="0" class="b">:</tspan></text>
</svg></span></span> the inverse transformation would not know if it should send <span class="pretex-inline" style="width:0.556em"><span style="height:0.6865em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="b">2</tspan></text>
</svg></span></span> to <span class="pretex-inline" style="width:0.556em"><span style="height:0.6865em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="b">2</tspan></text>
</svg></span></span> or <span class="pretex-inline" style="width:1.565em"><span style="height:0.7005em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="d">−</tspan></text>
<text transform="translate(8.39)"><tspan y="0" x="0 6.3812122" class="b">2.</tspan></text>
</svg></span></span>  More formally, if <span class="pretex-inline" style="width:4.14098em"><span style="height:0.8945em;vertical-align:-0.2175em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">g</tspan></text>

<text transform="translate(25.542)"><tspan y="0" x="0" class="d">→</tspan></text>
<text transform="translate(39.825)"><tspan y="0" x="0" class="c">R</tspan></text>
</svg></span></span> satisfies <span class="pretex-inline" style="width:5.67398em"><span style="height:0.9845em;vertical-align:-0.2175em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">g</tspan></text>

<text transform="translate(13.187)"><tspan y="0" x="0" class="a">f</tspan></text>

</svg></span></span> then</p>
