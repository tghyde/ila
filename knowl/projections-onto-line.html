<article class="example-like CP8zBz-v4sk01u4d1pNNZ"><h5 class="heading">
<span class="type">Example</span><span class="codenumber">6.3.16</span><span class="title">(Orthogonal projection onto a line)</span>
</h5>
<p>Let <span class="pretex-inline" style="width:5.50998em"><span style="height:0.9875em;vertical-align:-0.2205em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">L</tspan></text>
<text transform="translate(9.819)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(21.519)"><tspan y="0" x="0 6.3812122 12.705039 18.523878" class="c">Span</tspan></text>
<text transform="translate(46.562)"><tspan y="0" x="0" class="d">{</tspan></text>
<text transform="translate(51.727)"><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(58.074)"><tspan y="0" x="0" class="d">}</tspan></text>
</svg></span></span> be a line in <span class="pretex-inline" style="width:1.10174em"><span style="height:0.73033em;vertical-align:-0.008em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="e">R</tspan></text>
<text transform="translate(7.892 -4.579)"><tspan y="0" x="0" class="f">n</tspan></text>
</svg></span></span> and let <span class="pretex-inline" style="width:0.644em"><span style="height:0.4925em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">x</tspan></text>
</svg></span></span> be a vector in <span class="pretex-inline" style="width:1.37973em"><span style="height:0.73633em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="e">R</tspan></text>
<text transform="translate(7.892 -4.579)"><tspan y="0" x="0" class="f">n</tspan></text>
<text transform="translate(12.645)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></span></span>  By the <a knowl="./knowl/projections-ATA-formula.html?vers=cb75e0" knowl-id="xref-projections-ATA-formula" alt="Theorem 6.3.15 " title="Theorem 6.3.15 ">theorem</a>, to find <span class="pretex-inline" style="width:1.06073em"><span style="height:0.711em;vertical-align:-0.226em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(7.483 2.594)"><tspan y="0" x="0" class="f">L</tspan></text>
</svg></span></span> we must solve the matrix equation <span class="pretex-inline" style="width:5.36879em"><span style="height:1.01833em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(6.729 -4.579)"><tspan y="0" x="0" class="f">T</tspan></text>
<text transform="translate(12.469)"><tspan y="0" x="0 6.6337061" class="a">uc</tspan></text>
<text transform="translate(26.867)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(38.567)"><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(45.297 -4.579)"><tspan y="0" x="0" class="f">T</tspan></text>
<text transform="translate(51.897)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(58.427)"><tspan y="0" x="0" class="c">,</tspan></text>
</svg></span></span> where we regard <span class="pretex-inline" style="width:0.553em"><span style="height:0.4925em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">u</tspan></text>
</svg></span></span> as an <span class="pretex-inline" style="width:2.23999em"><span style="height:0.7005em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">n</tspan></text>
<text transform="translate(8.803)"><tspan y="0" x="0" class="d">×</tspan></text>
<text transform="translate(19.327)"><tspan y="0" x="0" class="c">1</tspan></text>
</svg></span></span> matrix (the column space of this matrix is exactly <span class="pretex-bind"><span class="pretex-inline" style="width:0.961em"><span style="height:0.696em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">L</tspan></text>
<text transform="translate(7.15)"><tspan y="0" x="0" class="c">!</tspan></text>
</svg></span></span>).</span>  But <span class="pretex-inline" style="width:4.65039em"><span style="height:0.93433em;vertical-align:-0.086em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(6.729 -4.579)"><tspan y="0" x="0" class="f">T</tspan></text>
<text transform="translate(12.469)"><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(21.484)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(33.185)"><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(41.666)"><tspan y="0" x="0" class="d">·</tspan></text>
<text transform="translate(47.026)"><tspan y="0" x="0" class="a">u</tspan></text>
</svg></span></span> and <span class="pretex-inline" style="width:5.11039em"><span style="height:1.01833em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(6.729 -4.579)"><tspan y="0" x="0" class="f">T</tspan></text>
<text transform="translate(13.329)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(22.528)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(34.229)"><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(42.711)"><tspan y="0" x="0" class="d">·</tspan></text>
<text transform="translate(48.931)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(55.461)"><tspan y="0" x="0" class="c">,</tspan></text>
</svg></span></span> so <span class="pretex-inline" style="width:7.40797em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">c</tspan></text>
<text transform="translate(8.051)"><tspan y="0" x="0 11.705392" class="b">=(</tspan></text>
<text transform="translate(24.262)"><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(32.744)"><tspan y="0" x="0" class="d">·</tspan></text>
<text transform="translate(38.964)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(45.495)"><tspan y="0" x="0" class="b">)</tspan></text>
<text transform="translate(50.005)"><tspan y="0" x="0" class="g">/</tspan></text>
<text transform="translate(55.813)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(60.323)"><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(68.805)"><tspan y="0" x="0" class="d">·</tspan></text>
<text transform="translate(74.164)"><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(80.511)"><tspan y="0" x="0" class="b">)</tspan></text>
</svg></span></span> is a solution of <span class="pretex-inline" style="width:5.36879em"><span style="height:1.01833em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(6.729 -4.579)"><tspan y="0" x="0" class="f">T</tspan></text>
<text transform="translate(12.469)"><tspan y="0" x="0 6.6337061" class="a">uc</tspan></text>
<text transform="translate(26.867)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(38.567)"><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(45.297 -4.579)"><tspan y="0" x="0" class="f">T</tspan></text>
<text transform="translate(51.897)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(58.427)"><tspan y="0" x="0" class="c">,</tspan></text>
</svg></span></span> and hence <span class="pretex-inline" style="width:11.2442em"><span style="height:0.993em;vertical-align:-0.226em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(7.483 2.594)"><tspan y="0" x="0" class="f">L</tspan></text>
<text transform="translate(14.842)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(26.543)"><tspan y="0" x="0 6.6337061" class="a">uc</tspan></text>
<text transform="translate(40.941)"><tspan y="0" x="0 11.705392" class="b">=(</tspan></text>
<text transform="translate(57.152)"><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(65.634)"><tspan y="0" x="0" class="d">·</tspan></text>
<text transform="translate(71.854)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(78.385)"><tspan y="0" x="0" class="b">)</tspan></text>
<text transform="translate(82.895)"><tspan y="0" x="0" class="g">/</tspan></text>
<text transform="translate(88.703)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(93.213)"><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(101.695)"><tspan y="0" x="0" class="d">·</tspan></text>
<text transform="translate(107.054)"><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(113.401)"><tspan y="0" x="0" class="b">)</tspan></text>
<text transform="translate(119.513)"><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(125.859)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></span></span> </p>
