<p class="CmUaXT9xsBZ-P0GFXkkoX">The number <span class="pretex-inline" style="width:0.556em"><span style="height:0.6935em;vertical-align:-0.007em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">1</tspan></text>
</svg></span></span> is an eigenvalue of <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="b">A</tspan></text>
</svg></span></span> if and only if <span class="pretex-inline" style="width:4.81005em"><span style="height:0.993em;vertical-align:-0.226em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 8.1831007 14.713514" class="a">Nul</tspan></text>
<text transform="translate(17.95)"><tspan y="0" x="0" class="c">(</tspan></text>
<text transform="translate(22.461)"><tspan y="0" x="0" class="b">A</tspan></text>
<text transform="translate(30.976)"><tspan y="0" x="0" class="d">−</tspan></text>
<text transform="translate(42.075)"><tspan y="0" x="0" class="b">I</tspan></text>
<text transform="translate(45.942 2.594)"><tspan y="0" x="0" class="e">2</tspan></text>
<text transform="translate(50.695)"><tspan y="0" x="0" class="c">)</tspan></text>
</svg></span></span> is nonzero.  Hence, we have to solve the matrix equation <span class="pretex-inline" style="width:5.88605em"><span style="height:0.993em;vertical-align:-0.226em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="c">(</tspan></text>
<text transform="translate(4.51)"><tspan y="0" x="0" class="b">A</tspan></text>
<text transform="translate(13.026)"><tspan y="0" x="0" class="d">−</tspan></text>
<text transform="translate(24.125)"><tspan y="0" x="0" class="b">I</tspan></text>
<text transform="translate(27.992 2.594)"><tspan y="0" x="0" class="e">2</tspan></text>
<text transform="translate(32.745)"><tspan y="0" x="0" class="c">)</tspan></text>
<text transform="translate(37.829)"><tspan y="0" x="0" class="b">v</tspan></text>
<text transform="translate(46.282)"><tspan y="0" x="0" class="c">=</tspan></text>
<text transform="translate(57.983)"><tspan y="0" x="0 6.3812122" class="a">0.</tspan></text>
</svg></span></span>  We have</p>
<div class="pretex-display CmUaXT9xsBZ-P0GFXkkoX"><svg height="2.43965em" version="1.1" class="pretex" viewBox="136 1 231 28"><text transform="translate(137.599 18.261)"><tspan y="0" x="0" class="b">A</tspan></text>
<text transform="translate(146.115 18.261)"><tspan y="0" x="0" class="d">−</tspan></text>
<text transform="translate(157.213 18.261)"><tspan y="0" x="0" class="b">I</tspan></text>
<text transform="translate(161.081 20.855)"><tspan y="0" x="0" class="e">2</tspan></text>
<text transform="translate(168.501 18.261)"><tspan y="0" x="0" class="c">=</tspan></text>
<text transform="translate(180.202 2.394)"><tspan y="0" x="0" class="f">A</tspan></text>
<text transform="translate(193.171 10.76)"><tspan y="0" x="0" class="a">2</tspan></text>
<text transform="translate(213.71 10.76)"><tspan y="0" x="0" class="d">−</tspan></text>
<text transform="translate(222.1 10.76)"><tspan y="0" x="0" class="a">4</tspan></text>
<text transform="translate(188.976 24.707)"><tspan y="0" x="0" class="d">−</tspan></text>
<text transform="translate(197.366 24.707)"><tspan y="0" x="0" class="a">1</tspan></text>
<text transform="translate(213.71 24.707)"><tspan y="0" x="0" class="d">−</tspan></text>
<text transform="translate(222.1 24.707)"><tspan y="0" x="0" class="a">1</tspan></text>
<text transform="translate(230.082 2.394)"><tspan y="0" x="0" class="f">B</tspan></text>
<text transform="translate(239.39 18.261)"><tspan y="0" x="0" class="d">−</tspan></text>
<text transform="translate(249.914 2.394)"><tspan y="0" x="0" class="f">A</tspan></text>
<text transform="translate(258.688 10.76)"><tspan y="0" x="0 16.343248" class="a">10</tspan><tspan y="13.947" x="0 16.343248" class="a">01</tspan></text>
<text transform="translate(283.014 2.394)"><tspan y="0" x="0" class="f">B</tspan></text>
<text transform="translate(292.856 18.261)"><tspan y="0" x="0" class="c">=</tspan></text>
<text transform="translate(304.557 2.394)"><tspan y="0" x="0" class="f">A</tspan></text>
<text transform="translate(317.526 10.76)"><tspan y="0" x="0" class="a">1</tspan></text>
<text transform="translate(338.064 10.76)"><tspan y="0" x="0" class="d">−</tspan></text>
<text transform="translate(346.454 10.76)"><tspan y="0" x="0" class="a">4</tspan></text>
<text transform="translate(313.331 24.707)"><tspan y="0" x="0" class="d">−</tspan></text>
<text transform="translate(321.721 24.707)"><tspan y="0" x="0" class="a">1</tspan></text>
<text transform="translate(338.064 24.707)"><tspan y="0" x="0" class="d">−</tspan></text>
<text transform="translate(346.454 24.707)"><tspan y="0" x="0" class="a">2</tspan></text>

</svg></div>
<p class="CmUaXT9xsBZ-P0GFXkkoX">This matrix has determinant <span class="pretex-inline" style="width:1.565em"><span style="height:0.8835em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="d">−</tspan></text>
<text transform="translate(8.39)"><tspan y="0" x="0 6.3812122" class="a">6,</tspan></text>
</svg></span></span> so it is invertible.  By the <a knowl="./knowl/imt-1.html?vers=b58525" knowl-id="xref-imt-1" alt="Invertible Matrix Theorem 3.6.1 " title="Invertible Matrix Theorem 3.6.1 ">invertible matrix theorem in Section 3.6</a>, we have <span class="pretex-inline" style="width:7.79604em"><span style="height:0.993em;vertical-align:-0.226em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 8.1831007 14.713514" class="a">Nul</tspan></text>
<text transform="translate(17.95)"><tspan y="0" x="0" class="c">(</tspan></text>
<text transform="translate(22.461)"><tspan y="0" x="0" class="b">A</tspan></text>
<text transform="translate(30.976)"><tspan y="0" x="0" class="d">−</tspan></text>
<text transform="translate(42.075)"><tspan y="0" x="0" class="b">I</tspan></text>
<text transform="translate(45.942 2.594)"><tspan y="0" x="0" class="e">2</tspan></text>
<text transform="translate(50.695)"><tspan y="0" x="0 7.1788635" class="c">)=</tspan></text>
<text transform="translate(69.574)"><tspan y="0" x="0" class="d">{</tspan></text>
<text transform="translate(74.739)"><tspan y="0" x="0" class="a">0</tspan></text>
<text transform="translate(81.12)"><tspan y="0" x="0" class="d">}</tspan></text>
<text transform="translate(86.285)"><tspan y="0" x="0" class="a">,</tspan></text>
</svg></span></span> so <span class="pretex-inline" style="width:0.556em"><span style="height:0.6935em;vertical-align:-0.007em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">1</tspan></text>
</svg></span></span> is not an eigenvalue.</p>
