<p class="C2wcWNv5kQuU9s-c_R9jS">Let <span class="pretex-inline" style="width:5.11712em"><span style="height:0.86816em;vertical-align:-0.0115em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">U</tspan></text>

<text transform="translate(6.381)"><tspan y="0" x="0" class="f">/</tspan></text>
<text transform="translate(12.189)"><tspan y="0" x="0 6.3812122" class="b">3:</tspan></text>
</svg></span></span> that is, <span class="pretex-inline" style="width:6.00098em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">U</tspan></text>

<text transform="translate(65.683)"><tspan y="0" x="0" class="b">.</tspan></text>
</svg></span></span>  Then</p>

<p class="C2wcWNv5kQuU9s-c_R9jS">Hence <span class="pretex-inline" style="width:5.34512em"><span style="height:0.97133em;vertical-align:-0.23133em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>

</svg></span></span> is invertible, with inverse <span class="pretex-inline" style="width:1.057em"><span style="height:0.688em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">U</tspan></text>
<text transform="translate(8.941)"><tspan y="0" x="0" class="b">.</tspan></text>
</svg></span></span>  In other words, <em>shrinking</em> by a factor of <span class="pretex-inline" style="width:1.618em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(6.381)"><tspan y="0" x="0" class="f">/</tspan></text>
