</h5>We need to verify that <span class="pretex-inline" style="width:0.67504em"><span style="height:0.67122em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">B</tspan></text>

<text transform="translate(8.596)"><tspan y="0" x="0" class="c">,</tspan></text>
</svg></span></span> and that it is linearly independent.  By definition, <span class="pretex-inline" style="width:0.749em"><span style="height:0.6775em;vertical-align:-0.0035em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="b">V</tspan></text>
