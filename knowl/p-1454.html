<h5 class="heading CkfgdMzsiUjbMSg8YgzDL"><span class="type">Paragraph</span></h5>
<p class="CkfgdMzsiUjbMSg8YgzDL">By the <a knowl="./knowl/rank-theorem.html?vers=88014a" knowl-id="xref-rank-theorem" alt="Rank Theorem 2.9.2 " title="Rank Theorem 2.9.2 ">rank theorem in Section 2.9</a>, we have</p>

<p class="CkfgdMzsiUjbMSg8YgzDL">On the other hand the <a knowl="./knowl/orthocomp-facts-basic.html?vers=88014a" knowl-id="xref-orthocomp-facts-basic" alt="Fact 6.2.16 Facts about Orthogonal Complements" title="Fact 6.2.16 Facts about Orthogonal Complements">third fact</a> says that</p>
<div class="pretex-display CkfgdMzsiUjbMSg8YgzDL"><svg height="1.21983em" version="1.1" class="pretex" viewbox="175 3 153 14"><text transform="translate(175.97 13.948)"><tspan y="0" x="0 6.4845052 9.6980648 20.979956 29.163057 35.69347" class="a">dimNul</tspan></text>
