<h5 class="heading CZ5-nwtEvJEfU5X_A0iTM"><span class="type">Paragraph</span></h5>
<p class="CZ5-nwtEvJEfU5X_A0iTM">First we point out that the condition <span class="pretex-bind">“<span class="pretex-inline" style="width:3.54599em"><span style="height:0.7415em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">2</tspan></text>
<text transform="translate(6.668)"><tspan y="0" x="0" class="b">a</tspan></text>
<text transform="translate(15.649)"><tspan y="0" x="0" class="c">=</tspan></text>
<text transform="translate(27.35)"><tspan y="0" x="0" class="a">3</tspan></text>
<text transform="translate(34.592)"><tspan y="0" x="0" class="b">b</tspan></text>
</svg></span></span>”</span> defines whether or not a vector is in <span class="pretex-inline" style="width:1.068em"><span style="height:0.688em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="b">V</tspan></text>
<text transform="translate(8.596)"><tspan y="0" x="0" class="a">:</tspan></text>
</svg></span></span> that is, to say <span class="pretex-inline" style="width:1.27666em"><span style="height:1.331em;vertical-align:-0.3765em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0 -10.266)"><tspan y="0" x="0" class="d">A</tspan></text>
<text transform="translate(5.318 -5.899)"><tspan y="0" x="0" class="e">a</tspan><tspan y="9.7089996" x="0.25999999" class="e">b</tspan></text>
<text transform="translate(9.648 -10.266)"><tspan y="0" x="0" class="d">B</tspan></text>
</svg></span></span> is in <span class="pretex-inline" style="width:0.749em"><span style="height:0.6775em;vertical-align:-0.0035em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="b">V</tspan></text>
</svg></span></span> <em>means</em> that <span class="pretex-inline" style="width:3.82399em"><span style="height:0.748em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">2</tspan></text>
<text transform="translate(6.668)"><tspan y="0" x="0" class="b">a</tspan></text>
<text transform="translate(15.649)"><tspan y="0" x="0" class="c">=</tspan></text>
<text transform="translate(27.35)"><tspan y="0" x="0" class="a">3</tspan></text>
<text transform="translate(34.592)"><tspan y="0" x="0" class="b">b</tspan></text>
<text transform="translate(40.697)"><tspan y="0" x="0" class="a">.</tspan></text>
</svg></span></span>  In other words, a vector is in <span class="pretex-inline" style="width:0.749em"><span style="height:0.6775em;vertical-align:-0.0035em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="b">V</tspan></text>
</svg></span></span> if twice its first coordinate equals three times its second coordinate.  So for instance, <span class="pretex-inline" style="width:1.24266em"><span style="height:1.34817em;vertical-align:-0.3765em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0 -10.266)"><tspan y="0" x="0" class="d">A</tspan></text>
<text transform="translate(5.004 -5.899)"><tspan y="0" x="0" class="f">3</tspan><tspan y="9.7089996" x="0" class="f">2</tspan></text>
<text transform="translate(9.258 -10.266)"><tspan y="0" x="0" class="d">B</tspan></text>
</svg></span></span> and <span class="pretex-inline" style="width:1.95066em"><span style="height:1.48333em;vertical-align:-0.458em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0 -10.266)"><tspan y="0" x="0" class="d">A</tspan></text>
<text transform="translate(5.004 -5.899)"><tspan y="0" x="0" class="f">1</tspan></text>
<text transform="translate(9.258 -5.899)"><tspan y="0" x="0" class="g">/</tspan></text>
<text transform="translate(13.13 -5.899)"><tspan y="0" x="0" class="f">2</tspan><tspan y="9.7089996" x="-8.1260004" class="f">1</tspan></text>
<text transform="translate(9.258 3.81)"><tspan y="0" x="0" class="g">/</tspan></text>
<text transform="translate(13.13 3.81)"><tspan y="0" x="0" class="f">3</tspan></text>
<text transform="translate(17.384 -10.266)"><tspan y="0" x="0" class="d">B</tspan></text>
</svg></span></span> are in <span class="pretex-inline" style="width:1.027em"><span style="height:0.844em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="b">V</tspan></text>
<text transform="translate(8.596)"><tspan y="0" x="0" class="a">,</tspan></text>
</svg></span></span> but <span class="pretex-inline" style="width:1.24266em"><span style="height:1.34817em;vertical-align:-0.3765em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0 -10.266)"><tspan y="0" x="0" class="d">A</tspan></text>
<text transform="translate(5.004 -5.899)"><tspan y="0" x="0" class="f">2</tspan><tspan y="9.7089996" x="0" class="f">3</tspan></text>
<text transform="translate(9.258 -10.266)"><tspan y="0" x="0" class="d">B</tspan></text>
</svg></span></span> is not because <span class="pretex-inline" style="width:5.05997em"><span style="height:0.9em;vertical-align:-0.161em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">2</tspan></text>
<text transform="translate(8.516)"><tspan y="0" x="0" class="h">·</tspan></text>
<text transform="translate(13.876)"><tspan y="0" x="0" class="a">2</tspan></text>
<text transform="translate(22.925)"><tspan y="0" x="0" class="h">A</tspan></text>
<text transform="translate(22.925)"><tspan y="0" x="0" class="c">=</tspan></text>
<text transform="translate(34.626)"><tspan y="0" x="0" class="a">3</tspan></text>
<text transform="translate(43.142)"><tspan y="0" x="0" class="h">·</tspan></text>
<text transform="translate(48.502)"><tspan y="0" x="0 6.3812122" class="a">3.</tspan></text>
</svg></span></span></p>
