<h5 class="heading CWGdTkYNf2w8t2IOfd0Bw"><span class="type">Paragraph</span></h5>
<p class="CWGdTkYNf2w8t2IOfd0Bw">The above <a knowl="./knowl/dimension-defn-Bcoords.html?vers=cb75e0" knowl-id="xref-dimension-defn-Bcoords" alt="Definition 2.8.3 " title="Definition 2.8.3 ">definition</a> gives a way of using <span class="pretex-inline" style="width:1.2744em"><span style="height:0.73033em;vertical-align:-0.008em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">R</tspan></text>
<text transform="translate(7.892 -4.579)"><tspan y="0" x="0" class="b">m</tspan></text>
</svg></span></span> to <em>label</em> the points of a subspace of dimension <span class="pretex-inline" style="width:1.159em"><span style="height:0.5075em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="c">m</tspan></text>
<text transform="translate(9.641)"><tspan y="0" x="0" class="d">:</tspan></text>
</svg></span></span> a point is simply labeled by its <span class="pretex-bind"><span class="pretex-inline" style="width:0.67504em"><span style="height:0.67122em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="e">B</tspan></text>
</svg></span></span>-coordinate</span> vector.  For instance, if we choose a basis for a plane, we can label the points of that plane with the points of <span class="pretex-inline" style="width:1.36307em"><span style="height:0.87066em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">R</tspan></text>

</svg></span></span></p>
