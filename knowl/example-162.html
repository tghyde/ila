<article class="example-like CQXc-W4qa20udf7B7K7Oa"><h5 class="heading">
<span class="type">Example</span><span class="codenumber">4.1.22</span>
</h5>
<p>For any number <span class="pretex-inline" style="width:0.581em"><span style="height:0.4925em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">n</tspan></text>
</svg></span></span> we define</p>
<div class="pretex-display"><svg height="2.43965em" version="1.1" class="pretex" viewBox="215 1 73 28"><text transform="translate(216.19 18.261)"><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(223.336 20.855)"><tspan y="0" x="0" class="b">n</tspan></text>
<text transform="translate(230.757 18.261)"><tspan y="0" x="0" class="c">=</tspan></text>
<text transform="translate(242.458 2.394)"><tspan y="0" x="0" class="d">A</tspan></text>
<text transform="translate(251.232 10.76)"><tspan y="0" x="0" class="e">1</tspan></text>
<text transform="translate(267.863 10.76)"><tspan y="0" x="0" class="a">n</tspan></text>
<text transform="translate(251.232 24.707)"><tspan y="0" x="0 16.492449" class="e">12</tspan></text>
<text transform="translate(275.845 2.394)"><tspan y="0" x="0" class="d">B</tspan></text>
<text transform="translate(284.619 18.261)"><tspan y="0" x="0" class="e">.</tspan></text>
</svg></div>
<p>Show that the product</p>
<div class="pretex-display"><svg height="1.1327em" version="1.1" class="pretex" viewBox="221 5 60 13"><text transform="translate(222.732 13.948)"><tspan y="0" x="0" class="a">A</tspan></text>

<text transform="translate(234.439 13.948)"><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(241.394 16.542)"><tspan y="0" x="0" class="f">2</tspan></text>
<text transform="translate(246.146 13.948)"><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(253.101 16.542)"><tspan y="0" x="0" class="f">3</tspan></text>
<text transform="translate(257.854 13.948)"><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(264.809 16.542)"><tspan y="0" x="0" class="f">4</tspan></text>

</svg></div>
<p>is not invertible.</p></article><div class="posterior CQXc-W4qa20udf7B7K7Oa"><span class="solution"><span class="type">Solution</span><p>When <span class="pretex-inline" style="width:2.66699em"><span style="height:0.8565em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">n</tspan></text>
<text transform="translate(9.337)"><tspan y="0" x="0" class="c">=</tspan></text>
<text transform="translate(21.037)"><tspan y="0" x="0 6.3812122" class="e">2,</tspan></text>
</svg></span></span> the matrix <span class="pretex-inline" style="width:1.02007em"><span style="height:0.9em;vertical-align:-0.226em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(6.955 2.594)"><tspan y="0" x="0" class="f">2</tspan></text>
</svg></span></span> is not invertible, because its rows are identical:</p>
<div class="pretex-display"><svg height="2.43965em" version="1.1" class="pretex" viewBox="215 1 73 28"><text transform="translate(216.429 18.261)"><tspan y="0" x="0" class="a">A</tspan></text>
