<article class="example-like CQXc-W4qa20udf7B7K7Oa"><h5 class="heading">
<span class="type">Example</span><span class="codenumber">4.1.22</span>
</h5>
<p>For any number <span class="pretex-inline" style="width:0.581em"><span style="height:0.4925em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">n</tspan></text>
</svg></span></span> we define</p>
<div class="pretex-display"><svg height="2.43965em" version="1.1" class="pretex" viewBox="215 1 73 28"><text transform="translate(216.19 18.261)"><tspan y="0" x="0" class="a">A</tspan></text>

<text transform="translate(267.863 10.76)"><tspan y="0" x="0" class="a">n</tspan></text>
<text transform="translate(251.232 24.707)"><tspan y="0" x="0 16.492449" class="e">12</tspan></text>

<text transform="translate(284.619 18.261)"><tspan y="0" x="0" class="e">.</tspan></text>
</svg></div>

<div class="pretex-display"><svg height="1.1327em" version="1.1" class="pretex" viewBox="221 5 60 13"><text transform="translate(222.732 13.948)"><tspan y="0" x="0" class="a">A</tspan></text>

<text transform="translate(246.146 13.948)"><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(253.101 16.542)"><tspan y="0" x="0" class="f">3</tspan></text>

</svg></span></span> the matrix <span class="pretex-inline" style="width:1.02007em"><span style="height:0.9em;vertical-align:-0.226em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>

</svg></span></span> is not invertible, because its rows are identical:</p>
