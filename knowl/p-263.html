<p class="Cr2YB1FMqm8Uq1d23eihf">    In other words, <span class="pretex-inline" style="width:6.08952em"><span style="height:0.99766em;vertical-align:-0.23067em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">{</tspan></text>

</svg></span></span> is linearly dependent if there exist numbers <span class="pretex-inline" style="width:5.83652em"><span style="height:0.71567em;vertical-align:-0.23067em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="b">x</tspan></text>
