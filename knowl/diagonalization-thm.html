<span class="type">Diagonalization Theorem</span><span class="codenumber">5.4.7</span>
</h5>
<p>An <span class="pretex-inline" style="width:2.26499em"><span style="height:0.609em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">n</tspan></text>
<text transform="translate(8.803)"><tspan y="0" x="0" class="b">×</tspan></text>
<text transform="translate(19.614)"><tspan y="0" x="0" class="a">n</tspan></text>
</svg></span></span> matrix <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
</svg></span></span> is diagonalizable if and only if <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
</svg></span></span> has <span class="pretex-inline" style="width:0.581em"><span style="height:0.4925em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">n</tspan></text>
</svg></span></span> linearly independent eigenvectors.</p>
<p>In this case, <span class="pretex-inline" style="width:4.89939em"><span style="height:0.86816em;vertical-align:-0.0115em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>

<text transform="translate(51.478 -4.579)"><tspan y="0" x="0" class="e">1</tspan></text>
</svg></span></span> for</p>
