<h5 class="heading C_qMZvGBiL0M34_wkgdlS"><span class="type">Paragraph</span></h5>
<p class="C_qMZvGBiL0M34_wkgdlS">Let <span class="pretex-inline" style="width:6.08952em"><span style="height:0.99766em;vertical-align:-0.23067em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">{</tspan></text>
<text transform="translate(5.739)"><tspan y="0" x="0" class="b">v</tspan></text>
<text transform="translate(10.662 2.594)"><tspan y="0" x="0" class="c">1</tspan></text>
<text transform="translate(15.414)"><tspan y="0" x="0" class="d">,</tspan></text>
<text transform="translate(20.78)"><tspan y="0" x="0" class="b">v</tspan></text>
<text transform="translate(25.704 2.594)"><tspan y="0" x="0" class="c">2</tspan></text>
<text transform="translate(30.456)"><tspan y="0" x="0 4.7859092 9.5832949 14.369204 19.16659" class="d">,...,</tspan></text>
<text transform="translate(54.988)"><tspan y="0" x="0" class="b">v</tspan></text>
<text transform="translate(60.103 2.594)"><tspan y="0" x="0" class="e">k</tspan></text>
<text transform="translate(64.725)"><tspan y="0" x="0" class="a">}</tspan></text>
</svg></span></span> be a basis of the <span class="pretex-bind"><span class="pretex-inline" style="width:0.651em"><span style="height:0.739em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="f">λ</tspan></text>
</svg></span></span>-eigenspace</span> of <span class="pretex-inline" style="width:0.931em"><span style="height:0.688em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="b">B</tspan></text>
<text transform="translate(7.494)"><tspan y="0" x="0" class="d">.</tspan></text>
</svg></span></span>  We claim that <span class="pretex-inline" style="width:8.25551em"><span style="height:0.99766em;vertical-align:-0.23067em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">{</tspan></text>
<text transform="translate(5.452)"><tspan y="0" x="0 8.5733194" class="b">Cv</tspan></text>
<text transform="translate(18.949 2.594)"><tspan y="0" x="0" class="c">1</tspan></text>
<text transform="translate(23.701)"><tspan y="0" x="0" class="d">,</tspan></text>
<text transform="translate(28.779)"><tspan y="0" x="0 8.5733194" class="b">Cv</tspan></text>
<text transform="translate(42.276 2.594)"><tspan y="0" x="0" class="c">2</tspan></text>
<text transform="translate(47.029)"><tspan y="0" x="0 4.7859092 9.5832949 14.369204 19.16659" class="d">,...,</tspan></text>
<text transform="translate(71.274)"><tspan y="0" x="0 8.5733194" class="b">Cv</tspan></text>
<text transform="translate(84.962 2.594)"><tspan y="0" x="0" class="e">k</tspan></text>
<text transform="translate(89.584)"><tspan y="0" x="0" class="a">}</tspan></text>
</svg></span></span> is linearly independent.  Suppose that</p>
<div class="pretex-display C_qMZvGBiL0M34_wkgdlS"><svg height="1.1327em" version="1.1" class="pretex" viewBox="172 5 160 13"><text transform="translate(172.682 13.948)"><tspan y="0" x="0" class="b">c</tspan></text>
<text transform="translate(177.204 16.542)"><tspan y="0" x="0" class="c">1</tspan></text>
<text transform="translate(182.243 13.948)"><tspan y="0" x="0 8.5733194" class="b">Cv</tspan></text>
<text transform="translate(195.74 16.542)"><tspan y="0" x="0" class="c">1</tspan></text>
<text transform="translate(202.627 13.948)"><tspan y="0" x="0" class="g">+</tspan></text>
<text transform="translate(213.438 13.948)"><tspan y="0" x="0" class="b">c</tspan></text>
<text transform="translate(217.96 16.542)"><tspan y="0" x="0" class="c">2</tspan></text>
<text transform="translate(223 13.948)"><tspan y="0" x="0 8.5733194" class="b">Cv</tspan></text>
<text transform="translate(236.497 16.542)"><tspan y="0" x="0" class="c">2</tspan></text>
<text transform="translate(243.384 13.948)"><tspan y="0" x="0" class="g">+</tspan></text>
<text transform="translate(253.908 13.948)"><tspan y="0" x="0 4.8203402 9.6521568" class="a">···</tspan></text>
<text transform="translate(268.92 13.948)"><tspan y="0" x="0" class="g">+</tspan></text>
<text transform="translate(279.731 13.948)"><tspan y="0" x="0" class="b">c</tspan></text>
<text transform="translate(284.444 16.542)"><tspan y="0" x="0" class="e">k</tspan></text>
<text transform="translate(289.353 13.948)"><tspan y="0" x="0 8.5733194" class="b">Cv</tspan></text>
<text transform="translate(303.042 16.542)"><tspan y="0" x="0" class="e">k</tspan></text>
<text transform="translate(310.332 13.948)"><tspan y="0" x="0" class="g">=</tspan></text>
<text transform="translate(322.033 13.948)"><tspan y="0" x="0 6.3812122" class="d">0.</tspan></text>
</svg></div>
<p class="C_qMZvGBiL0M34_wkgdlS">Regrouping, this means</p>
<div class="pretex-display C_qMZvGBiL0M34_wkgdlS"><svg height="1.48122em" version="1.1" class="pretex" viewBox="175 2 154 17"><text transform="translate(175.964 13.948)"><tspan y="0" x="0" class="b">C</tspan></text>
<text transform="translate(183.964 3.682)"><tspan y="0" x="0" class="h">A</tspan></text>
<text transform="translate(189.255 13.948)"><tspan y="0" x="0" class="b">c</tspan></text>
<text transform="translate(193.777 16.542)"><tspan y="0" x="0" class="c">1</tspan></text>
<text transform="translate(199.103 13.948)"><tspan y="0" x="0" class="b">v</tspan></text>
<text transform="translate(204.027 16.542)"><tspan y="0" x="0" class="c">1</tspan></text>
<text transform="translate(210.914 13.948)"><tspan y="0" x="0" class="g">+</tspan></text>
<text transform="translate(221.725 13.948)"><tspan y="0" x="0" class="b">c</tspan></text>
<text transform="translate(226.247 16.542)"><tspan y="0" x="0" class="c">2</tspan></text>
<text transform="translate(231.573 13.948)"><tspan y="0" x="0" class="b">v</tspan></text>
<text transform="translate(236.497 16.542)"><tspan y="0" x="0" class="c">2</tspan></text>
<text transform="translate(243.384 13.948)"><tspan y="0" x="0" class="g">+</tspan></text>
<text transform="translate(253.908 13.948)"><tspan y="0" x="0 4.8203402 9.6521568" class="a">···</tspan></text>
<text transform="translate(268.92 13.948)"><tspan y="0" x="0" class="g">+</tspan></text>
<text transform="translate(279.731 13.948)"><tspan y="0" x="0" class="b">c</tspan></text>
<text transform="translate(284.444 16.542)"><tspan y="0" x="0" class="e">k</tspan></text>
<text transform="translate(289.64 13.948)"><tspan y="0" x="0" class="b">v</tspan></text>
<text transform="translate(294.755 16.542)"><tspan y="0" x="0" class="e">k</tspan></text>
<text transform="translate(299.378 3.682)"><tspan y="0" x="0" class="h">B</tspan></text>
<text transform="translate(307.05 13.948)"><tspan y="0" x="0" class="g">=</tspan></text>
<text transform="translate(318.751 13.948)"><tspan y="0" x="0 6.3812122" class="d">0.</tspan></text>
</svg></div>
<p class="C_qMZvGBiL0M34_wkgdlS">By the <a knowl="./knowl/imt-2.html?vers=b58525" knowl-id="xref-imt-2" alt="Invertible Matrix Theorem 5.1.31 " title="Invertible Matrix Theorem 5.1.31 ">invertible matrix theorem in Section 5.1</a>, the null space of <span class="pretex-inline" style="width:0.722em"><span style="height:0.695em;vertical-align:-0.0115em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="b">C</tspan></text>
</svg></span></span> is trivial, so this implies</p>
<div class="pretex-display C_qMZvGBiL0M34_wkgdlS"><svg height="1.1327em" version="1.1" class="pretex" viewBox="185 5 134 13"><text transform="translate(185.112 13.948)"><tspan y="0" x="0" class="b">c</tspan></text>
<text transform="translate(189.634 16.542)"><tspan y="0" x="0" class="c">1</tspan></text>
<text transform="translate(194.96 13.948)"><tspan y="0" x="0" class="b">v</tspan></text>
<text transform="translate(199.883 16.542)"><tspan y="0" x="0" class="c">1</tspan></text>
<text transform="translate(206.77 13.948)"><tspan y="0" x="0" class="g">+</tspan></text>
<text transform="translate(217.582 13.948)"><tspan y="0" x="0" class="b">c</tspan></text>
<text transform="translate(222.104 16.542)"><tspan y="0" x="0" class="c">2</tspan></text>
<text transform="translate(227.43 13.948)"><tspan y="0" x="0" class="b">v</tspan></text>
<text transform="translate(232.353 16.542)"><tspan y="0" x="0" class="c">2</tspan></text>
<text transform="translate(239.24 13.948)"><tspan y="0" x="0" class="g">+</tspan></text>
<text transform="translate(249.765 13.948)"><tspan y="0" x="0 4.8203402 9.6521568" class="a">···</tspan></text>
<text transform="translate(264.777 13.948)"><tspan y="0" x="0" class="g">+</tspan></text>
<text transform="translate(275.588 13.948)"><tspan y="0" x="0" class="b">c</tspan></text>
<text transform="translate(280.301 16.542)"><tspan y="0" x="0" class="e">k</tspan></text>
<text transform="translate(285.497 13.948)"><tspan y="0" x="0" class="b">v</tspan></text>
<text transform="translate(290.612 16.542)"><tspan y="0" x="0" class="e">k</tspan></text>
<text transform="translate(297.903 13.948)"><tspan y="0" x="0" class="g">=</tspan></text>
<text transform="translate(309.604 13.948)"><tspan y="0" x="0 6.3812122" class="d">0.</tspan></text>
</svg></div>
<p class="C_qMZvGBiL0M34_wkgdlS">Since <span class="pretex-inline" style="width:5.18952em"><span style="height:0.71567em;vertical-align:-0.23067em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="b">v</tspan></text>
<text transform="translate(5.498 2.594)"><tspan y="0" x="0" class="c">1</tspan></text>
<text transform="translate(10.25)"><tspan y="0" x="0" class="d">,</tspan></text>
<text transform="translate(15.615)"><tspan y="0" x="0" class="b">v</tspan></text>
<text transform="translate(20.539 2.594)"><tspan y="0" x="0" class="c">2</tspan></text>
<text transform="translate(25.291)"><tspan y="0" x="0 4.7973862 9.5832949 14.380681 19.16659" class="d">,...,</tspan></text>
<text transform="translate(49.823)"><tspan y="0" x="0" class="b">v</tspan></text>
<text transform="translate(54.938 2.594)"><tspan y="0" x="0" class="e">k</tspan></text>
</svg></span></span> are linearly independent, we get <span class="pretex-inline" style="width:9.4685em"><span style="height:0.91716em;vertical-align:-0.23067em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="b">c</tspan></text>
<text transform="translate(4.809 2.594)"><tspan y="0" x="0" class="c">1</tspan></text>
<text transform="translate(12.23)"><tspan y="0" x="0" class="g">=</tspan></text>
<text transform="translate(24.217)"><tspan y="0" x="0" class="b">c</tspan></text>
<text transform="translate(28.739 2.594)"><tspan y="0" x="0" class="c">2</tspan></text>
<text transform="translate(36.16)"><tspan y="0" x="0" class="g">=</tspan></text>
<text transform="translate(47.861)"><tspan y="0" x="0 4.8203402 9.6521568" class="a">···</tspan></text>
<text transform="translate(63.406)"><tspan y="0" x="0" class="g">=</tspan></text>
<text transform="translate(75.394)"><tspan y="0" x="0" class="b">c</tspan></text>
<text transform="translate(80.107 2.594)"><tspan y="0" x="0" class="e">k</tspan></text>
<text transform="translate(87.398)"><tspan y="0" x="0" class="g">=</tspan></text>
<text transform="translate(99.098)"><tspan y="0" x="0 6.3812122" class="d">0,</tspan></text>
</svg></span></span> as desired.</p>
