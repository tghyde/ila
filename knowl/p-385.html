<h5 class="heading CzRFs-IvPaoD5zQsnHBdz"><span class="type">Paragraph</span></h5>
<p class="CzRFs-IvPaoD5zQsnHBdz">  Computing a basis for a span is the same as computing a basis for a column space.  Indeed, the span of finitely many vectors <span class="pretex-inline" style="width:5.37352em"><span style="height:0.716em;vertical-align:-0.231em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">v</tspan></text>

<text transform="translate(20.539 2.594)"><tspan y="0" x="0" class="b">2</tspan></text>

</svg></span></span> <em>is</em> the column space of a matrix, namely, the matrix <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
</svg></span></span> whose columns are <span class="pretex-inline" style="width:5.69252em"><span style="height:0.7245em;vertical-align:-0.231em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">v</tspan></text>
