<text transform="translate(260.984 10.76)"><tspan y="0" x="0 20.543831" class="d">12</tspan></text>
<text transform="translate(227.86 24.707)"><tspan y="0" x="0" class="e">−</tspan></text>

<text transform="translate(302.474 18.261)"><tspan y="0" x="0" class="d">,</tspan></text>
</svg></div>
<p>and define <span class="pretex-inline" style="width:5.07312em"><span style="height:0.86467em;vertical-align:-0.008em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(9.503)"><tspan y="0" x="0" class="d">:</tspan></text>
<text transform="translate(16.366)"><tspan y="0" x="0" class="f">R</tspan></text>
<text transform="translate(24.067 -4.579)"><tspan y="0" x="0" class="g">3</tspan></text>
<text transform="translate(31.488)"><tspan y="0" x="0" class="e">→</tspan></text>
<text transform="translate(45.771)"><tspan y="0" x="0" class="f">R</tspan></text>
<text transform="translate(53.472 -4.579)"><tspan y="0" x="0" class="g">2</tspan></text>
</svg></span></span> by <span class="pretex-inline" style="width:4.89499em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(8.436)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(13.807)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(20.337)"><tspan y="0" x="0 7.1788635" class="b">)=</tspan></text>
<text transform="translate(39.217)"><tspan y="0" x="0 7.2419872" class="a">Ax</tspan></text>
<text transform="translate(52.989)"><tspan y="0" x="0" class="d">.</tspan></text>
</svg></span></span>  This transformation is neither one-to-one nor onto, as we saw in this <a knowl="./knowl/one-to-one-eg-neither1.html?vers=b58525" knowl-id="xref-one-to-one-eg-neither1" alt="Example 3.2.12 A matrix transformation that is not one-to-one" title="Example 3.2.12 A matrix transformation that is not one-to-one">example</a> and this <a knowl="./knowl/one-to-one-eg-neither2.html?vers=b58525" knowl-id="xref-one-to-one-eg-neither2" alt="Example 3.2.24 A matrix transformation that is not onto" title="Example 3.2.24 A matrix transformation that is not onto">example</a>.</p>

</div>
<figcaption><span class="heading">Figure</span><span class="codenumber">29</span>A picture of the matrix transformation <span class="pretex-inline" style="width:1.013em"><span style="height:0.688em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(8.436)"><tspan y="0" x="0" class="d">.</tspan></text>
</svg></span></span>  The violet plane is the solution set of <span class="pretex-inline" style="width:4.25099em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(8.436)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(13.807)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(20.337)"><tspan y="0" x="0 7.1788635" class="b">)=</tspan></text>
<text transform="translate(39.217)"><tspan y="0" x="0 6.3812122" class="d">0.</tspan></text>
</svg></span></span>  If you drag <span class="pretex-inline" style="width:0.644em"><span style="height:0.4925em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">x</tspan></text>
</svg></span></span> along the violet plane, the output <span class="pretex-inline" style="width:4.61699em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(8.436)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(13.807)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(20.337)"><tspan y="0" x="0 7.1788635" class="b">)=</tspan></text>
<text transform="translate(39.217)"><tspan y="0" x="0 7.2419872" class="a">Ax</tspan></text>
</svg></span></span> does not change.  This demonstrates that <span class="pretex-inline" style="width:3.97299em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(8.436)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(13.807)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(20.337)"><tspan y="0" x="0 7.1788635" class="b">)=</tspan></text>
<text transform="translate(39.217)"><tspan y="0" x="0" class="d">0</tspan></text>
</svg></span></span> has more than one solution, so <span class="pretex-inline" style="width:0.735em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
</svg></span></span> is not one-to-one.   The range of <span class="pretex-inline" style="width:0.735em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
</svg></span></span> is the violet line on the right; this is smaller than the codomain <span class="pretex-inline" style="width:1.36307em"><span style="height:0.87066em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="f">R</tspan></text>
<text transform="translate(7.701 -4.579)"><tspan y="0" x="0" class="g">2</tspan></text>
<text transform="translate(12.453)"><tspan y="0" x="0" class="d">.</tspan></text>
</svg></span></span>  If you drag <span class="pretex-inline" style="width:0.607em"><span style="height:0.7415em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">b</tspan></text>
</svg></span></span> off of the violet line, then the equation <span class="pretex-inline" style="width:3.05899em"><span style="height:0.7415em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 7.2419872" class="a">Ax</tspan></text>
<text transform="translate(16.441)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(29.002)"><tspan y="0" x="0" class="a">b</tspan></text>
</svg></span></span> becomes inconsistent; this means <span class="pretex-inline" style="width:4.02399em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(8.436)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(13.807)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(20.337)"><tspan y="0" x="0 7.1788635" class="b">)=</tspan></text>
<text transform="translate(40.078)"><tspan y="0" x="0" class="a">b</tspan></text>
</svg></span></span> has no solution.</figcaption></figure></article></body>
