<h5 class="heading CkfgdMzsiUjbMSg8YgzDL"><span class="type">Paragraph</span></h5>
<p class="CkfgdMzsiUjbMSg8YgzDL">By the <a knowl="./knowl/rank-theorem.html?vers=b58525" knowl-id="xref-rank-theorem" alt="Rank Theorem 2.9.2 " title="Rank Theorem 2.9.2 ">rank theorem in Section 2.9</a>, we have</p>

<p class="CkfgdMzsiUjbMSg8YgzDL">On the other hand the <a knowl="./knowl/orthocomp-facts-basic.html?vers=b58525" knowl-id="xref-orthocomp-facts-basic" alt="Fact 6.2.16 Facts about Orthogonal Complements" title="Fact 6.2.16 Facts about Orthogonal Complements">third fact</a> says that</p>
