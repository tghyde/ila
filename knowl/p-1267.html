<text transform="translate(14.652)"><tspan y="0" x="0" class="c">,</tspan></text>
</svg></span></span> do not blindly compute <span class="pretex-inline" style="width:5.06239em"><span style="height:1.04566em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 3.833318 9.6521568" class="c">tan</tspan></text>

<text transform="translate(54.911)"><tspan y="0" x="0" class="c">,</tspan></text>
