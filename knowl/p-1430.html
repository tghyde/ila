<text transform="translate(7.892 -4.579)"><tspan y="0" x="0" class="e">n</tspan></text>
</svg></span></span> we have</p>

</svg></span></span> is in <span class="pretex-inline" style="width:2.90599em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 8.1831007 14.713514" class="d">Nul</tspan></text>

<text transform="translate(28.842)"><tspan y="0" x="0" class="b">)</tspan></text>
</svg></span></span> if and only if <span class="pretex-inline" style="width:0.644em"><span style="height:0.4925em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">x</tspan></text>
