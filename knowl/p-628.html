<p class="Cvk81sMlRPnNbMae8rwxF">We computed in this <a knowl="./knowl/linear-trans-matrix-of-id.html?vers=0b5e19" knowl-id="xref-linear-trans-matrix-of-id" alt="Example 3.3.22 The standard matrix of the identity transformation" title="Example 3.3.22 The standard matrix of the identity transformation">example</a> that the matrix of the identity transform is the identity matrix: for every <span class="pretex-inline" style="width:0.644em"><span style="height:0.4925em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">x</tspan></text>
