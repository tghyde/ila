<h5 class="heading CwhHlfy_nHtWgwF1AmGtF"><span class="type">Paragraph</span></h5>
<p class="CwhHlfy_nHtWgwF1AmGtF">We observed in the previous <a knowl="./knowl/one-to-one-both-11-onto.html?vers=7e6906" knowl-id="xref-one-to-one-both-11-onto" alt="Example 3.2.34 Matrix transformations that are both one-to-one and onto" title="Example 3.2.34 Matrix transformations that are both one-to-one and onto">example</a> that a square matrix has a pivot in every row if and only if it has a pivot in every column.  Therefore, a matrix transformation <span class="pretex-inline" style="width:0.735em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
</svg></span></span> from <span class="pretex-inline" style="width:1.10174em"><span style="height:0.73033em;vertical-align:-0.008em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="b">R</tspan></text>
<text transform="translate(7.892 -4.579)"><tspan y="0" x="0" class="c">n</tspan></text>
</svg></span></span> to itself is one-to-one if and only if it is onto: in this case, the two notions are equivalent.</p>
