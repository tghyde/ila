<p class="CzWdQg_kTv5WCgFRQn0T2">Now suppose that <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
</svg></span></span> has a zero column.  Then <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
</svg></span></span> is not invertible by the <a knowl="./knowl/imt-1.html?vers=88014a" knowl-id="xref-imt-1" alt="Invertible Matrix Theorem 3.6.1 " title="Invertible Matrix Theorem 3.6.1 ">invertible matrix theorem in Section 3.6</a>, so its reduced row echelon form has a zero row.  Since row operations do not change whether the determinant is zero, we conclude <span class="pretex-inline" style="width:4.81798em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 6.4845052 12.119712" class="b">det</tspan></text>
