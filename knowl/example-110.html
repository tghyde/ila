<article class="example-like CNGWh9G3-oexJSoWLAC39"><h5 class="heading">
<span class="type">Example</span><span class="codenumber">3.2.32</span><span class="title">(A matrix transformation that is onto but not one-to-one)</span>
</h5>
<p>Let <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
</svg></span></span> be the matrix</p>
<div class="pretex-display"><svg height="2.43965em" version="1.1" class="pretex" viewbox="209 1 84 28"><text transform="translate(210.92 18.261)"><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(219.97 18.261)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(231.671 2.394)"><tspan y="0" x="0" class="c">A</tspan></text>
<text transform="translate(240.445 10.76)"><tspan y="0" x="0 16.343248 32.686497" class="d">110</tspan><tspan y="13.947" x="0 16.343248 32.686497" class="d">011</tspan></text>
<text transform="translate(281.115 2.394)"><tspan y="0" x="0" class="c">B</tspan></text>
<text transform="translate(289.889 18.261)"><tspan y="0" x="0" class="d">,</tspan></text>
</svg></div>
<p>and define <span class="pretex-inline" style="width:5.07312em"><span style="height:0.86467em;vertical-align:-0.008em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(9.503)"><tspan y="0" x="0" class="d">:</tspan></text>
<text transform="translate(16.366)"><tspan y="0" x="0" class="e">R</tspan></text>
<text transform="translate(24.067 -4.579)"><tspan y="0" x="0" class="f">3</tspan></text>
<text transform="translate(31.488)"><tspan y="0" x="0" class="g">→</tspan></text>
<text transform="translate(45.771)"><tspan y="0" x="0" class="e">R</tspan></text>
<text transform="translate(53.472 -4.579)"><tspan y="0" x="0" class="f">2</tspan></text>
</svg></span></span> by <span class="pretex-inline" style="width:4.89499em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(8.436)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(13.807)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(20.337)"><tspan y="0" x="0 7.1788635" class="b">)=</tspan></text>
<text transform="translate(39.217)"><tspan y="0" x="0 7.2419872" class="a">Ax</tspan></text>
<text transform="translate(52.989)"><tspan y="0" x="0" class="d">.</tspan></text>
</svg></span></span>  This transformation is onto but not one-to-one, as we saw in this <a knowl="./knowl/one-to-one-not11-onto2.html?vers=88014a" knowl-id="xref-one-to-one-not11-onto2" alt="Example 3.2.20 A matrix transformation that is onto" title="Example 3.2.20 A matrix transformation that is onto">example</a> and this <a knowl="./knowl/one-to-one-not11-onto2.html?vers=88014a" knowl-id="xref-one-to-one-not11-onto2" alt="Example 3.2.20 A matrix transformation that is onto" title="Example 3.2.20 A matrix transformation that is onto">example</a>.</p>
<figure class="figure-like"><div id="mathbox-68" class="mathbox" style="height:500px;">
<iframe src="demos/Axequalsb.html?mat=1,1,0:0,1,1&amp;range2=5&amp;closed=true&amp;show=true&amp;x=1,2,.5&amp;vers=88014a" title="Interactive Figure"></iframe><div class="maximizer"></div>
<div class="minimizer"></div>
</div>
<figcaption><span class="heading">Figure</span><span class="codenumber">33</span>A picture of the matrix transformation <span class="pretex-inline" style="width:1.013em"><span style="height:0.688em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(8.436)"><tspan y="0" x="0" class="d">.</tspan></text>
</svg></span></span>  Every vector on the right side is the output of <span class="pretex-inline" style="width:0.735em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
</svg></span></span> for a suitable input.  If you drag <span class="pretex-inline" style="width:0.885em"><span style="height:0.904em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">b</tspan></text>
<text transform="translate(6.967)"><tspan y="0" x="0" class="d">,</tspan></text>
</svg></span></span> the demo will find an input vector <span class="pretex-inline" style="width:0.644em"><span style="height:0.4925em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">x</tspan></text>
</svg></span></span> with output <span class="pretex-inline" style="width:0.885em"><span style="height:0.748em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">b</tspan></text>
<text transform="translate(6.967)"><tspan y="0" x="0" class="d">.</tspan></text>
</svg></span></span>  The violet line is the null space of <span class="pretex-inline" style="width:0.834em"><span style="height:0.844em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(6.381)"><tspan y="0" x="0" class="d">,</tspan></text>
</svg></span></span> i.e., solution set of <span class="pretex-inline" style="width:4.25099em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(8.436)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(13.807)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(20.337)"><tspan y="0" x="0 7.1788635" class="b">)=</tspan></text>
<text transform="translate(39.217)"><tspan y="0" x="0 6.3812122" class="d">0.</tspan></text>
</svg></span></span>  If you drag <span class="pretex-inline" style="width:0.644em"><span style="height:0.4925em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">x</tspan></text>
</svg></span></span> along the violet line, the output <span class="pretex-inline" style="width:4.61699em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(8.436)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(13.807)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(20.337)"><tspan y="0" x="0 7.1788635" class="b">)=</tspan></text>
<text transform="translate(39.217)"><tspan y="0" x="0 7.2419872" class="a">Ax</tspan></text>
</svg></span></span> does not change.  This demonstrates that <span class="pretex-inline" style="width:3.97299em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(8.436)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(13.807)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(20.337)"><tspan y="0" x="0 7.1788635" class="b">)=</tspan></text>
<text transform="translate(39.217)"><tspan y="0" x="0" class="d">0</tspan></text>
</svg></span></span> has more than one solution, so <span class="pretex-inline" style="width:0.735em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
</svg></span></span> is not one-to-one.</figcaption></figure></article><span class="incontext CNGWh9G3-oexJSoWLAC39"><a href="one-to-one-onto.html#example-110">in-context</a></span>
