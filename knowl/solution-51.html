</svg></span></span> is</p>
<div class="pretex-display"><svg height="3.48522em" version="1.1" class="pretex" viewbox="229 2 47 40"><text transform="translate(228.251 3.417)"><tspan y="0" x="0" class="b">A</tspan></text>
<text transform="translate(238.242 10.76)"><tspan y="0" x="0 16.343248" class="c">10</tspan><tspan y="13.947" x="0 16.343248" class="c">01</tspan><tspan y="27.895" x="0 16.343248" class="c">00</tspan></text>
<text transform="translate(262.568 3.417)"><tspan y="0" x="0" class="b">B</tspan></text>
<text transform="translate(272.559 25.235)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></div>
<p>Hence <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
</svg></span></span> does not have a pivot in every row, so <span class="pretex-inline" style="width:0.735em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
</svg></span></span> is not onto.  In fact, since</p>
<div class="pretex-display"><svg height="3.48522em" version="1.1" class="pretex" viewbox="174 2 157 40"><text transform="translate(174.125 25.235)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(183.588 9.368)"><tspan y="0" x="0" class="b">C</tspan></text>
<text transform="translate(191.852 17.733)"><tspan y="0" x="0" class="a">x</tspan><tspan y="13.948" x="0.34400001" class="a">y</tspan></text>
<text transform="translate(198.612 9.368)"><tspan y="0" x="0" class="b">D</tspan></text>
<text transform="translate(208.453 25.235)"><tspan y="0" x="0" class="d">=</tspan></text>
<text transform="translate(220.154 3.417)"><tspan y="0" x="0" class="b">A</tspan></text>
<text transform="translate(230.145 10.76)"><tspan y="0" x="0 16.343248" class="c">10</tspan><tspan y="13.947" x="0 16.343248" class="c">01</tspan><tspan y="27.895" x="0 16.343248" class="c">10</tspan></text>
<text transform="translate(254.471 3.417)"><tspan y="0" x="0" class="b">B</tspan><tspan y="5.9510002" x="9.9899998" class="b">C</tspan></text>
<text transform="translate(272.725 17.734)"><tspan y="0" x="0" class="a">x</tspan><tspan y="13.947" x="0.34400001" class="a">y</tspan></text>
<text transform="translate(279.485 9.368)"><tspan y="0" x="0" class="b">D</tspan></text>
<text transform="translate(289.326 25.235)"><tspan y="0" x="0" class="d">=</tspan></text>
<text transform="translate(301.027 3.417)"><tspan y="0" x="0" class="b">A</tspan></text>
<text transform="translate(310.507 10.76)"><tspan y="0" x="0" class="a">x</tspan><tspan y="13.947" x="0.345" class="a">y</tspan><tspan y="27.895" x="0" class="a">x</tspan></text>
<text transform="translate(317.267 3.417)"><tspan y="0" x="0" class="b">B</tspan></text>
<text transform="translate(327.258 25.235)"><tspan y="0" x="0" class="c">,</tspan></text>
</svg></div>
<p>we see that for every output vector of <span class="pretex-inline" style="width:1.013em"><span style="height:0.844em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(8.436)"><tspan y="0" x="0" class="c">,</tspan></text>
</svg></span></span> the third entry is equal to the first.  Therefore,</p>
<div class="pretex-display"><svg height="1.1327em" version="1.1" class="pretex" viewbox="223 4 59 13"><text transform="translate(223.319 13.948)"><tspan y="0" x="0" class="a">b</tspan></text>
<text transform="translate(232.093 13.948)"><tspan y="0" x="0 11.705392" class="d">=(</tspan></text>
<text transform="translate(248.304 13.948)"><tspan y="0" x="0 6.3812122 11.178598 17.559811 22.345718" class="c">1,2,3</tspan></text>
<text transform="translate(277.031 13.948)"><tspan y="0" x="0" class="d">)</tspan></text>
</svg></div>
<p>is not in the range of <span class="pretex-inline" style="width:1.013em"><span style="height:0.688em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(8.436)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></span></span></p>
