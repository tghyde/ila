<p>Their composition is a linear transformation <span class="pretex-inline" style="width:7.00811em"><span style="height:0.87066em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>

<text transform="translate(28.52)"><tspan y="0" x="0" class="b">:</tspan></text>

<text transform="translate(72.489 -4.579)"><tspan y="0" x="0" class="d">2</tspan></text>
<text transform="translate(77.242)"><tspan y="0" x="0" class="b">.</tspan></text>

</svg></div>
