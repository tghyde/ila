<article class="theorem-like CiRJ0RhxXwnN3ydbR9lRS"><h5 class="heading">
<span class="type">Fact</span><span class="codenumber">5.1.19</span><span class="title">(Eigenvectors with distinct eigenvalues are linearly independent)</span>
</h5>
<p>Let <span class="pretex-inline" style="width:5.18952em"><span style="height:0.71567em;vertical-align:-0.23067em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">v</tspan></text>

<text transform="translate(10.25)"><tspan y="0" x="0" class="c">,</tspan></text>
<text transform="translate(15.615)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(20.539 2.594)"><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(25.291)"><tspan y="0" x="0 4.7973862 9.5832949 14.380681 19.16659" class="c">,...,</tspan></text>
<text transform="translate(49.823)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(54.938 2.594)"><tspan y="0" x="0" class="d">k</tspan></text>
</svg></span></span> be eigenvectors of a matrix <span class="pretex-inline" style="width:0.834em"><span style="height:0.844em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(6.381)"><tspan y="0" x="0" class="c">,</tspan></text>
</svg></span></span> and suppose that the corresponding eigenvalues <span class="pretex-inline" style="width:5.70552em"><span style="height:0.96967em;vertical-align:-0.23067em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="e">λ</tspan></text>
<text transform="translate(7.472 2.594)"><tspan y="0" x="0" class="b">1</tspan></text>
<text transform="translate(12.224)"><tspan y="0" x="0" class="c">,</tspan></text>
