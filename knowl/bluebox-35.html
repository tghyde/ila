<p>The above <a knowl="./knowl/dimension-defn-Bcoords.html?vers=88014a" knowl-id="xref-dimension-defn-Bcoords" alt="Definition 2.8.3 " title="Definition 2.8.3 ">definition</a> gives a way of using <span class="pretex-inline" style="width:1.2744em"><span style="height:0.73033em;vertical-align:-0.008em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">R</tspan></text>

</svg></span></span> to <em>label</em> the points of a subspace of dimension <span class="pretex-inline" style="width:1.159em"><span style="height:0.5075em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="c">m</tspan></text>
