<article class="bluebox CCXuCDWSr8JgNHpmE4Zai"><h5 class="heading">
<span class="type">Recipe</span><span class="codenumber">4.1.5</span><span class="title">(Recipe: Computing determinants by row reducing)</span>
</h5>
<p>Let <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
</svg></span></span> be a square matrix.  Suppose that you do some number of row operations on <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
</svg></span></span> to obtain a matrix <span class="pretex-inline" style="width:0.653em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">B</tspan></text>
</svg></span></span> in row echelon form.  Then</p>
