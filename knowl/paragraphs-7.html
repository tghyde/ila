</svg></span></span> to the head of <span class="pretex-inline" style="width:0.832em"><span style="height:0.499em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(6.358)"><tspan y="0" x="0" class="b">.</tspan></text>
</svg></span></span> For example,</p>
<div class="pretex-display"><svg height="2.43965em" version="1.1" class="pretex" viewbox="201 1 103 28"><text transform="translate(200.804 2.394)"><tspan y="0" x="0" style="fill:#377eb8" class="d">A</tspan></text>
<text transform="translate(207.977 10.76)"><tspan y="0" x="0" style="fill:#377eb8" class="b">1</tspan><tspan y="13.947" x="0" style="fill:#377eb8" class="b">4</tspan></text>
<text transform="translate(214.358 2.394)"><tspan y="0" x="0" style="fill:#377eb8" class="d">B</tspan></text>
<text transform="translate(223.666 18.261)"><tspan y="0" x="0" class="c">−</tspan></text>
<text transform="translate(234.191 2.394)"><tspan y="0" x="0" style="fill:#4daf4a" class="d">A</tspan></text>
<text transform="translate(241.364 10.76)"><tspan y="0" x="0" style="fill:#4daf4a" class="b">4</tspan><tspan y="13.947" x="0" style="fill:#4daf4a" class="b">2</tspan></text>
<text transform="translate(247.745 2.394)"><tspan y="0" x="0" style="fill:#4daf4a" class="d">B</tspan></text>
<text transform="translate(257.586 18.261)"><tspan y="0" x="0" class="e">=</tspan></text>
<text transform="translate(269.287 2.394)"><tspan y="0" x="0" class="d">A</tspan></text>
<text transform="translate(276.46 10.76)"><tspan y="0" x="0" class="c">−</tspan></text>
<text transform="translate(284.85 10.76)"><tspan y="0" x="0" class="b">3</tspan><tspan y="13.947" x="-4.1950002" class="b">2</tspan></text>
<text transform="translate(291.231 2.394)"><tspan y="0" x="0" class="d">B</tspan></text>
<text transform="translate(300.005 18.261)"><tspan y="0" x="0" class="b">.</tspan></text>
</svg></div>
<p>Why? If you add <span class="pretex-inline" style="width:2.39499em"><span style="height:0.609em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(8.493)"><tspan y="0" x="0" class="c">−</tspan></text>
<text transform="translate(19.304)"><tspan y="0" x="0" class="a">w</tspan></text>
</svg></span></span> to <span class="pretex-inline" style="width:1.016em"><span style="height:0.655em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">w</tspan></text>
<text transform="translate(8.47)"><tspan y="0" x="0" class="b">,</tspan></text>
</svg></span></span> you get <span class="pretex-inline" style="width:0.832em"><span style="height:0.499em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(6.358)"><tspan y="0" x="0" class="b">.</tspan></text>
</svg></span></span> </p>
