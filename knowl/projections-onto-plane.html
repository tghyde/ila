<text transform="translate(11.775)"><tspan y="0" x="0" class="e">.</tspan></text>
</svg></span></span></p></article><div class="posterior CCiIooN23SsazYr0W6Kn1"><span class="solution"><span class="type">Solution</span><p>We have to solve the matrix equation <span class="pretex-inline" style="width:5.37778em"><span style="height:1.01833em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="c">A</tspan></text>

<text transform="translate(323.162 2.394)"><tspan y="0" x="0" class="f">F</tspan></text>

<p>We form an augmented matrix and row reduce:</p>
