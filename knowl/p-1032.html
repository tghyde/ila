<h5 class="heading Cb9Sj0zfhTodr6LOokVWa"><span class="type">Paragraph</span></h5>
<p class="Cb9Sj0zfhTodr6LOokVWa">Concretely, we have shown that the eigenvectors of <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
</svg></span></span> with eigenvalue <span class="pretex-inline" style="width:0.556em"><span style="height:0.6935em;vertical-align:-0.007em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="b">3</tspan></text>
</svg></span></span> are exactly the nonzero multiples of <span class="pretex-inline" style="width:2.008em"><span style="height:1.3395em;vertical-align:-0.3765em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0 -10.266)"><tspan y="0" x="0" class="c">A</tspan></text>
<text transform="translate(5.004 -5.899)"><tspan y="0" x="0" class="d">−</tspan></text>
<text transform="translate(10.597 -5.899)"><tspan y="0" x="0" class="e">4</tspan><tspan y="9.7089996" x="-2.796" class="e">1</tspan></text>
<text transform="translate(14.851 -10.266)"><tspan y="0" x="0" class="c">B</tspan></text>
<text transform="translate(19.855)"><tspan y="0" x="0" class="b">.</tspan></text>
</svg></span></span>  In particular, <span class="pretex-inline" style="width:1.73em"><span style="height:1.3395em;vertical-align:-0.3765em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0 -10.266)"><tspan y="0" x="0" class="c">A</tspan></text>
<text transform="translate(5.004 -5.899)"><tspan y="0" x="0" class="d">−</tspan></text>
<text transform="translate(10.597 -5.899)"><tspan y="0" x="0" class="e">4</tspan><tspan y="9.7089996" x="-2.796" class="e">1</tspan></text>
<text transform="translate(14.851 -10.266)"><tspan y="0" x="0" class="c">B</tspan></text>
</svg></span></span> is an eigenvector, which we can verify:</p>
