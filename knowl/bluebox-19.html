<article class="bluebox CfgVdu-gCjWmE7zy-Q9mC"><h5 class="heading">
<span class="type">Important Note</span><span class="codenumber">2.4.11</span>
</h5>
<p>In order to actually <em>find</em> a nontrivial solution to <span class="pretex-inline" style="width:3.00799em"><span style="height:0.694em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 7.2419872" class="a">Ax</tspan></text>
<text transform="translate(16.441)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(28.142)"><tspan y="0" x="0" class="c">0</tspan></text>
</svg></span></span> in the above <a knowl="./knowl/solnsets-eg-line.html?vers=cb75e0" knowl-id="xref-solnsets-eg-line" alt="Example 2.4.9 The solution set is a line" title="Example 2.4.9 The solution set is a line">example</a>, it suffices to substitute any nonzero value for the free variable <span class="pretex-inline" style="width:1.29407em"><span style="height:0.711em;vertical-align:-0.226em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(6.909 2.594)"><tspan y="0" x="0" class="d">2</tspan></text>
<text transform="translate(11.661)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></span></span>  For instance, taking <span class="pretex-inline" style="width:2.82406em"><span style="height:0.9125em;vertical-align:-0.226em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(6.909 2.594)"><tspan y="0" x="0" class="d">2</tspan></text>
<text transform="translate(14.33)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(26.031)"><tspan y="0" x="0" class="c">1</tspan></text>
</svg></span></span> gives the nontrivial solution <span class="pretex-inline" style="width:7.12031em"><span style="height:1.34817em;vertical-align:-0.3765em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">x</tspan></text>
