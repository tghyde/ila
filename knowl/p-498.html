<h5 class="heading C-xPcbykwBu3Ydr9gQCql"><span class="type">Paragraph</span></h5>
<p class="C-xPcbykwBu3Ydr9gQCql"> Here are some equivalent ways of saying that <span class="pretex-inline" style="width:0.735em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
</svg></span></span> is <em>not</em> one-to-one: </p>
<ul style="list-style-type: disc;" class="C-xPcbykwBu3Ydr9gQCql">
<li>There exists some vector <span class="pretex-inline" style="width:0.607em"><span style="height:0.7415em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">b</tspan></text>
</svg></span></span> in <span class="pretex-inline" style="width:1.2744em"><span style="height:0.73033em;vertical-align:-0.008em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="b">R</tspan></text>
<text transform="translate(7.892 -4.579)"><tspan y="0" x="0" class="c">m</tspan></text>
</svg></span></span> such that the equation <span class="pretex-inline" style="width:4.02399em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(8.436)"><tspan y="0" x="0" class="d">(</tspan></text>
<text transform="translate(13.807)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(20.337)"><tspan y="0" x="0 7.1788635" class="d">)=</tspan></text>
<text transform="translate(40.078)"><tspan y="0" x="0" class="a">b</tspan></text>
</svg></span></span> has <em>more than one</em> solution <span class="pretex-inline" style="width:0.644em"><span style="height:0.4925em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">x</tspan></text>
</svg></span></span> in <span class="pretex-inline" style="width:1.37973em"><span style="height:0.73633em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="b">R</tspan></text>
<text transform="translate(7.892 -4.579)"><tspan y="0" x="0" class="c">n</tspan></text>
<text transform="translate(12.645)"><tspan y="0" x="0" class="e">.</tspan></text>
</svg></span></span>
</li>
<li>There are two different inputs of <span class="pretex-inline" style="width:0.735em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
</svg></span></span> with the same output.</li>
<li>There exist vectors <span class="pretex-inline" style="width:1.5245em"><span style="height:0.654em;vertical-align:-0.169em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(6.347)"><tspan y="0" x="0" class="e">,</tspan></text>
<text transform="translate(11.712)"><tspan y="0" x="0" class="a">v</tspan></text>
</svg></span></span> such that <span class="pretex-inline" style="width:2.35899em"><span style="height:0.9em;vertical-align:-0.161em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(9.015)"><tspan y="0" x="0" class="f">A</tspan></text>
<text transform="translate(9.015)"><tspan y="0" x="0" class="d">=</tspan></text>
<text transform="translate(21.29)"><tspan y="0" x="0" class="a">v</tspan></text>
</svg></span></span> but <span class="pretex-inline" style="width:5.67898em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(8.436)"><tspan y="0" x="0" class="d">(</tspan></text>
<text transform="translate(12.946)"><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(19.293)"><tspan y="0" x="0 7.1788635" class="d">)=</tspan></text>

<text transform="translate(61.987)"><tspan y="0" x="0" class="e">.</tspan></text>
</svg></span></span>
</li>
</ul>
