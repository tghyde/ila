<p class="COCCk0BOGJ7zAuQVe2o1x">In this section, we give a recursive formula for the determinant of a matrix, called a <em>cofactor expansion</em>.  The formula is recursive in that we will compute the determinant of an <span class="pretex-inline" style="width:2.26499em"><span style="height:0.609em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">n</tspan></text>

<text transform="translate(19.614)"><tspan y="0" x="0" class="a">n</tspan></text>
</svg></span></span> matrix <em>assuming</em> we already know how to compute the determinant of an <span class="pretex-inline" style="width:7.15497em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="c">(</tspan></text>
