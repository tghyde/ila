<h5 class="heading CHhIb9xezcUeA1d_Jc9Dl"><span class="type">Paragraph</span></h5>
<p class="CHhIb9xezcUeA1d_Jc9Dl">In other words, the identity transformation does not move its input vector: the output is the same as the input.  Its domain and codomain are both <span class="pretex-inline" style="width:1.37973em"><span style="height:0.89233em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">R</tspan></text>
<text transform="translate(7.892 -4.579)"><tspan y="0" x="0" class="b">n</tspan></text>
<text transform="translate(12.645)"><tspan y="0" x="0" class="c">,</tspan></text>
</svg></span></span> and its range is <span class="pretex-inline" style="width:1.10174em"><span style="height:0.73033em;vertical-align:-0.008em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">R</tspan></text>
<text transform="translate(7.892 -4.579)"><tspan y="0" x="0" class="b">n</tspan></text>
</svg></span></span> as well, since every vector in <span class="pretex-inline" style="width:1.10174em"><span style="height:0.73033em;vertical-align:-0.008em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">R</tspan></text>
<text transform="translate(7.892 -4.579)"><tspan y="0" x="0" class="b">n</tspan></text>
</svg></span></span> is the output of itself.</p>
