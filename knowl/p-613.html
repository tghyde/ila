<h5 class="heading C7p93tLhFwLB2o0X1mzSN"><span class="type">Paragraph</span></h5>
<p class="C7p93tLhFwLB2o0X1mzSN">Now that we know that <span class="pretex-inline" style="width:1.71363em"><span style="height:0.97133em;vertical-align:-0.23133em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 3.7185481" class="a">Id</tspan></text>
<text transform="translate(10.203 2.594)"><tspan y="0" x="0" class="b">R</tspan></text>
<text transform="translate(15.481 0.513)"><tspan y="0" x="0" class="c">n</tspan></text>
</svg></span></span> is linear, it makes sense to compute its standard matrix. For each standard coordinate vector <span class="pretex-inline" style="width:1.01173em"><span style="height:0.716em;vertical-align:-0.231em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="d">e</tspan></text>
<text transform="translate(5.344 2.594)"><tspan y="0" x="0" class="e">i</tspan></text>
<text transform="translate(8.421)"><tspan y="0" x="0" class="a">,</tspan></text>
</svg></span></span> we have <span class="pretex-inline" style="width:5.45109em"><span style="height:0.998em;vertical-align:-0.231em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 3.7185481" class="a">Id</tspan></text>
<text transform="translate(10.203 2.594)"><tspan y="0" x="0" class="e">R</tspan></text>
<text transform="translate(14.953 0.513)"><tspan y="0" x="0" class="c">n</tspan></text>
<text transform="translate(19.14)"><tspan y="0" x="0" class="f">(</tspan></text>
<text transform="translate(23.937)"><tspan y="0" x="0" class="d">e</tspan></text>
<text transform="translate(28.994 2.594)"><tspan y="0" x="0" class="e">i</tspan></text>
<text transform="translate(32.071)"><tspan y="0" x="0 7.1788635" class="f">)=</tspan></text>
<text transform="translate(51.238)"><tspan y="0" x="0" class="d">e</tspan></text>
<text transform="translate(56.295 2.594)"><tspan y="0" x="0" class="e">i</tspan></text>
<text transform="translate(59.372)"><tspan y="0" x="0" class="a">.</tspan></text>
</svg></span></span>  In other words, the columns of the standard matrix of <span class="pretex-inline" style="width:1.71363em"><span style="height:0.97133em;vertical-align:-0.23133em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 3.7185481" class="a">Id</tspan></text>
<text transform="translate(10.203 2.594)"><tspan y="0" x="0" class="b">R</tspan></text>
<text transform="translate(15.481 0.513)"><tspan y="0" x="0" class="c">n</tspan></text>
</svg></span></span> are the standard coordinate vectors, so the standard matrix is the identity matrix</p>
