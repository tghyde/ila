<text transform="translate(8.436)"><tspan y="0" x="0" class="c">,</tspan></text>
</svg></span></span> the third entry is equal to the first.  Therefore,</p>
<div class="pretex-display CIZy4IHFWGjJAGM3QPX5j CIZy4IHFWGjJAGM3QPX5j"><svg height="1.1327em" version="1.1" class="pretex" viewbox="223 4 59 13"><text transform="translate(223.319 13.948)"><tspan y="0" x="0" class="a">b</tspan></text>
<text transform="translate(232.093 13.948)"><tspan y="0" x="0 11.705392" class="d">=(</tspan></text>
<text transform="translate(248.304 13.948)"><tspan y="0" x="0 6.3812122 11.178598 17.559811 22.345718" class="c">1,2,3</tspan></text>
<text transform="translate(277.031 13.948)"><tspan y="0" x="0" class="d">)</tspan></text>
</svg></div>
<p class="CIZy4IHFWGjJAGM3QPX5j">is not in the range of <span class="pretex-inline" style="width:1.013em"><span style="height:0.688em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>

</svg></span></span></p>
