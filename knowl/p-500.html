<ol style="list-style-type: decimal;" class="Cn7Jj2Uze60QXW-ORMSdb">

<text transform="translate(19.293)"><tspan y="0" x="0" class="b">)</tspan></text>
</svg></span></span> using the defining formula:

<text transform="translate(203.63 9.368)"><tspan y="0" x="0" class="c">D</tspan></text>

<text transform="translate(225.172 3.417)"><tspan y="0" x="0" class="c">A</tspan></text>
<text transform="translate(237.51 10.76)"><tspan y="0" x="0 3.2365141" class="d">ln</tspan></text>
<text transform="translate(247.266 10.76)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(251.776 10.76)"><tspan y="0" x="0" class="d">1</tspan></text>
<text transform="translate(258.157 10.76)"><tspan y="0" x="0" class="b">)</tspan></text>
<text transform="translate(233.562 24.707)"><tspan y="0" x="0 5.118742 11.304845" class="d">cos</tspan></text>
<text transform="translate(249.458 24.707)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(253.968 24.707)"><tspan y="0" x="0" class="e">π</tspan></text>
<text transform="translate(262.106 24.707)"><tspan y="0" x="0" class="b">)</tspan></text>
<text transform="translate(237.51 38.655)"><tspan y="0" x="0 3.2365141" class="d">ln</tspan></text>
<text transform="translate(247.266 38.655)"><tspan y="0" x="0" class="b">(</tspan></text>

<text transform="translate(312.536 3.417)"><tspan y="0" x="0" class="c">B</tspan></text>

</svg></div>
</li>
<li>We have

<text transform="translate(195.415 24.707)"><tspan y="0" x="0" class="e">π</tspan></text>
<text transform="translate(203.84 24.707)"><tspan y="0" x="0" class="a">n</tspan><tspan y="13.948" x="-9.0220003" class="a">e</tspan></text>
<text transform="translate(199.971 34.076)"><tspan y="0" x="0" class="g">7</tspan></text>
<text transform="translate(210.221 3.417)"><tspan y="0" x="0" class="c">B</tspan></text>

<text transform="translate(232.98 3.417)"><tspan y="0" x="0" class="c">A</tspan></text>
<text transform="translate(249.937 10.76)"><tspan y="0" x="0 3.2365141" class="d">ln</tspan></text>
<text transform="translate(259.692 10.76)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(264.489 10.76)"><tspan y="0" x="0" class="a">e</tspan></text>
<text transform="translate(269.643 6.18)"><tspan y="0" x="0" class="g">7</tspan></text>
<text transform="translate(274.395 10.76)"><tspan y="0" x="0" class="b">)</tspan></text>
<text transform="translate(241.369 24.707)"><tspan y="0" x="0 5.118742 11.304845" class="d">cos</tspan></text>
<text transform="translate(257.265 24.707)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(261.776 24.707)"><tspan y="0" x="0" class="d">2</tspan></text>

<text transform="translate(249.937 38.655)"><tspan y="0" x="0 3.2365141" class="d">ln</tspan></text>
<text transform="translate(259.692 38.655)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(264.489 38.655)"><tspan y="0" x="0" class="a">e</tspan></text>
<text transform="translate(269.643 34.076)"><tspan y="0" x="0" class="g">7</tspan></text>

<text transform="translate(318.621 10.76)"><tspan y="0" x="0" class="d">7</tspan><tspan y="13.947" x="0" class="d">1</tspan><tspan y="27.895" x="0" class="d">7</tspan></text>
<text transform="translate(325.002 3.417)"><tspan y="0" x="0" class="c">B</tspan></text>
</svg></div>
for any whole number <span class="pretex-inline" style="width:0.859em"><span style="height:0.499em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">n</tspan></text>
<text transform="translate(6.668)"><tspan y="0" x="0" class="d">.</tspan></text>
</svg></span></span>  Hence there are infinitely many such vectors.</li>
<li>The vector <span class="pretex-inline" style="width:0.607em"><span style="height:0.7415em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">b</tspan></text>
</svg></span></span> from the previous part is an example of such a vector.</li>
<li>Since <span class="pretex-inline" style="width:2.85499em"><span style="height:0.9845em;vertical-align:-0.2175em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 5.118742 11.304845" class="d">cos</tspan></text>
<text transform="translate(15.896)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(21.841)"><tspan y="0" x="0" class="a">y</tspan></text>
<text transform="translate(28.256)"><tspan y="0" x="0" class="b">)</tspan></text>
</svg></span></span> is always between <span class="pretex-inline" style="width:1.287em"><span style="height:0.7005em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="f">−</tspan></text>
<text transform="translate(8.39)"><tspan y="0" x="0" class="d">1</tspan></text>
</svg></span></span> and <span class="pretex-inline" style="width:0.834em"><span style="height:0.8565em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 6.3812122" class="d">1,</tspan></text>
</svg></span></span> the vector
<div class="pretex-display"><svg height="3.48522em" version="1.1" class="pretex" viewbox="229 2 46 40"><text transform="translate(229.287 25.235)"><tspan y="0" x="0" class="a">w</tspan></text>

<text transform="translate(266.61 3.417)"><tspan y="0" x="0" class="c">B</tspan></text>
</svg></div>
is not in the range of <span class="pretex-inline" style="width:1.013em"><span style="height:0.688em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
