<text transform="translate(8.39)"><tspan y="0" x="0 6.3812122" class="c">2,</tspan></text>
</svg></span></span> namely, any nonzero multiple of <span class="pretex-inline" style="width:1.52066em"><span style="height:1.34817em;vertical-align:-0.3765em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0 -10.266)"><tspan y="0" x="0" class="f">A</tspan></text>
