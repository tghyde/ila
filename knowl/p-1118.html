<p class="C4mk1mKzUlkrQlXw3lHFN">Then <span class="pretex-inline" style="width:5.10339em"><span style="height:1.02666em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(9.05)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(21.037)"><tspan y="0" x="0 8.2863941 15.998938" class="a">CBC</tspan></text>
<text transform="translate(45.036 -4.579)"><tspan y="0" x="0" class="f">−</tspan></text>
<text transform="translate(50.629 -4.579)"><tspan y="0" x="0" class="g">1</tspan></text>
<text transform="translate(55.381)"><tspan y="0" x="0" class="e">,</tspan></text>
</svg></span></span> as one can verify.  Let <span class="pretex-inline" style="width:3.5142em"><span style="height:0.71567em;vertical-align:-0.23067em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(5.498 2.594)"><tspan y="0" x="0" class="g">1</tspan></text>

<text transform="translate(25.291)"><tspan y="0" x="0" class="e">,</tspan></text>
<text transform="translate(30.657)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(35.58 2.594)"><tspan y="0" x="0" class="g">3</tspan></text>
</svg></span></span> be the columns of <span class="pretex-inline" style="width:1em"><span style="height:0.8535em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">C</tspan></text>
<text transform="translate(8.286)"><tspan y="0" x="0" class="e">,</tspan></text>
</svg></span></span> and let <span class="pretex-inline" style="width:6.61923em"><span style="height:0.99766em;vertical-align:-0.23067em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="h">B</tspan></text>
<text transform="translate(10.416)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(22.117)"><tspan y="0" x="0" class="d">{</tspan></text>
<text transform="translate(27.855)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(32.779 2.594)"><tspan y="0" x="0" class="g">1</tspan></text>
<text transform="translate(37.531)"><tspan y="0" x="0" class="e">,</tspan></text>

<text transform="translate(72.779)"><tspan y="0" x="0" class="e">,</tspan></text>
</svg></span></span> a basis of <span class="pretex-inline" style="width:1.36307em"><span style="height:0.87066em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="i">R</tspan></text>

<text transform="translate(12.453)"><tspan y="0" x="0" class="e">.</tspan></text>
</svg></span></span>  Then <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
</svg></span></span> does the same thing as <span class="pretex-inline" style="width:0.931em"><span style="height:0.844em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">B</tspan></text>

</svg></span></span> except <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
</svg></span></span> uses the <span class="pretex-bind"><span class="pretex-inline" style="width:0.67504em"><span style="height:0.67122em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="h">B</tspan></text>
</svg></span></span>-coordinate</span> system.  In other words: </p>

<text transform="translate(8.39)"><tspan y="0" x="0" class="e">1</tspan></text>
