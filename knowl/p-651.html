</svg></span></span> is the product <span class="pretex-inline" style="width:1.487em"><span style="height:0.844em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 6.6681371" class="a">AB</tspan></text>
<text transform="translate(13.876)"><tspan y="0" x="0" class="c">,</tspan></text>
</svg></span></span> so <span class="pretex-inline" style="width:7.99097em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>

<text transform="translate(18.799)"><tspan y="0" x="0" class="a">U</tspan></text>
<text transform="translate(27.453)"><tspan y="0" x="0" class="d">(</tspan></text>
<text transform="translate(32.824)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(39.355)"><tspan y="0" x="0 7.1788635 18.884256" class="d">)=(</tspan></text>
<text transform="translate(62.745)"><tspan y="0" x="0 6.6681371" class="a">AB</tspan></text>

<text transform="translate(88.522)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></span></span>  By associativity of matrix multiplication, we have <span class="pretex-inline" style="width:6.80798em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="d">(</tspan></text>

<text transform="translate(18.386)"><tspan y="0" x="0" class="d">)</tspan></text>
<text transform="translate(23.757)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(32.956)"><tspan y="0" x="0" class="d">=</tspan></text>
<text transform="translate(44.657)"><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(51.038)"><tspan y="0" x="0" class="d">(</tspan></text>
<text transform="translate(55.836)"><tspan y="0" x="0 8.0683308" class="a">Bx</tspan></text>

<text transform="translate(74.945)"><tspan y="0" x="0" class="c">,</tspan></text>
</svg></span></span> so the product <span class="pretex-inline" style="width:2.63899em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="d">(</tspan></text>
