<p class="CtLjr0b5NdH9IT4RgKD58">The function <span class="pretex-inline" style="width:4.75798em"><span style="height:0.71em;vertical-align:-0.008em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 4.5907998 7.8043599 15.390657" class="a">sin:</tspan></text>

<text transform="translate(46.906)"><tspan y="0" x="0" class="b">R</tspan></text>
</svg></span></span> is not one-to-one.  Indeed, <span class="pretex-inline" style="width:8.67097em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 4.5907998 7.8043599" class="a">sin</tspan></text>

<text transform="translate(58.418)"><tspan y="0" x="0" class="d">(</tspan></text>
<text transform="translate(62.928)"><tspan y="0" x="0" class="e">π</tspan></text>
<text transform="translate(71.066)"><tspan y="0" x="0 7.1788635" class="d">)=</tspan></text>
<text transform="translate(89.945)"><tspan y="0" x="0 6.3812122" class="a">0,</tspan></text>
</svg></span></span> so the inputs <span class="pretex-inline" style="width:0.556em"><span style="height:0.6935em;vertical-align:-0.007em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">0</tspan></text>
</svg></span></span> and <span class="pretex-inline" style="width:0.709em"><span style="height:0.485em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="e">π</tspan></text>
</svg></span></span> have the same output <span class="pretex-inline" style="width:0.834em"><span style="height:0.7005em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 6.3812122" class="a">0.</tspan></text>
