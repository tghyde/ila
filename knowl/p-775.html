<h5 class="heading CDIJ3fovnhN1e1LjNmSUn"><span class="type">Paragraph</span></h5>
<p class="CDIJ3fovnhN1e1LjNmSUn">By hypothesis, <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
</svg></span></span> does not satisfy condition 6 of the <a knowl="./knowl/imt-1.html?vers=88014a" knowl-id="xref-imt-1" alt="Invertible Matrix Theorem 3.6.1 " title="Invertible Matrix Theorem 3.6.1 ">invertible matrix theorem</a>.  Therefore, it does not satisfy condition <span class="pretex-inline" style="width:0.834em"><span style="height:0.8565em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 6.3812122" class="b">3,</tspan></text>
</svg></span></span> so <span class="pretex-inline" style="width:2.90599em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 8.1831007 14.713514" class="b">Nul</tspan></text>
<text transform="translate(17.95)"><tspan y="0" x="0" class="c">(</tspan></text>
<text transform="translate(22.461)"><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(28.842)"><tspan y="0" x="0" class="c">)</tspan></text>
</svg></span></span> is an infinite set.   If we take <span class="pretex-inline" style="width:2.69299em"><span style="height:0.904em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">b</tspan></text>
<text transform="translate(9.635)"><tspan y="0" x="0" class="c">=</tspan></text>
<text transform="translate(21.336)"><tspan y="0" x="0 6.3812122" class="b">0,</tspan></text>
</svg></span></span> then the equation <span class="pretex-inline" style="width:3.05899em"><span style="height:0.7415em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 7.2419872" class="a">Ax</tspan></text>
<text transform="translate(16.441)"><tspan y="0" x="0" class="c">=</tspan></text>
<text transform="translate(29.002)"><tspan y="0" x="0" class="a">b</tspan></text>
</svg></span></span> has infinitely many solutions.</p>
