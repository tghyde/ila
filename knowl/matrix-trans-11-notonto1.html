<div class="pretex-display"><svg height="3.48522em" version="1.1" class="pretex" viewbox="216 2 70 40"><text transform="translate(217.876 25.235)"><tspan y="0" x="0" class="a">A</tspan></text>

<text transform="translate(272.943 3.417)"><tspan y="0" x="0" class="c">B</tspan></text>
<text transform="translate(282.934 25.235)"><tspan y="0" x="0" class="d">,</tspan></text>
</svg></div>
<p>and define <span class="pretex-inline" style="width:5.07312em"><span style="height:0.86467em;vertical-align:-0.008em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>

</svg></span></span> by <span class="pretex-inline" style="width:4.89499em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>

<text transform="translate(39.217)"><tspan y="0" x="0 7.2419872" class="a">Ax</tspan></text>
<text transform="translate(52.989)"><tspan y="0" x="0" class="d">.</tspan></text>
</svg></span></span>  Is <span class="pretex-inline" style="width:0.735em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
</svg></span></span> one-to-one?</p></article><div class="posterior CtToXElhTR7JUHZYPtbBk"><span class="solution"><span class="type">Solution</span><p>The reduced row echelon form of <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
</svg></span></span> is</p>
<div class="pretex-display"><svg height="3.48522em" version="1.1" class="pretex" viewbox="229 2 47 40"><text transform="translate(228.251 3.417)"><tspan y="0" x="0" class="c">A</tspan></text>
<text transform="translate(238.242 10.76)"><tspan y="0" x="0 16.343248" class="d">10</tspan><tspan y="13.947" x="0 16.343248" class="d">01</tspan><tspan y="27.895" x="0 16.343248" class="d">00</tspan></text>
<text transform="translate(262.568 3.417)"><tspan y="0" x="0" class="c">B</tspan></text>

</svg></div>
<p>Hence <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
</svg></span></span> has a pivot in every column, so <span class="pretex-inline" style="width:0.735em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
</svg></span></span> is one-to-one.</p>
