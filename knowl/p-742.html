</svg></span></span> is</p>
<div class="pretex-display C1OjWtug685UKnAa135QD"><svg height="2.43965em" version="1.1" class="pretex" viewbox="205 1 92 28"><text transform="translate(206.904 18.261)"><tspan y="0" x="0" class="a">A</tspan></text>

<text transform="translate(12.189)"><tspan y="0" x="0" class="d">4</tspan></text>
<text transform="translate(21.238)"><tspan y="0" x="0" class="f">A</tspan></text>
<text transform="translate(21.238)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(32.939)"><tspan y="0" x="0 6.3812122" class="d">0,</tspan></text>
</svg></span></span> so <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>

<text transform="translate(248.286 24.707)"><tspan y="0" x="0" class="e">/</tspan></text>

<p class="C1OjWtug685UKnAa135QD">By the <a knowl="./knowl/matrix-inv-matrix-inv-comp.html?vers=88014a" knowl-id="xref-matrix-inv-matrix-inv-comp" alt="Theorem 3.5.29 " title="Theorem 3.5.29 ">theorem</a>, <span class="pretex-inline" style="width:0.735em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
</svg></span></span> is invertible, and its inverse is the matrix transformation for <span class="pretex-inline" style="width:1.7764em"><span style="height:0.87066em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
