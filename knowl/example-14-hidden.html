<body><article class="example-like COimzVtc71K3uEjxY8mE_"><p>The system of one linear equation</p>
<div class="pretex-display"><svg height="1.04557em" version="1.1" class="pretex" viewbox="218 5 68 12"><text transform="translate(219.394 13.948)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(228.059 13.948)"><tspan y="0" x="0" class="b">+</tspan></text>
<text transform="translate(240.018 13.948)"><tspan y="0" x="0" class="a">y</tspan></text>
<text transform="translate(248.568 13.948)"><tspan y="0" x="0" class="b">+</tspan></text>
<text transform="translate(259.093 13.948)"><tspan y="0" x="0" class="a">z</tspan></text>
<text transform="translate(267.385 13.948)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(279.086 13.948)"><tspan y="0" x="0" class="c">1</tspan></text>
</svg></div>
<p>comes from the augmented matrix</p>
<div class="pretex-display"><svg height="1.48122em" version="1.1" class="pretex" viewbox="215 2 74 17"><text transform="translate(215.293 3.682)"><tspan y="0" x="0" class="d">A</tspan></text>
<text transform="translate(221.898 13.42)"><tspan y="0" x="0 16.343248 32.686497" class="c">111</tspan></text>
<g transform="matrix(1,0,0,-1,265.948,17.605)"><path d="M 0,0 V 13.948" class="a"></path></g><text transform="translate(270.929 13.42)"><tspan y="0" x="0" class="c">1</tspan></text>
<text transform="translate(278.912 3.682)"><tspan y="0" x="0" class="d">B</tspan></text>
<text transform="translate(285.517 13.948)"><tspan y="0" x="0" class="c">,</tspan></text>
</svg></div>
<p>which is already in reduced row echelon form.  The free variables are <span class="pretex-inline" style="width:0.684em"><span style="height:0.7025em;vertical-align:-0.2175em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(1.435)"><tspan y="0" x="0" class="a">y</tspan></text>
</svg></span></span> and <span class="pretex-inline" style="width:0.768em"><span style="height:0.5035em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">z</tspan></text>
<text transform="translate(5.624)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></span></span>  The parametric form for the general solution is</p>
<div class="pretex-display"><svg height="1.1327em" version="1.1" class="pretex" viewbox="187 4 130 13"><text transform="translate(187.132 13.948)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(192.503 13.948)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(199.034 13.948)"><tspan y="0" x="0" class="c">,</tspan></text>
<text transform="translate(206.861 13.948)"><tspan y="0" x="0" class="a">y</tspan></text>
<text transform="translate(212.588 13.948)"><tspan y="0" x="0" class="c">,</tspan></text>
<text transform="translate(218.981 13.948)"><tspan y="0" x="0" class="a">z</tspan></text>
<text transform="translate(224.604 13.948)"><tspan y="0" x="0 7.1788635 18.884256" class="b">)=(</tspan></text>
<text transform="translate(247.995 13.948)"><tspan y="0" x="0" class="c">1</tspan></text>
<text transform="translate(256.51 13.948)"><tspan y="0" x="0" class="e">−</tspan></text>
<text transform="translate(267.035 13.948)"><tspan y="0" x="0" class="a">s</tspan></text>
<text transform="translate(273.703 13.948)"><tspan y="0" x="0" class="e">−</tspan></text>
<text transform="translate(284.916 13.948)"><tspan y="0" x="0" class="a">t</tspan></text>
<text transform="translate(289.633 13.948)"><tspan y="0" x="0" class="c">,</tspan></text>
<text transform="translate(296.026 13.948)"><tspan y="0" x="0" class="a">s</tspan></text>
<text transform="translate(300.559 13.948)"><tspan y="0" x="0" class="c">,</tspan></text>
<text transform="translate(307.64 13.948)"><tspan y="0" x="0" class="a">t</tspan></text>
<text transform="translate(312.357 13.948)"><tspan y="0" x="0" class="b">)</tspan></text>
</svg></div>
<p>for any values of <span class="pretex-inline" style="width:0.395em"><span style="height:0.4925em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">s</tspan></text>
</svg></span></span> and <span class="pretex-inline" style="width:0.749em"><span style="height:0.593em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.689)"><tspan y="0" x="0" class="a">t</tspan></text>
<text transform="translate(5.406)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></span></span>  This is a parametric equation for a plane in <span class="pretex-inline" style="width:1.36307em"><span style="height:0.87066em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="f">R</tspan></text>
<text transform="translate(7.701 -4.579)"><tspan y="0" x="0" class="g">3</tspan></text>
<text transform="translate(12.453)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></span></span></p>
