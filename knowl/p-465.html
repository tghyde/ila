<h5 class="heading CkEszrvb-bK1aAbaXPJms"><span class="type">Paragraph</span></h5>
<p class="CkEszrvb-bK1aAbaXPJms">Most of the functions you may have seen previously have domain and codomain equal to <span class="pretex-inline" style="width:3.28606em"><span style="height:0.87066em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">R</tspan></text>
<text transform="translate(10.369)"><tspan y="0" x="0" class="b">=</tspan></text>

<text transform="translate(29.771 -4.579)"><tspan y="0" x="0" class="c">1</tspan></text>
<text transform="translate(34.524)"><tspan y="0" x="0" class="d">.</tspan></text>
</svg></span></span>  For example,</p>

<text transform="translate(188.207 29.625)"><tspan y="0" x="0 4.5907998 7.8043599" class="d">sin</tspan></text>

<text transform="translate(244.266 9.616)"><tspan y="0" x="0 3.833318 10.306346 22.437534 25.674049 31.309256 37.828194 43.830662 47.663982 60.632992 66.819092 76.999191 80.832512 87.305542 99.436729 105.62283 111.94666 118.27048 124.45659 129.04739 132.26094 136.09427" class="d">thelengthoftheopposite</tspan><tspan y="13.947" x="0 5.6352072 12.119712 18.122183 26.982428 33.16853 38.838169 44.473373 52.071148 55.904469 62.377495 71.23774 77.71077 83.391884 89.715706 95.90181 99.73513 105.37034 111.88927 118.41969 123.01048 131.85925 138.04535" class="d">edgeoverthehypotenuseof</tspan><tspan y="27.895" x="0 9.1012611 13.485475 16.699036 22.701506 29.174534 36.278797 40.112114 44.49633 47.709888 53.528728 60.047665 66.050133 69.286652 78.204277 87.053047 90.266602 94.099922 103.85537 109.67421 116.19315 122.19562 125.43214" class="d">arighttrianglewithangle</tspan></text>

<p class="CkEszrvb-bK1aAbaXPJms">Notice that we have defined <span class="pretex-inline" style="width:1.248em"><span style="height:0.709em;vertical-align:-0.007em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 4.5907998 7.8043599" class="d">sin</tspan></text>
</svg></span></span> by a rule: a function is defined by specifying what the output of the function is for any possible input.</p>
