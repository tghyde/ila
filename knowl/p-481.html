<h5 class="heading Cz014lwRbW5HwiW2ZtkLd"><span class="type">Paragraph</span></h5>
<p class="Cz014lwRbW5HwiW2ZtkLd">The definition of a matrix transformation <span class="pretex-inline" style="width:0.735em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
</svg></span></span> tells us how to evaluate <span class="pretex-inline" style="width:0.735em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
</svg></span></span> on any given vector: we multiply the input vector by a matrix.  For instance, let</p>
