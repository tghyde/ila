<h5 class="heading CdgZF6ahgUIKgBctW1WFq"><span class="type">Paragraph</span></h5>
<p class="CdgZF6ahgUIKgBctW1WFq">Instead of parabolas and hyperbolas, our geometric objects are subspaces, such as lines and planes.  Our geometric objects will be something like 13-dimensional planes in <span class="pretex-inline" style="width:1.73373em"><span style="height:1.02666em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">R</tspan></text>
<text transform="translate(7.701 -4.579)"><tspan y="0" x="0 4.2541785" class="b">27</tspan></text>
<text transform="translate(16.707)"><tspan y="0" x="0" class="c">,</tspan></text>
</svg></span></span> etc.  It is amazing that we can say anything substantive about objects that we cannot directly visualize.</p>
