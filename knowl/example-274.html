<article class="example-like CxY3PPdva_100MuyMtN8j"><h5 class="heading">
<span class="type">Example</span><span class="codenumber">6.4.5</span>
</h5>
<p>Let <span class="pretex-inline" style="width:1.5995em"><span style="height:0.903em;vertical-align:-0.169em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">a</tspan></text>
<text transform="translate(6.599)"><tspan y="0" x="0" class="b">,</tspan></text>
<text transform="translate(12.252)"><tspan y="0" x="0" class="a">b</tspan></text>
</svg></span></span> be scalars, and let</p>
<div class="pretex-display"><svg height="2.43965em" version="1.1" class="pretex" viewBox="186 1 132 28"><text transform="translate(186.351 18.261)"><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(192.698 20.855)"><tspan y="0" x="0" class="c">1</tspan></text>
<text transform="translate(200.118 18.261)"><tspan y="0" x="0" class="d">=</tspan></text>
<text transform="translate(211.819 2.394)"><tspan y="0" x="0" class="e">A</tspan></text>
<text transform="translate(219.463 10.76)"><tspan y="0" x="0" class="a">a</tspan><tspan y="13.947" x="0.38999999" class="a">b</tspan></text>
<text transform="translate(225.959 2.394)"><tspan y="0" x="0" class="e">B</tspan></text>
<text transform="translate(257.687 18.261)"><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(264.034 20.855)"><tspan y="0" x="0" class="c">2</tspan></text>
<text transform="translate(271.454 18.261)"><tspan y="0" x="0" class="d">=</tspan></text>
<text transform="translate(283.155 2.394)"><tspan y="0" x="0" class="e">A</tspan></text>
<text transform="translate(290.328 10.76)"><tspan y="0" x="0" class="f">−</tspan></text>
<text transform="translate(299.579 10.76)"><tspan y="0" x="0" class="a">b</tspan><tspan y="13.947" x="-4.585" class="a">a</tspan></text>
<text transform="translate(305.685 2.394)"><tspan y="0" x="0" class="e">B</tspan></text>
<text transform="translate(314.459 18.261)"><tspan y="0" x="0" class="b">.</tspan></text>
</svg></div>
<p>Is <span class="pretex-inline" style="width:5.17867em"><span style="height:0.99766em;vertical-align:-0.23067em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="g">B</tspan></text>
<text transform="translate(10.416)"><tspan y="0" x="0" class="d">=</tspan></text>
<text transform="translate(22.117)"><tspan y="0" x="0" class="f">{</tspan></text>
<text transform="translate(27.281)"><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(33.628 2.594)"><tspan y="0" x="0" class="c">1</tspan></text>
<text transform="translate(38.38)"><tspan y="0" x="0" class="b">,</tspan></text>
<text transform="translate(43.172)"><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(49.519 2.594)"><tspan y="0" x="0" class="c">2</tspan></text>
<text transform="translate(54.271)"><tspan y="0" x="0" class="f">}</tspan></text>
</svg></span></span> orthogonal?</p></article><div class="posterior CxY3PPdva_100MuyMtN8j"><span class="solution"><span class="type">Solution</span><p>We only have to check that</p>
<div class="pretex-display"><svg height="2.43965em" version="1.1" class="pretex" viewBox="180 1 145 28"><text transform="translate(179.5 2.394)"><tspan y="0" x="0" class="e">A</tspan></text>
<text transform="translate(187.143 10.76)"><tspan y="0" x="0" class="a">a</tspan><tspan y="13.947" x="0.391" class="a">b</tspan></text>
<text transform="translate(193.639 2.394)"><tspan y="0" x="0" class="e">B</tspan></text>
<text transform="translate(202.947 18.261)"><tspan y="0" x="0" class="f">·</tspan></text>
<text transform="translate(208.307 2.394)"><tspan y="0" x="0" class="e">A</tspan></text>
<text transform="translate(215.48 10.76)"><tspan y="0" x="0" class="f">−</tspan></text>
<text transform="translate(224.731 10.76)"><tspan y="0" x="0" class="a">b</tspan><tspan y="13.947" x="-4.585" class="a">a</tspan></text>
<text transform="translate(230.836 2.394)"><tspan y="0" x="0" class="e">B</tspan></text>
<text transform="translate(240.678 18.261)"><tspan y="0" x="0" class="d">=</tspan></text>
<text transform="translate(252.379 18.261)"><tspan y="0" x="0" class="f">−</tspan></text>
<text transform="translate(261.055 18.261)"><tspan y="0" x="0 7.1731248" class="a">ab</tspan></text>
<text transform="translate(276.469 18.261)"><tspan y="0" x="0" class="d">+</tspan></text>
<text transform="translate(287.28 18.261)"><tspan y="0" x="0 7.1731248" class="a">ab</tspan></text>
<text transform="translate(303.228 18.261)"><tspan y="0" x="0" class="d">=</tspan></text>
<text transform="translate(314.928 18.261)"><tspan y="0" x="0 6.3812122" class="b">0.</tspan></text>
</svg></div>
<p>Therefore, <span class="pretex-inline" style="width:3.25163em"><span style="height:0.99766em;vertical-align:-0.23067em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="f">{</tspan></text>
<text transform="translate(5.165)"><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(11.511 2.594)"><tspan y="0" x="0" class="c">1</tspan></text>
<text transform="translate(16.264)"><tspan y="0" x="0" class="b">,</tspan></text>
<text transform="translate(21.055)"><tspan y="0" x="0" class="a">u</tspan></text>
<text transform="translate(27.402 2.594)"><tspan y="0" x="0" class="c">2</tspan></text>
<text transform="translate(32.154)"><tspan y="0" x="0" class="f">}</tspan></text>
</svg></span></span> is orthogonal, <em>unless</em> <span class="pretex-inline" style="width:4.51998em"><span style="height:0.748em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">a</tspan></text>
<text transform="translate(9.268)"><tspan y="0" x="0" class="d">=</tspan></text>
<text transform="translate(21.829)"><tspan y="0" x="0" class="a">b</tspan></text>

<text transform="translate(42.304)"><tspan y="0" x="0 6.3812122" class="b">0.</tspan></text>
</svg></span></span></p></span></div>
