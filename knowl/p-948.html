<h5 class="heading CcLx_kslNxpcYdNqeWvEY"><span class="type">Paragraph</span></h5>
<p class="CcLx_kslNxpcYdNqeWvEY">A <span class="pretex-inline" style="width:2.21499em"><span style="height:0.7005em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">1</tspan></text>
<text transform="translate(8.516)"><tspan y="0" x="0" class="b">×</tspan></text>
<text transform="translate(19.04)"><tspan y="0" x="0" class="a">1</tspan></text>
</svg></span></span> matrix <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="c">A</tspan></text>
</svg></span></span> is just a number <span class="pretex-inline" style="width:2.14349em"><span style="height:1.331em;vertical-align:-0.3765em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0 -10.266)"><tspan y="0" x="0" class="d">A</tspan></text>
<text transform="translate(6.892 -0.527)"><tspan y="0" x="0" class="c">a</tspan></text>
<text transform="translate(14.805 -10.266)"><tspan y="0" x="0" class="d">B</tspan></text>
<text transform="translate(21.41)"><tspan y="0" x="0" class="a">.</tspan></text>
</svg></span></span>  In this case, the parallelepiped <span class="pretex-inline" style="width:0.668em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="c">P</tspan></text>
</svg></span></span> determined by its one row is just the interval <span class="pretex-inline" style="width:2.36249em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="e">[</tspan></text>
<text transform="translate(4.671)"><tspan y="0" x="0 6.3812122" class="a">0,</tspan></text>
<text transform="translate(16.131)"><tspan y="0" x="0" class="c">a</tspan></text>
<text transform="translate(22.443)"><tspan y="0" x="0" class="e">]</tspan></text>
</svg></span></span> (or <span class="pretex-inline" style="width:2.36249em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="e">[</tspan></text>
<text transform="translate(4.958)"><tspan y="0" x="0" class="c">a</tspan></text>
<text transform="translate(11.27)"><tspan y="0" x="0 4.7973862" class="a">,0</tspan></text>
<text transform="translate(22.443)"><tspan y="0" x="0" class="e">]</tspan></text>
</svg></span></span> if <span class="pretex-bind"><span class="pretex-inline" style="width:2.38299em"><span style="height:0.694em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="c">a</tspan></text>
<text transform="translate(9.268)"><tspan y="0" x="0" class="f">&lt;</tspan></text>
<text transform="translate(20.968)"><tspan y="0" x="0" class="a">0</tspan></text>
</svg></span></span>).</span>  The “volume” of a region in <span class="pretex-inline" style="width:3.00806em"><span style="height:0.86467em;vertical-align:-0.008em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="g">R</tspan></text>
<text transform="translate(7.701 -4.579)"><tspan y="0" x="0" class="h">1</tspan></text>
<text transform="translate(15.122)"><tspan y="0" x="0" class="e">=</tspan></text>
<text transform="translate(26.823)"><tspan y="0" x="0" class="g">R</tspan></text>
</svg></span></span> is just its length, so it is clear in this case that <span class="pretex-inline" style="width:5.43598em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 5.6696382 11.855741" class="a">vol</tspan></text>
<text transform="translate(15.092)"><tspan y="0" x="0" class="e">(</tspan></text>
<text transform="translate(20.177)"><tspan y="0" x="0" class="c">P</tspan></text>
<text transform="translate(27.269)"><tspan y="0" x="0 7.1788635" class="e">)=</tspan></text>
<text transform="translate(46.149)"><tspan y="0" x="0" class="b">|</tspan></text>
<text transform="translate(49.661)"><tspan y="0" x="0" class="c">a</tspan></text>

<text transform="translate(59.198)"><tspan y="0" x="0" class="a">.</tspan></text>
</svg></span></span> </p>
