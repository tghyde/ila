<div class="pretex-display CtC1DVvyi41aF9aDTadJr"><svg height="1.48122em" version="1.1" class="pretex" viewBox="177 2 148 17"><text transform="translate(178.848 13.948)"><tspan y="0" x="0" class="a">A</tspan></text>

<text transform="translate(259.692 3.682)"><tspan y="0" x="0" class="c">A</tspan></text>
<text transform="translate(266.297 13.42)"><tspan y="0" x="0 16.343248" class="d">11</tspan></text>
<text transform="translate(298.985 13.42)"><tspan y="0" x="0" class="e">−</tspan></text>

<text transform="translate(321.961 13.948)"><tspan y="0" x="0" class="d">.</tspan></text>
</svg></div>
<p class="CtC1DVvyi41aF9aDTadJr">This matrix is in reduced-row echelon form.  The parametric form for the solution set is <span class="pretex-inline" style="width:6.41219em"><span style="height:0.82866em;vertical-align:-0.23067em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(6.909 2.594)"><tspan y="0" x="0" class="f">1</tspan></text>
<text transform="translate(14.33)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(26.031)"><tspan y="0" x="0" class="e">−</tspan></text>
<text transform="translate(35.281)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(41.33 2.594)"><tspan y="0" x="0" class="f">2</tspan></text>
<text transform="translate(48.216)"><tspan y="0" x="0" class="b">+</tspan></text>

<text transform="translate(70.402)"><tspan y="0" x="0" class="d">,</tspan></text>
</svg></span></span> so the parametric vector form of the general solution is</p>
