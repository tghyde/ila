<h5 class="heading C3yzkZ4QrEvDnhH5o3erT"><span class="type">Paragraph</span></h5>
<p class="C3yzkZ4QrEvDnhH5o3erT"><em>Note:</em> we know from this <a knowl="./knowl/matrix-trans-eg-dilation.html?vers=d2e450" knowl-id="xref-matrix-trans-eg-dilation" alt="Example 3.1.9 Dilation" title="Example 3.1.9 Dilation">example in Section 3.1</a> that <span class="pretex-inline" style="width:0.735em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
</svg></span></span> is a matrix transformation: in fact,</p>
