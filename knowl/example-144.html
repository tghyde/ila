<text transform="translate(333.527 17.552)"><tspan y="0" x="0" class="b">.</tspan></text>
</svg></div>
<p>Hence <span class="pretex-inline" style="width:5.34512em"><span style="height:0.97133em;vertical-align:-0.23133em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(10.57)"><tspan y="0" x="0" class="e">◦</tspan></text>
<text transform="translate(18.799)"><tspan y="0" x="0" class="a">U</tspan></text>
<text transform="translate(30.121)"><tspan y="0" x="0" class="g">=</tspan></text>
<text transform="translate(41.822)"><tspan y="0" x="0 3.7185481" class="b">Id</tspan></text>
<text transform="translate(52.025 2.594)"><tspan y="0" x="0" class="j">R</tspan></text>
<text transform="translate(57.159 0.513)"><tspan y="0" x="0" class="k">2</tspan></text>
</svg></span></span> and <span class="pretex-inline" style="width:5.76262em"><span style="height:0.97133em;vertical-align:-0.23133em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">U</tspan></text>
<text transform="translate(11.075)"><tspan y="0" x="0" class="e">◦</tspan></text>
<text transform="translate(19.591)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(30.121)"><tspan y="0" x="0" class="g">=</tspan></text>
<text transform="translate(41.822)"><tspan y="0" x="0 3.7185481" class="b">Id</tspan></text>
<text transform="translate(52.025 2.594)"><tspan y="0" x="0" class="j">R</tspan></text>
<text transform="translate(57.159 0.513)"><tspan y="0" x="0" class="k">2</tspan></text>
<text transform="translate(62.947)"><tspan y="0" x="0" class="b">,</tspan></text>
</svg></span></span> so <span class="pretex-inline" style="width:0.735em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
</svg></span></span> is invertible, with inverse <span class="pretex-inline" style="width:1.057em"><span style="height:0.688em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">U</tspan></text>
<text transform="translate(8.941)"><tspan y="0" x="0" class="b">.</tspan></text>
</svg></span></span>  In other words, <em>shrinking</em> by a factor of <span class="pretex-inline" style="width:1.618em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(6.381)"><tspan y="0" x="0" class="f">/</tspan></text>
<text transform="translate(12.189)"><tspan y="0" x="0" class="b">3</tspan></text>
</svg></span></span> undoes <em>stretching</em> by a factor of <em>3/2</em>. </p>
