<p>According to this <a knowl="./knowl/systems-eqns-soln-sets.html?vers=ebc07a" knowl-id="xref-systems-eqns-soln-sets" alt="Definition 1.1.2 Solution sets" title="Definition 1.1.2 Solution sets">definition</a>, solving a system of equations means writing down all solutions in terms of some number of parameters.  We will give a systematic way of doing so in <a href="parametric-form.html" alt="Section 1.3 Parametric Form" title="Section 1.3 Parametric Form">Section 1.3</a>; for now we give parametric descriptions in the examples of the previous <a href="systems-of-eqns.html#systems-eqns-pictures" alt="Subsection 1.1.2 Pictures of Solution Sets" title="Subsection 1.1.2 Pictures of Solution Sets">subsection</a>.</p>
