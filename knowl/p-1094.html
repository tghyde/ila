<p class="CvFr9_Jbr06jfKFHVU1TU">Similarity is unrelated to row equivalence.  Any invertible matrix is row equivalent to <span class="pretex-inline" style="width:1.09574em"><span style="height:0.905em;vertical-align:-0.231em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">I</tspan></text>
<text transform="translate(4.633 2.594)"><tspan y="0" x="0" class="b">n</tspan></text>
<text transform="translate(9.385)"><tspan y="0" x="0" class="c">,</tspan></text>
</svg></span></span> but <span class="pretex-inline" style="width:0.81774em"><span style="height:0.905em;vertical-align:-0.231em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">I</tspan></text>
<text transform="translate(4.633 2.594)"><tspan y="0" x="0" class="b">n</tspan></text>
</svg></span></span> is the only matrix similar to <span class="pretex-inline" style="width:1.09574em"><span style="height:0.905em;vertical-align:-0.231em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">I</tspan></text>
<text transform="translate(4.633 2.594)"><tspan y="0" x="0" class="b">n</tspan></text>
<text transform="translate(9.385)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></span></span>  For instance,</p>
