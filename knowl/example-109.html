<article class="example-like C7YjWN8rvYOEMIQW6URsh"><h5 class="heading">
<span class="type">Example</span><span class="codenumber">3.2.30</span><span class="title">(A matrix transformation that is one-to-one but not onto)</span>
</h5>
<p>Let <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
</svg></span></span> be the matrix</p>
<div class="pretex-display"><svg height="3.48522em" version="1.1" class="pretex" viewbox="216 2 70 40"><text transform="translate(217.876 25.235)"><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(226.925 25.235)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(238.626 3.417)"><tspan y="0" x="0" class="c">A</tspan></text>
<text transform="translate(248.617 10.76)"><tspan y="0" x="0 16.343248" class="d">10</tspan><tspan y="13.947" x="0 16.343248" class="d">01</tspan><tspan y="27.895" x="0 16.343248" class="d">10</tspan></text>
<text transform="translate(272.943 3.417)"><tspan y="0" x="0" class="c">B</tspan></text>
<text transform="translate(282.934 25.235)"><tspan y="0" x="0" class="d">,</tspan></text>
</svg></div>
<p>and define <span class="pretex-inline" style="width:5.07312em"><span style="height:0.86467em;vertical-align:-0.008em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(9.503)"><tspan y="0" x="0" class="d">:</tspan></text>
<text transform="translate(16.366)"><tspan y="0" x="0" class="e">R</tspan></text>
<text transform="translate(24.067 -4.579)"><tspan y="0" x="0" class="f">2</tspan></text>
<text transform="translate(31.488)"><tspan y="0" x="0" class="g">→</tspan></text>
<text transform="translate(45.771)"><tspan y="0" x="0" class="e">R</tspan></text>
<text transform="translate(53.472 -4.579)"><tspan y="0" x="0" class="f">3</tspan></text>
</svg></span></span> by <span class="pretex-inline" style="width:4.89499em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(8.436)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(13.807)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(20.337)"><tspan y="0" x="0 7.1788635" class="b">)=</tspan></text>
<text transform="translate(39.217)"><tspan y="0" x="0 7.2419872" class="a">Ax</tspan></text>
<text transform="translate(52.989)"><tspan y="0" x="0" class="d">.</tspan></text>
</svg></span></span>  This transformation is one-to-one but not onto, as we saw in this <a knowl="./knowl/matrix-trans-11-notonto1.html?vers=88014a" knowl-id="xref-matrix-trans-11-notonto1" alt="Example 3.2.6 A matrix transformation that is one-to-one" title="Example 3.2.6 A matrix transformation that is one-to-one">example</a> and this <a knowl="./knowl/matrix-trans-11-notonto2.html?vers=88014a" knowl-id="xref-matrix-trans-11-notonto2" alt="Example 3.2.22 A matrix transformation that is not onto" title="Example 3.2.22 A matrix transformation that is not onto">example</a>.</p>
<figure class="figure-like"><div id="mathbox-67" class="mathbox" style="height:500px;">
<iframe src="demos/Axequalsb.html?mat=1,0:0,1:1,0&amp;range2=5&amp;closed=true&amp;show=&amp;vers=88014a" title="Interactive Figure"></iframe><div class="maximizer"></div>
<div class="minimizer"></div>
</div>
<figcaption><span class="heading">Figure</span><span class="codenumber">31</span>A picture of the matrix transformation <span class="pretex-inline" style="width:1.013em"><span style="height:0.688em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(8.436)"><tspan y="0" x="0" class="d">.</tspan></text>
</svg></span></span>  The range of <span class="pretex-inline" style="width:0.735em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
</svg></span></span> is the violet plane on the right; this is smaller than the codomain <span class="pretex-inline" style="width:1.36307em"><span style="height:0.87066em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="e">R</tspan></text>
<text transform="translate(7.701 -4.579)"><tspan y="0" x="0" class="f">3</tspan></text>
<text transform="translate(12.453)"><tspan y="0" x="0" class="d">.</tspan></text>
</svg></span></span>  If you drag <span class="pretex-inline" style="width:0.607em"><span style="height:0.7415em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">b</tspan></text>
</svg></span></span> off of the violet plane, then the equation <span class="pretex-inline" style="width:3.05899em"><span style="height:0.7415em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 7.2419872" class="a">Ax</tspan></text>
<text transform="translate(16.441)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(29.002)"><tspan y="0" x="0" class="a">b</tspan></text>
</svg></span></span> becomes inconsistent; this means <span class="pretex-inline" style="width:4.02399em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(8.436)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(13.807)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(20.337)"><tspan y="0" x="0 7.1788635" class="b">)=</tspan></text>
<text transform="translate(40.078)"><tspan y="0" x="0" class="a">b</tspan></text>
</svg></span></span> has no solution.  However, for <span class="pretex-inline" style="width:0.607em"><span style="height:0.7415em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">b</tspan></text>
</svg></span></span> lying on the violet plane, there is a unique vector <span class="pretex-inline" style="width:0.644em"><span style="height:0.4925em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">x</tspan></text>
</svg></span></span> such that <span class="pretex-inline" style="width:4.30199em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(8.436)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(13.807)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(20.337)"><tspan y="0" x="0 7.1788635" class="b">)=</tspan></text>
<text transform="translate(40.078)"><tspan y="0" x="0" class="a">b</tspan></text>
<text transform="translate(46.184)"><tspan y="0" x="0" class="d">.</tspan></text>
</svg></span></span></figcaption></figure></article><span class="incontext C7YjWN8rvYOEMIQW6URsh"><a href="one-to-one-onto.html#example-109">in-context</a></span>
