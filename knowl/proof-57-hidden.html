<body><article class="hiddenproof CkfgdMzsiUjbMSg8YgzDL"><p>By the <a knowl="./knowl/rank-theorem.html?vers=568603" knowl-id="xref-rank-theorem" alt="Rank Theorem 2.9.2 " title="Rank Theorem 2.9.2 ">rank theorem in Section 2.9</a>, we have</p>
<div class="pretex-display"><svg height="1.1327em" version="1.1" class="pretex" viewbox="179 4 145 13"><text transform="translate(179.867 13.948)"><tspan y="0" x="0 6.4845052 9.6980648 20.979956 28.233419 34.419521" class="a">dimCol</tspan></text>
<text transform="translate(217.517 13.948)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(222.028 13.948)"><tspan y="0" x="0" class="c">A</tspan></text>
<text transform="translate(228.409 13.948)"><tspan y="0" x="0 6.6509213" class="b">)+</tspan></text>
<text transform="translate(245.579 13.948)"><tspan y="0" x="0 6.4845052 9.6980648 20.968479 29.151581 35.681992" class="a">dimNul</tspan></text>
<text transform="translate(284.503 13.948)"><tspan y="0" x="0" class="b">(</tspan></text>

<text transform="translate(295.395 13.948)"><tspan y="0" x="0 7.1788635" class="b">)=</tspan></text>
<text transform="translate(314.561 13.948)"><tspan y="0" x="0" class="c">n</tspan></text>
<text transform="translate(320.942 13.948)"><tspan y="0" x="0" class="a">.</tspan></text>
</svg></div>
<p>On the other hand the <a knowl="./knowl/orthocomp-facts-basic.html?vers=568603" knowl-id="xref-orthocomp-facts-basic" alt="Fact 6.2.16 Facts about Orthogonal Complements" title="Fact 6.2.16 Facts about Orthogonal Complements">third fact</a> says that</p>
<div class="pretex-display"><svg height="1.21983em" version="1.1" class="pretex" viewbox="175 3 153 14"><text transform="translate(175.97 13.948)"><tspan y="0" x="0 6.4845052 9.6980648 20.979956 29.163057 35.69347" class="a">dimNul</tspan></text>
<text transform="translate(214.894 13.948)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(219.405 13.948)"><tspan y="0" x="0" class="c">A</tspan></text>
<text transform="translate(225.786 13.948)"><tspan y="0" x="0" class="b">)</tspan></text>
<text transform="translate(230.297 9.07)"><tspan y="0" x="0" class="d">⊥</tspan></text>
<text transform="translate(238.951 13.948)"><tspan y="0" x="0" class="b">+</tspan></text>
<text transform="translate(249.475 13.948)"><tspan y="0" x="0 6.4845052 9.6980648 20.979956 29.163057 35.69347" class="a">dimNul</tspan></text>
<text transform="translate(288.4 13.948)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(292.91 13.948)"><tspan y="0" x="0" class="c">A</tspan></text>
<text transform="translate(299.291 13.948)"><tspan y="0" x="0 7.1788635" class="b">)=</tspan></text>
<text transform="translate(318.458 13.948)"><tspan y="0" x="0" class="c">n</tspan></text>
<text transform="translate(324.839 13.948)"><tspan y="0" x="0" class="a">,</tspan></text>
</svg></div>
<p>which implies <span class="pretex-inline" style="width:11.45404em"><span style="height:1.08067em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 6.4845052 9.6980648 20.968479 28.221943 34.408047" class="a">dimCol</tspan></text>
<text transform="translate(37.65)"><tspan y="0" x="0" class="b">(</tspan></text>
