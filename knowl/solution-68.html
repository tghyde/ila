<p>Let <span class="pretex-inline" style="width:5.11712em"><span style="height:0.86816em;vertical-align:-0.0115em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">U</tspan></text>

<text transform="translate(8.941)"><tspan y="0" x="0" class="b">.</tspan></text>
