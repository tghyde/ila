<h5 class="heading Cp3GtrlHj0SXpKN3knSdP"><span class="type">Paragraph</span></h5>
<p class="Cp3GtrlHj0SXpKN3knSdP">Now we have <em>three</em> equivalent ways of thinking about a linear system: </p>
<ol style="list-style-type: decimal;" class="Cp3GtrlHj0SXpKN3knSdP">
<li>As a system of equations:
