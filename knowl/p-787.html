<h5 class="heading Ct3jt7n6d2SLDakosFuNK"><span class="type">Paragraph</span></h5>
<p class="Ct3jt7n6d2SLDakosFuNK">In each of the first three cases, doing a row operation on a matrix scales the determinant by a <em>nonzero</em> number.  (Multiplying a row by zero is not a row operation.)  Therefore, doing row operations on a square matrix <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
</svg></span></span> does not change whether or not the determinant is zero.</p>
