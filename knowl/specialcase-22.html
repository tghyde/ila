<article class="example-like Cg9BENEDAZtrCPjR_xycS"><h5 class="heading">
<span class="type">Example</span><span class="codenumber">2.6.23</span>
</h5>
<p>Let</p>
<div class="pretex-display"><svg height="2.43965em" version="1.1" class="pretex" viewBox="182 1 140 28"><text transform="translate(182.526 18.261)"><tspan y="0" x="0" class="a">V</tspan></text>
<text transform="translate(193.504 18.261)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(205.205 2.394)"><tspan y="0" x="0 7.5690813" class="c">HF</tspan></text>
<text transform="translate(220.423 10.76)"><tspan y="0" x="0" class="a">a</tspan><tspan y="13.947" x="0.391" class="a">b</tspan></text>
<text transform="translate(226.919 2.394)"><tspan y="0" x="0" class="c">G</tspan></text>
<text transform="translate(238.896 18.261)"><tspan y="0" x="0 3.2135601" class="d">in</tspan></text>
<text transform="translate(251.83 18.261)"><tspan y="0" x="0" class="e">R</tspan></text>
<text transform="translate(259.531 13.383)"><tspan y="0" x="0" class="f">2</tspan></text>
<text transform="translate(266.952 7.461)"><tspan y="0" x="0" class="c">E</tspan><tspan y="7.4829998" x="0" class="c">E</tspan></text>
<text transform="translate(273.488 18.261)"><tspan y="0" x="0" class="d">2</tspan></text>
<text transform="translate(280.156 18.261)"><tspan y="0" x="0" class="a">a</tspan></text>
<text transform="translate(289.137 18.261)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(300.838 18.261)"><tspan y="0" x="0" class="d">3</tspan></text>
<text transform="translate(308.08 18.261)"><tspan y="0" x="0" class="a">b</tspan></text>
<text transform="translate(314.186 2.394)"><tspan y="0" x="0" class="c">I</tspan></text>
</svg></div>
<p>be the subset of a previous <a knowl="./knowl/subspaces-eg-byhand.html?vers=b58525" knowl-id="xref-subspaces-eg-byhand" alt="Example 2.6.13 Verifying that a subset is a subspace" title="Example 2.6.13 Verifying that a subset is a subspace">example</a>.  The subset <span class="pretex-inline" style="width:0.749em"><span style="height:0.6775em;vertical-align:-0.0035em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">V</tspan></text>
</svg></span></span> is exactly the solution set of the homogeneous equation <span class="pretex-inline" style="width:5.62898em"><span style="height:0.904em;vertical-align:-0.2175em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="d">2</tspan></text>
<text transform="translate(7.242)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(15.907)"><tspan y="0" x="0" class="g">−</tspan></text>
<text transform="translate(26.432)"><tspan y="0" x="0" class="d">3</tspan></text>
<text transform="translate(34.247)"><tspan y="0" x="0" class="a">y</tspan></text>
<text transform="translate(43.331)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(55.032)"><tspan y="0" x="0 6.3812122" class="d">0.</tspan></text>
</svg></span></span> Therefore,</p>
<div class="pretex-display"><svg height="1.48122em" version="1.1" class="pretex" viewBox="206 2 92 17"><text transform="translate(206.47 13.948)"><tspan y="0" x="0" class="a">V</tspan></text>
<text transform="translate(217.448 13.948)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(229.149 13.948)"><tspan y="0" x="0 8.1831007 14.713514" class="d">Nul</tspan></text>
<text transform="translate(248.7 3.682)"><tspan y="0" x="0" class="c">A</tspan></text>
<text transform="translate(255.305 13.42)"><tspan y="0" x="0" class="d">2</tspan></text>
<text transform="translate(271.649 13.42)"><tspan y="0" x="0" class="g">−</tspan></text>
<text transform="translate(280.039 13.42)"><tspan y="0" x="0" class="d">3</tspan></text>
<text transform="translate(288.021 3.682)"><tspan y="0" x="0" class="c">B</tspan></text>
<text transform="translate(294.626 13.948)"><tspan y="0" x="0" class="d">.</tspan></text>
</svg></div>
<p>In particular, it is a subspace.  The reduced row echelon form of <span class="pretex-inline" style="width:3.86204em"><span style="height:1.331em;vertical-align:-0.3765em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0 -10.266)"><tspan y="0" x="0" class="c">A</tspan></text>
<text transform="translate(6.605 -0.527)"><tspan y="0" x="0" class="d">2</tspan></text>
<text transform="translate(22.949 -0.527)"><tspan y="0" x="0" class="g">−</tspan></text>
<text transform="translate(31.339 -0.527)"><tspan y="0" x="0" class="d">3</tspan></text>
<text transform="translate(39.321 -10.266)"><tspan y="0" x="0" class="c">B</tspan></text>
</svg></span></span> is <span class="pretex-inline" style="width:5.34154em"><span style="height:1.331em;vertical-align:-0.3765em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0 -10.266)"><tspan y="0" x="0" class="c">A</tspan></text>
<text transform="translate(6.605 -0.527)"><tspan y="0" x="0" class="d">1</tspan></text>
<text transform="translate(22.949 -0.527)"><tspan y="0" x="0" class="g">−</tspan></text>
<text transform="translate(31.339 -0.527)"><tspan y="0" x="0" class="d">3</tspan></text>
<text transform="translate(37.72 -0.527)"><tspan y="0" x="0" class="h">/</tspan></text>
<text transform="translate(43.527 -0.527)"><tspan y="0" x="0" class="d">2</tspan></text>
<text transform="translate(51.509 -10.266)"><tspan y="0" x="0" class="c">B</tspan></text>
<text transform="translate(58.114)"><tspan y="0" x="0" class="d">,</tspan></text>
</svg></span></span> so the parametric form of <span class="pretex-inline" style="width:0.749em"><span style="height:0.6775em;vertical-align:-0.0035em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">V</tspan></text>
</svg></span></span> is <span class="pretex-inline" style="width:4.47599em"><span style="height:0.9845em;vertical-align:-0.2175em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(10.06)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(21.76)"><tspan y="0" x="0" class="d">3</tspan></text>
<text transform="translate(28.142)"><tspan y="0" x="0" class="h">/</tspan></text>
<text transform="translate(33.949)"><tspan y="0" x="0" class="d">2</tspan></text>
<text transform="translate(41.765)"><tspan y="0" x="0" class="a">y</tspan></text>
<text transform="translate(48.181)"><tspan y="0" x="0" class="d">,</tspan></text>
</svg></span></span> so the parametric vector form is <span class="pretex-inline" style="width:5.49265em"><span style="height:1.50233em;vertical-align:-0.477em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0 -10.266)"><tspan y="0" x="0" class="c">A</tspan></text>
<text transform="translate(5.731 -5.899)"><tspan y="0" x="0" class="i">x</tspan><tspan y="9.7089996" x="0.229" class="i">y</tspan></text>
<text transform="translate(10.237 -10.266)"><tspan y="0" x="0" class="c">B</tspan></text>
<text transform="translate(17.91)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(31.045)"><tspan y="0" x="0" class="a">y</tspan></text>
<text transform="translate(37.461 -10.266)"><tspan y="0" x="0" class="c">A</tspan></text>

<text transform="translate(54.845 -10.266)"><tspan y="0" x="0" class="c">B</tspan></text>
<text transform="translate(59.849)"><tspan y="0" x="0" class="d">,</tspan></text>
</svg></span></span> and hence <span class="pretex-inline" style="width:3.01866em"><span style="height:1.40183em;vertical-align:-0.3765em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0 -10.266)"><tspan y="0" x="0 6.1287179" class="c">CA</tspan></text>

<text transform="translate(23.513 -10.266)"><tspan y="0" x="0 4.9993811" class="c">BD</tspan></text>
