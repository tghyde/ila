<p class="Cf_eb4V9rlPfbl_UyL9bd">Since <span class="pretex-inline" style="width:1.026em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">W</tspan></text>
</svg></span></span> and <span class="pretex-inline" style="width:1.59407em"><span style="height:0.89167em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">W</tspan></text>

<text transform="translate(11.775 -4.579)"><tspan y="0" x="0" class="f">⊥</tspan></text>
<text transform="translate(18.295)"><tspan y="0" x="0" class="e">.</tspan></text>
</svg></span></span>  Therefore, <span class="pretex-inline" style="width:3.7598em"><span style="height:0.821em;vertical-align:-0.226em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">x</tspan></text>

<text transform="translate(17.392)"><tspan y="0" x="0" class="g">−</tspan></text>
<text transform="translate(29.351)"><tspan y="0" x="0" class="a">y</tspan></text>

<text transform="translate(57.52)"><tspan y="0" x="0 6.3812122" class="e">0.</tspan></text>

<text transform="translate(54.89)"><tspan y="0" x="0" class="e">,</tspan></text>
