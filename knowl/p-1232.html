<h5 class="heading C-lJLNlLIpVJV4Iv_zbUb"><span class="type">Paragraph</span></h5>
<p class="C-lJLNlLIpVJV4Iv_zbUb">Both matrices have the three distinct eigenvalues <span class="pretex-inline" style="width:3.51199em"><span style="height:0.8555em;vertical-align:-0.169em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 6.3812122" class="a">1,</tspan></text>
<text transform="translate(11.173)"><tspan y="0" x="0" class="b">−</tspan></text>
<text transform="translate(19.563)"><tspan y="0" x="0 6.3812122 11.167121 17.548332" class="a">1,4.</tspan></text>
</svg></span></span>  Hence they are both diagonalizable, and are similar to the diagonal matrix</p>
