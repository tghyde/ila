<h5 class="heading C_WFJH9RsipqmgNYlvTJs"><span class="type">Paragraph</span></h5>
<p class="C_WFJH9RsipqmgNYlvTJs">Let <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
</svg></span></span> be a <span class="pretex-inline" style="width:2.21499em"><span style="height:0.7005em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(8.516)"><tspan y="0" x="0" class="c">×</tspan></text>
<text transform="translate(19.04)"><tspan y="0" x="0" class="b">2</tspan></text>
</svg></span></span> matrix with a complex (non-real) eigenvalue <span class="pretex-inline" style="width:0.929em"><span style="height:0.753em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="d">λ</tspan></text>
<text transform="translate(7.472)"><tspan y="0" x="0" class="b">.</tspan></text>
</svg></span></span>  By the <a knowl="./knowl/cplx-diagonalization-thm.html?vers=b58525" knowl-id="xref-cplx-diagonalization-thm" alt="Rotation-Scaling Theorem 5.5.14 " title="Rotation-Scaling Theorem 5.5.14 ">rotation-scaling theorem</a>, the matrix <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
</svg></span></span> is similar to a matrix that rotates by some amount and scales by <span class="pretex-inline" style="width:1.491em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="c">|</tspan></text>
<text transform="translate(3.225)"><tspan y="0" x="0" class="d">λ</tspan></text>
<text transform="translate(10.697)"><tspan y="0" x="0" class="c">|</tspan></text>
<text transform="translate(13.922)"><tspan y="0" x="0" class="b">.</tspan></text>
</svg></span></span>  Hence, <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
</svg></span></span> rotates around an ellipse and scales by <span class="pretex-inline" style="width:1.491em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="c">|</tspan></text>
<text transform="translate(3.225)"><tspan y="0" x="0" class="d">λ</tspan></text>
<text transform="translate(10.697)"><tspan y="0" x="0" class="c">|</tspan></text>
<text transform="translate(13.922)"><tspan y="0" x="0" class="b">.</tspan></text>
</svg></span></span>  There are three different cases.</p>
