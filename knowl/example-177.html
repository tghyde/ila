<article class="example-like CGP4h1a-g5mwbBsynGlA-"><h5 class="heading">
<span class="type">Example</span><span class="codenumber">5.1.4</span><span class="title">(Verifying eigenvectors)</span>
</h5>
<p>Consider the matrix</p>
<div class="pretex-display"><svg height="2.43965em" version="1.1" class="pretex" viewBox="114 1 274 28"><text transform="translate(115.908 18.261)"><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(124.958 18.261)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(136.659 2.394)"><tspan y="0" x="0" class="c">A</tspan></text>
<text transform="translate(149.628 10.76)"><tspan y="0" x="0 20.543831" class="d">22</tspan></text>
<text transform="translate(145.433 24.707)"><tspan y="0" x="0" class="e">−</tspan></text>
<text transform="translate(153.822 24.707)"><tspan y="0" x="0 16.343248" class="d">48</tspan></text>
<text transform="translate(178.149 2.394)"><tspan y="0" x="0" class="c">B</tspan></text>
<text transform="translate(201.602 18.261)"><tspan y="0" x="0 5.8188391 12.337775 22.024363 27.694 33.329208 38.447948 42.281269 48.467373 52.851585" class="d">andvectors</tspan></text>
<text transform="translate(274.297 18.261)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(282.75 18.261)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(294.451 2.394)"><tspan y="0" x="0" class="c">A</tspan></text>
<text transform="translate(301.624 10.76)"><tspan y="0" x="0" class="d">1</tspan><tspan y="13.947" x="0" class="d">1</tspan></text>
<text transform="translate(308.005 2.394)"><tspan y="0" x="0" class="c">B</tspan></text>
<text transform="translate(340.02 18.261)"><tspan y="0" x="0" class="a">w</tspan></text>
<text transform="translate(350.872 18.261)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(362.573 2.394)"><tspan y="0" x="0" class="c">A</tspan></text>
<text transform="translate(369.746 10.76)"><tspan y="0" x="0" class="d">2</tspan><tspan y="13.947" x="0" class="d">1</tspan></text>
<text transform="translate(376.127 2.394)"><tspan y="0" x="0" class="c">B</tspan></text>
<text transform="translate(384.901 18.261)"><tspan y="0" x="0" class="d">.</tspan></text>
</svg></div>
<p>Which are eigenvectors?  What are their eigenvalues?</p></article><div class="posterior CGP4h1a-g5mwbBsynGlA-"><span class="solution"><span class="type">Solution</span><p>We have</p>
<div class="pretex-display"><svg height="2.43965em" version="1.1" class="pretex" viewBox="169 1 165 28"><text transform="translate(170.699 18.261)"><tspan y="0" x="0 6.5877981" class="a">Av</tspan></text>
<text transform="translate(185.74 18.261)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(197.441 2.394)"><tspan y="0" x="0" class="c">A</tspan></text>
<text transform="translate(210.41 10.76)"><tspan y="0" x="0 20.543831" class="d">22</tspan></text>
<text transform="translate(206.215 24.707)"><tspan y="0" x="0" class="e">−</tspan></text>
<text transform="translate(214.605 24.707)"><tspan y="0" x="0 16.343248" class="d">48</tspan></text>
<text transform="translate(238.931 2.394)"><tspan y="0" x="0 8.7718716" class="c">BA</tspan></text>
<text transform="translate(254.878 10.76)"><tspan y="0" x="0" class="d">1</tspan><tspan y="13.947" x="0" class="d">1</tspan></text>
<text transform="translate(261.259 2.394)"><tspan y="0" x="0" class="c">B</tspan></text>
<text transform="translate(271.101 18.261)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(282.802 2.394)"><tspan y="0" x="0" class="c">A</tspan></text>
<text transform="translate(289.975 10.76)"><tspan y="0" x="0" class="d">4</tspan><tspan y="13.947" x="0" class="d">4</tspan></text>
<text transform="translate(296.356 2.394)"><tspan y="0" x="0" class="c">B</tspan></text>
<text transform="translate(306.198 18.261)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(317.898 18.261)"><tspan y="0" x="0" class="d">4</tspan></text>
<text transform="translate(324.853 18.261)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(330.11 18.261)"><tspan y="0" x="0" class="d">.</tspan></text>
</svg></div>
<p>Hence, <span class="pretex-inline" style="width:0.554em"><span style="height:0.485em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">v</tspan></text>
</svg></span></span> is an eigenvector of <span class="pretex-inline" style="width:0.834em"><span style="height:0.844em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(6.381)"><tspan y="0" x="0" class="d">,</tspan></text>
</svg></span></span> with eigenvalue <span class="pretex-inline" style="width:2.73699em"><span style="height:0.776em;vertical-align:-0.037em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="f">λ</tspan></text>
<text transform="translate(10.14)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(21.841)"><tspan y="0" x="0 6.3812122" class="d">4.</tspan></text>
</svg></span></span>  On the other hand,</p>
<div class="pretex-display"><svg height="2.43965em" version="1.1" class="pretex" viewBox="181 1 141 28"><text transform="translate(182.214 18.261)"><tspan y="0" x="0 6.1401949" class="a">Aw</tspan></text>
<text transform="translate(199.205 18.261)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(210.906 2.394)"><tspan y="0" x="0" class="c">A</tspan></text>
<text transform="translate(223.875 10.76)"><tspan y="0" x="0 20.543831" class="d">22</tspan></text>
<text transform="translate(219.68 24.707)"><tspan y="0" x="0" class="e">−</tspan></text>
<text transform="translate(228.07 24.707)"><tspan y="0" x="0 16.343248" class="d">48</tspan></text>
<text transform="translate(252.396 2.394)"><tspan y="0" x="0 8.7718716" class="c">BA</tspan></text>
<text transform="translate(268.344 10.76)"><tspan y="0" x="0" class="d">2</tspan><tspan y="13.947" x="0" class="d">1</tspan></text>
<text transform="translate(274.725 2.394)"><tspan y="0" x="0" class="c">B</tspan></text>
<text transform="translate(284.566 18.261)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(296.267 2.394)"><tspan y="0" x="0" class="c">A</tspan></text>
<text transform="translate(303.44 10.76)"><tspan y="0" x="0" class="d">6</tspan><tspan y="13.947" x="0" class="d">0</tspan></text>
<text transform="translate(309.821 2.394)"><tspan y="0" x="0" class="c">B</tspan></text>
<text transform="translate(318.596 18.261)"><tspan y="0" x="0" class="d">.</tspan></text>
</svg></div>
<p>which is not a scalar multiple of <span class="pretex-inline" style="width:1.016em"><span style="height:0.499em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">w</tspan></text>
<text transform="translate(8.47)"><tspan y="0" x="0" class="d">.</tspan></text>
</svg></span></span>  Hence, <span class="pretex-inline" style="width:0.738em"><span style="height:0.485em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">w</tspan></text>
</svg></span></span> is not an eigenvector of <span class="pretex-inline" style="width:0.834em"><span style="height:0.688em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(6.381)"><tspan y="0" x="0" class="d">.</tspan></text>
</svg></span></span> </p>
