<h5 class="heading C3yzkZ4QrEvDnhH5o3erT"><span class="type">Paragraph</span></h5>
<p class="C3yzkZ4QrEvDnhH5o3erT"><em>Note:</em> we know from this <a knowl="./knowl/matrix-trans-eg-dilation.html?vers=cb75e0" knowl-id="xref-matrix-trans-eg-dilation" alt="Example 3.1.9 Dilation" title="Example 3.1.9 Dilation">example in Section 3.1</a> that <span class="pretex-inline" style="width:0.735em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
</svg></span></span> is a matrix transformation: in fact,</p>
<div class="pretex-display C3yzkZ4QrEvDnhH5o3erT"><svg height="2.43965em" version="1.1" class="pretex" viewBox="197 1 111 28"><text transform="translate(197.165 18.261)"><tspan y="0" x="0" class="a">T</tspan></text>

<text transform="translate(235.808 2.394)"><tspan y="0" x="0" class="c">A</tspan></text>
<text transform="translate(244.583 10.76)"><tspan y="0" x="0 6.3812122 9.5718184 30.700975" class="d">1.50</tspan><tspan y="13.947" x="4.7859998 25.915157 32.296368 35.486977" class="d">01.5</tspan></text>
<text transform="translate(288.052 2.394)"><tspan y="0" x="0" class="c">B</tspan></text>

<p class="C3yzkZ4QrEvDnhH5o3erT">Since a matrix transformation is a linear transformation, this is another proof that <span class="pretex-inline" style="width:0.735em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
</svg></span></span> is linear.</p>
