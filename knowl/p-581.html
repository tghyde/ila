<p class="CfHAuD35lF06P9zg29mRh">This kind of transformation is called a <em class="terminology">translation</em>. As in a previous <a knowl="./knowl/linear-trans-eg-T0-non0.html?vers=8c9b1c" knowl-id="xref-linear-trans-eg-T0-non0" alt="Example 3.3.4 A non-linear transformation" title="Example 3.3.4 A non-linear transformation">example</a>, this <span class="pretex-inline" style="width:0.735em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
</svg></span></span> is not linear, because <span class="pretex-inline" style="width:2.077em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(8.436)"><tspan y="0" x="0" class="f">(</tspan></text>
<text transform="translate(12.946)"><tspan y="0" x="0" class="b">0</tspan></text>
<text transform="translate(19.327)"><tspan y="0" x="0" class="f">)</tspan></text>
</svg></span></span> is not the zero vector.</p>
