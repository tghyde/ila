</svg></span></span> is called the <em class="terminology">complex conjugate</em> of <span class="pretex-inline" style="width:2.92499em"><span style="height:0.7535em;vertical-align:-0.0195em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">a</tspan></text>
<text transform="translate(8.734)"><tspan y="0" x="0" class="d">+</tspan></text>

<text transform="translate(30.38)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></span></span>  One checks that for any two complex numbers <span class="pretex-inline" style="width:1.92349em"><span style="height:0.6595em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">z</tspan></text>
