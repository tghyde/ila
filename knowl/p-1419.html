<p class="C2fs2UWZkYCXpQ1-6qRYB">We motivate the above definition using the <em>law of cosines</em> in <span class="pretex-inline" style="width:1.36307em"><span style="height:0.87066em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">R</tspan></text>
<text transform="translate(7.701 -4.579)"><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(12.453)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></span></span>  In our language, the law of cosines asserts that if <span class="pretex-inline" style="width:1.7455em"><span style="height:0.7025em;vertical-align:-0.2175em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="d">x</tspan></text>
<text transform="translate(7.391)"><tspan y="0" x="0" class="c">,</tspan></text>
<text transform="translate(13.617)"><tspan y="0" x="0" class="d">y</tspan></text>
</svg></span></span> are two nonzero vectors, and if <span class="pretex-inline" style="width:2.46299em"><span style="height:0.6935em;vertical-align:-0.007em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 10.182394" class="e">α&gt;</tspan></text>
<text transform="translate(21.887)"><tspan y="0" x="0" class="c">0</tspan></text>
</svg></span></span> is the angle between them, then</p>

<text transform="translate(34.649 -4.579)"><tspan y="0" x="0" class="h">◦</tspan></text>
</svg></span></span> if and only if <span class="pretex-inline" style="width:4.91198em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 5.118742 11.304845" class="c">cos</tspan></text>

<text transform="translate(27.924)"><tspan y="0" x="0 7.1788635" class="g">)=</tspan></text>
<text transform="translate(46.803)"><tspan y="0" x="0 6.3812122" class="c">0,</tspan></text>
</svg></span></span> which happens if and only if <span class="pretex-inline" style="width:10.67017em"><span style="height:1.07416em;vertical-align:-0.2175em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="f">A</tspan></text>

<text transform="translate(58.637)"><tspan y="0" x="0" class="f">A</tspan></text>
<text transform="translate(65.305)"><tspan y="0" x="0" class="d">x</tspan></text>
<text transform="translate(71.835)"><tspan y="0" x="0" class="f">A</tspan></text>

<text transform="translate(119.271)"><tspan y="0" x="0" class="c">.</tspan></text>
