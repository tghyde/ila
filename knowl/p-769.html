<text transform="translate(37.63)"><tspan y="0" x="0" class="d">.</tspan></text>

</svg></span></span> is one-to-one.  Indeed, suppose that <span class="pretex-inline" style="width:5.89998em"><span style="height:0.9845em;vertical-align:-0.2175em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
