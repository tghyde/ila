<h5 class="heading CDLPPEU716U2N5lUoUi4Y"><span class="type">Paragraph</span></h5>
<p class="CDLPPEU716U2N5lUoUi4Y">Let us check our geometric answer by solving the matrix equation using row reduction.  We put the system into an augmented matrix and row reduce:</p>
