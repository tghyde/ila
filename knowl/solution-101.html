</svg></span></span> is an eigenvector with eigenvalue <em>zero</em>.</p>
<p>As noted above, an eigen<em>value</em> is allowed to be zero, but an eigen<em>vector</em> is not.</p></span><span class="incontext CTIi8G4HcRhXDFekTpSrP"><a href="eigenvectors.html#solution-101">in-context</a></span>
