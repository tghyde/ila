<p class="C7slaghtLVHYcZZwz5EVT">If we set</p>

<text transform="translate(240.503 3.417)"><tspan y="0" x="0" class="c">B</tspan></text>

<text transform="translate(283.829 10.76)"><tspan y="0" x="0" class="d">2</tspan><tspan y="13.947" x="0" class="d">0</tspan></text>
<text transform="translate(279.634 38.655)"><tspan y="0" x="0" class="e">−</tspan></text>
<text transform="translate(288.023 38.655)"><tspan y="0" x="0" class="d">1</tspan></text>
<text transform="translate(294.405 3.417)"><tspan y="0" x="0" class="c">B</tspan></text>
<text transform="translate(304.395 25.235)"><tspan y="0" x="0" class="d">,</tspan></text>

<p class="C7slaghtLVHYcZZwz5EVT">then <span class="pretex-inline" style="width:3.05899em"><span style="height:0.7415em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 7.2419872" class="a">Ax</tspan></text>
<text transform="translate(16.441)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(29.002)"><tspan y="0" x="0" class="a">b</tspan></text>
</svg></span></span> has multiple solutions, so it does not satisfy condition 6 of the <a knowl="./knowl/imt-1.html?vers=b58525" knowl-id="xref-imt-1" alt="Invertible Matrix Theorem 3.6.1 " title="Invertible Matrix Theorem 3.6.1 ">invertible matrix theorem</a>.  Therefore, it does not satisfy condition 5, so the columns of <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
</svg></span></span> do not span <span class="pretex-inline" style="width:1.36307em"><span style="height:0.87066em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="f">R</tspan></text>
<text transform="translate(7.701 -4.579)"><tspan y="0" x="0" class="g">3</tspan></text>
<text transform="translate(12.453)"><tspan y="0" x="0" class="d">.</tspan></text>
</svg></span></span>  Therefore, the column space has dimension strictly less than 3, the rank is at most <span class="pretex-inline" style="width:0.834em"><span style="height:0.7005em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 6.3812122" class="d">2.</tspan></text>
</svg></span></span></p>
