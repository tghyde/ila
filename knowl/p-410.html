<text transform="translate(7.701 -4.579)"><tspan y="0" x="0" class="b">3</tspan></text>
</svg></span></span> can be written as a linear combination of <span class="pretex-inline" style="width:3.7022em"><span style="height:0.71567em;vertical-align:-0.23067em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="c">e</tspan></text>

</svg></span></span> with unique coefficients.  For example,</p>
