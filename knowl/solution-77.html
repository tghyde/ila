</h5>
<p>If we set</p>

<text transform="translate(29.002)"><tspan y="0" x="0" class="a">b</tspan></text>
</svg></span></span> has multiple solutions, so it does not satisfy condition 6 of the <a knowl="./knowl/imt-1.html?vers=568603" knowl-id="xref-imt-1" alt="Invertible Matrix Theorem 3.6.1 " title="Invertible Matrix Theorem 3.6.1 ">invertible matrix theorem</a>.  Therefore, it does not satisfy condition 5, so the columns of <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
