<article class="remark-like Cqs6RYL7bl6yVw1b98FrG"><h5 class="heading">
<span class="type">Note</span><span class="codenumber">5.3.23</span>
</h5>
<p>The converse of the <a knowl="./knowl/similarity-charpoly.html?vers=cb75e0" knowl-id="xref-similarity-charpoly" alt="Fact 5.3.21 " title="Fact 5.3.21 ">fact</a> is false.  Indeed, the matrices</p>
<div class="pretex-display"><svg height="2.43965em" version="1.1" class="pretex" viewBox="187 1 131 28"><text transform="translate(186.035 2.394)"><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(194.809 10.76)"><tspan y="0" x="0 16.343248" class="b">11</tspan><tspan y="13.947" x="0 16.343248" class="b">01</tspan></text>
<text transform="translate(219.136 2.394)"><tspan y="0" x="0" class="a">B</tspan></text>
<text transform="translate(242.589 18.261)"><tspan y="0" x="0 5.8188391 12.337775" class="b">and</tspan></text>
<text transform="translate(277.691 2.394)"><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(286.465 10.76)"><tspan y="0" x="0 16.343248" class="b">10</tspan><tspan y="13.947" x="0 16.343248" class="b">01</tspan></text>
<text transform="translate(310.792 2.394)"><tspan y="0" x="0" class="a">B</tspan></text>
</svg></div>
<p>both have characteristic polynomial <span class="pretex-inline" style="width:7.13004em"><span style="height:1.07416em;vertical-align:-0.2175em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(1.435)"><tspan y="0" x="0" class="c">f</tspan></text>
<text transform="translate(7.495)"><tspan y="0" x="0" class="d">(</tspan></text>
<text transform="translate(12.005)"><tspan y="0" x="0" class="e">λ</tspan></text>
<text transform="translate(19.477)"><tspan y="0" x="0 7.1788635 18.884256" class="d">)=(</tspan></text>
<text transform="translate(42.867)"><tspan y="0" x="0" class="e">λ</tspan></text>
<text transform="translate(52.473)"><tspan y="0" x="0" class="f">−</tspan></text>
<text transform="translate(62.997)"><tspan y="0" x="0" class="b">1</tspan></text>
<text transform="translate(69.378)"><tspan y="0" x="0" class="d">)</tspan></text>
<text transform="translate(73.889 -4.579)"><tspan y="0" x="0" class="g">2</tspan></text>
<text transform="translate(78.641)"><tspan y="0" x="0" class="b">,</tspan></text>
</svg></span></span> but they are not similar, because the only matrix that is similar to <span class="pretex-inline" style="width:0.80107em"><span style="height:0.9em;vertical-align:-0.226em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="c">I</tspan></text>
<text transform="translate(4.442 2.594)"><tspan y="0" x="0" class="g">2</tspan></text>
</svg></span></span> is <span class="pretex-inline" style="width:0.80107em"><span style="height:0.9em;vertical-align:-0.226em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="c">I</tspan></text>
<text transform="translate(4.442 2.594)"><tspan y="0" x="0" class="g">2</tspan></text>
</svg></span></span> itself.</p></article><span class="incontext Cqs6RYL7bl6yVw1b98FrG"><a href="similarity.html#note-24">in-context</a></span>
