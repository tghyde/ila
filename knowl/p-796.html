<h5 class="heading CntlslGFkp7YqjBo2D9vU"><span class="type">Paragraph</span></h5>
<p class="CntlslGFkp7YqjBo2D9vU">In other words, the determinant of <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
</svg></span></span> is the product of diagonal entries of the row echelon form <span class="pretex-inline" style="width:0.931em"><span style="height:0.844em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">B</tspan></text>
<text transform="translate(7.494)"><tspan y="0" x="0" class="b">,</tspan></text>
</svg></span></span> times a factor of <span class="pretex-inline" style="width:1.287em"><span style="height:0.7005em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="c">±</tspan></text>

</svg></span></span> coming from the number of row swaps you made, divided by the product of the scaling factors used in the row reduction.</p>
