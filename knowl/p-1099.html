<p>In this section, we study in detail the situation when two matrices behave similarly with respect to different coordinate systems.  In <a href="diagonalization.html" alt="Section 5.4 Diagonalization" title="Section 5.4 Diagonalization">Section 5.4</a> and <a href="complex-eigenvalues.html" alt="Section 5.5 Complex Eigenvalues" title="Section 5.5 Complex Eigenvalues">Section 5.5</a>, we will show how to use eigenvalues and eigenvectors to find a simpler matrix that behaves like a given matrix.</p>
