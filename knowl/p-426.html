<p class="C1ns4KPjfoQlrAzjE-vXN">If <span class="pretex-inline" style="width:0.644em"><span style="height:0.4925em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="d">x</tspan></text>
</svg></span></span> is <em>not</em> in <span class="pretex-inline" style="width:1.027em"><span style="height:0.844em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="d">V</tspan></text>
<text transform="translate(8.596)"><tspan y="0" x="0" class="f">,</tspan></text>
</svg></span></span> then this equation has no solution, as <span class="pretex-inline" style="width:0.644em"><span style="height:0.4925em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="d">x</tspan></text>

<text transform="translate(120.01)"><tspan y="0" x="0" class="f">.</tspan></text>
