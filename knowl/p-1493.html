<p class="CF0HKe81ExcrgybFVKfTK">In the context of the above recipe, if we start with a <em>basis</em> of <span class="pretex-inline" style="width:1.304em"><span style="height:0.844em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">W</tspan></text>
<text transform="translate(11.775)"><tspan y="0" x="0" class="b">,</tspan></text>
</svg></span></span> then it turns out that the square matrix <span class="pretex-inline" style="width:1.6454em"><span style="height:0.84833em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(6.764 -4.579)"><tspan y="0" x="0" class="c">T</tspan></text>

</svg></span></span> is automatically invertible!  (It is always the case that <span class="pretex-inline" style="width:1.6454em"><span style="height:0.84833em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(6.764 -4.579)"><tspan y="0" x="0" class="c">T</tspan></text>

</svg></span></span> is square and the equation <span class="pretex-inline" style="width:5.09979em"><span style="height:0.85983em;vertical-align:-0.0115em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
