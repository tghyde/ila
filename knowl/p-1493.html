<h5 class="heading C2GZMsNYmC7IJxg_Sp8YP"><span class="type">Paragraph</span></h5>
<p class="C2GZMsNYmC7IJxg_Sp8YP">When <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
</svg></span></span> is a matrix with more than one column, computing the orthogonal projection of <span class="pretex-inline" style="width:0.644em"><span style="height:0.4925em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">x</tspan></text>
</svg></span></span> onto <span class="pretex-inline" style="width:5.07298em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">W</tspan></text>
<text transform="translate(14.444)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(26.145)"><tspan y="0" x="0 7.2534642 13.439567" class="c">Col</tspan></text>
<text transform="translate(42.821)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(47.331)"><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(53.712)"><tspan y="0" x="0" class="b">)</tspan></text>
</svg></span></span> means solving the matrix equation <span class="pretex-inline" style="width:5.37778em"><span style="height:0.86233em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(6.764 -4.579)"><tspan y="0" x="0" class="d">T</tspan></text>
<text transform="translate(12.503)"><tspan y="0" x="0 6.6681371" class="a">Ac</tspan></text>
<text transform="translate(26.935)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(38.636)"><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(45.4 -4.579)"><tspan y="0" x="0" class="d">T</tspan></text>
<text transform="translate(52)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(58.53)"><tspan y="0" x="0" class="c">.</tspan></text>
