</svg></span></span> sums the rows:</p>

<text transform="translate(12.503)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></span></span>  But <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
