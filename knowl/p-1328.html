<h5 class="heading C4QF_gptxJJagJOfAjS4X"><span class="type">Paragraph</span></h5>
<p class="C4QF_gptxJJagJOfAjS4X">In fact, for a <em>positive</em> stochastic matrix <span class="pretex-inline" style="width:0.834em"><span style="height:0.844em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(6.381)"><tspan y="0" x="0" class="b">,</tspan></text>
</svg></span></span> one can show that if <span class="pretex-inline" style="width:2.45899em"><span style="height:0.9em;vertical-align:-0.161em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="c">λ</tspan></text>
<text transform="translate(10.14)"><tspan y="0" x="0" class="d">A</tspan></text>
<text transform="translate(10.14)"><tspan y="0" x="0" class="e">=</tspan></text>
<text transform="translate(21.841)"><tspan y="0" x="0" class="b">1</tspan></text>
</svg></span></span> is a (real or complex) eigenvalue of <span class="pretex-inline" style="width:0.834em"><span style="height:0.844em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(6.381)"><tspan y="0" x="0" class="b">,</tspan></text>
</svg></span></span> then <span class="pretex-inline" style="width:3.29899em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="d">|</tspan></text>
<text transform="translate(3.225)"><tspan y="0" x="0" class="c">λ</tspan></text>
<text transform="translate(10.697)"><tspan y="0" x="0" class="d">|</tspan></text>
<text transform="translate(16.59)"><tspan y="0" x="0" class="c">&lt;</tspan></text>
<text transform="translate(28.291)"><tspan y="0" x="0 6.3812122" class="b">1.</tspan></text>
</svg></span></span>  The <span class="pretex-bind"><span class="pretex-inline" style="width:0.556em"><span style="height:0.6935em;vertical-align:-0.007em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="b">1</tspan></text>
</svg></span></span>-eigenspace</span> of a stochastic matrix is very important.</p>
