<h5 class="heading CehEdP2ezjIuvsvSQ8ZiH"><span class="type">Paragraph</span></h5>
<p class="CehEdP2ezjIuvsvSQ8ZiH">The identity matrix</p>
<div class="pretex-display CehEdP2ezjIuvsvSQ8ZiH"><svg height="2.43965em" version="1.1" class="pretex" viewBox="219 1 65 28"><text transform="translate(220.656 18.261)"><tspan y="0" x="0" class="a">I</tspan></text>
<text transform="translate(224.523 20.855)"><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(231.944 18.261)"><tspan y="0" x="0" class="c">=</tspan></text>
<text transform="translate(243.645 2.394)"><tspan y="0" x="0" class="d">A</tspan></text>
<text transform="translate(252.419 10.76)"><tspan y="0" x="0 16.343248" class="e">10</tspan><tspan y="13.947" x="0 16.343248" class="e">01</tspan></text>
<text transform="translate(276.745 2.394)"><tspan y="0" x="0" class="d">B</tspan></text>
</svg></div>
<p class="CehEdP2ezjIuvsvSQ8ZiH">also has characteristic polynomial <span class="pretex-inline" style="width:3.78806em"><span style="height:1.04566em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="c">(</tspan></text>
<text transform="translate(4.51)"><tspan y="0" x="0" class="f">λ</tspan></text>
<text transform="translate(14.117)"><tspan y="0" x="0" class="g">−</tspan></text>
<text transform="translate(24.641)"><tspan y="0" x="0" class="e">1</tspan></text>
<text transform="translate(31.022)"><tspan y="0" x="0" class="c">)</tspan></text>
<text transform="translate(35.533 -4.579)"><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(40.285)"><tspan y="0" x="0" class="e">,</tspan></text>
</svg></span></span> so the eigenvalue <span class="pretex-inline" style="width:0.556em"><span style="height:0.6935em;vertical-align:-0.007em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="e">1</tspan></text>
</svg></span></span> has algebraic multiplicity <span class="pretex-inline" style="width:0.834em"><span style="height:0.7005em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 6.3812122" class="e">2.</tspan></text>
</svg></span></span>  Since every nonzero vector in <span class="pretex-inline" style="width:1.08507em"><span style="height:0.86467em;vertical-align:-0.008em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="h">R</tspan></text>
<text transform="translate(7.701 -4.579)"><tspan y="0" x="0" class="b">2</tspan></text>
</svg></span></span> is an eigenvector of <span class="pretex-inline" style="width:0.80107em"><span style="height:0.9em;vertical-align:-0.226em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">I</tspan></text>
<text transform="translate(4.442 2.594)"><tspan y="0" x="0" class="b">2</tspan></text>
</svg></span></span> with eigenvalue <span class="pretex-inline" style="width:0.834em"><span style="height:0.8565em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 6.3812122" class="e">1,</tspan></text>
</svg></span></span> the <span class="pretex-bind"><span class="pretex-inline" style="width:0.556em"><span style="height:0.6935em;vertical-align:-0.007em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="e">1</tspan></text>
</svg></span></span>-eigenspace</span> is all of <span class="pretex-inline" style="width:1.36307em"><span style="height:1.02666em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="h">R</tspan></text>
<text transform="translate(7.701 -4.579)"><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(12.453)"><tspan y="0" x="0" class="e">,</tspan></text>
</svg></span></span> so the geometric multiplicity is <span class="pretex-inline" style="width:0.556em"><span style="height:0.6865em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="e">2</tspan></text>
</svg></span></span> as well.  This matrix is diagonal.</p>
