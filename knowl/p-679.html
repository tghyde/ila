</svg></span></span> which is characterized by the property that <span class="pretex-inline" style="width:3.26799em"><span style="height:0.748em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0 7.1731248" class="a">ab</tspan></text>
