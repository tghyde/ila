<text transform="translate(7.701 -4.579)"><tspan y="0" x="0" class="b">3</tspan></text>
</svg></span></span></em>, so the codomain is still <span class="pretex-inline" style="width:1.36307em"><span style="height:0.87066em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">R</tspan></text>

<text transform="translate(12.453)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></span></span>  The outputs of <span class="pretex-inline" style="width:0.735em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="d">T</tspan></text>
