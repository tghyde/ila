<h5 class="heading CmX3hwzt69xjqOGSRIuF0"><span class="type">Paragraph</span></h5>
<p class="CmX3hwzt69xjqOGSRIuF0">Geometrically, the difference of two vectors <span class="pretex-inline" style="width:1.66349em"><span style="height:0.654em;vertical-align:-0.169em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(5.83)"><tspan y="0" x="0" class="b">,</tspan></text>
<text transform="translate(10.909)"><tspan y="0" x="0" class="a">w</tspan></text>
</svg></span></span> is obtained as follows: place the tail of <span class="pretex-inline" style="width:0.554em"><span style="height:0.485em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">v</tspan></text>
</svg></span></span> and <span class="pretex-inline" style="width:0.738em"><span style="height:0.485em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">w</tspan></text>
</svg></span></span> at the same point.  Then <span class="pretex-inline" style="width:2.39499em"><span style="height:0.609em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(8.493)"><tspan y="0" x="0" class="c">−</tspan></text>
<text transform="translate(19.304)"><tspan y="0" x="0" class="a">w</tspan></text>
</svg></span></span> is the vector from the head of <span class="pretex-inline" style="width:0.738em"><span style="height:0.485em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">w</tspan></text>
</svg></span></span> to the head of <span class="pretex-inline" style="width:0.832em"><span style="height:0.499em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(6.358)"><tspan y="0" x="0" class="b">.</tspan></text>
