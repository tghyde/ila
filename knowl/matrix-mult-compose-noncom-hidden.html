<body><article class="example-like CHTZR4bjBWyHmCj5e5QuH"><p>Define matrix transformations <span class="pretex-inline" style="width:6.12162em"><span style="height:1.02566em;vertical-align:-0.169em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>

<text transform="translate(11.816)"><tspan y="0" x="0" class="a">U</tspan></text>
<text transform="translate(21.537)"><tspan y="0" x="0" class="b">:</tspan></text>
<text transform="translate(28.4)"><tspan y="0" x="0" class="c">R</tspan></text>
<text transform="translate(36.101 -4.579)"><tspan y="0" x="0" class="d">2</tspan></text>
<text transform="translate(43.522)"><tspan y="0" x="0" class="e">→</tspan></text>
<text transform="translate(57.805)"><tspan y="0" x="0" class="c">R</tspan></text>
<text transform="translate(65.506 -4.579)"><tspan y="0" x="0" class="d">2</tspan></text>
</svg></span></span> by</p>
<div class="pretex-display"><svg height="2.43965em" version="1.1" class="pretex" viewbox="138 1 229 28"><text transform="translate(138.153 18.261)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(146.015 18.261)"><tspan y="0" x="0" class="f">(</tspan></text>
<text transform="translate(151.386 18.261)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(157.917 18.261)"><tspan y="0" x="0 7.1788635" class="f">)=</tspan></text>
<text transform="translate(176.796 2.394)"><tspan y="0" x="0" class="g">C</tspan></text>
<text transform="translate(185.57 10.76)"><tspan y="0" x="0 16.343248" class="b">11</tspan><tspan y="13.947" x="0 16.343248" class="b">01</tspan></text>
<text transform="translate(209.897 2.394)"><tspan y="0" x="0" class="g">D</tspan></text>
<text transform="translate(219.531 18.261)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(240.741 18.261)"><tspan y="0" x="0 5.8188391 12.337775" class="b">and</tspan></text>
<text transform="translate(274.529 18.261)"><tspan y="0" x="0" class="a">U</tspan></text>
<text transform="translate(283.183 18.261)"><tspan y="0" x="0" class="f">(</tspan></text>
<text transform="translate(288.554 18.261)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(295.085 18.261)"><tspan y="0" x="0 7.1788635" class="f">)=</tspan></text>
<text transform="translate(313.964 2.394)"><tspan y="0" x="0" class="g">C</tspan></text>
<text transform="translate(322.739 10.76)"><tspan y="0" x="0 16.343248" class="b">10</tspan><tspan y="13.947" x="0 16.343248" class="b">11</tspan></text>
<text transform="translate(347.065 2.394)"><tspan y="0" x="0" class="g">D</tspan></text>
<text transform="translate(356.7 18.261)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(363.23 18.261)"><tspan y="0" x="0" class="b">.</tspan></text>
</svg></div>
<p>Geometrically, <span class="pretex-inline" style="width:0.735em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
</svg></span></span> is a shear in the <span class="pretex-bind"><span class="pretex-inline" style="width:0.644em"><span style="height:0.4925em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">x</tspan></text>
</svg></span></span>-direction,</span> and <span class="pretex-inline" style="width:0.779em"><span style="height:0.6855em;vertical-align:-0.0115em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">U</tspan></text>
</svg></span></span> is a shear in the <span class="pretex-bind"><span class="pretex-inline" style="width:0.742em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">Y</tspan></text>
</svg></span></span>-direction.</span>  We evaluate</p>
<div class="pretex-display"><svg height="2.43965em" version="1.1" class="pretex" viewbox="187 1 130 28"><text transform="translate(187.568 18.261)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(197.565 18.261)"><tspan y="0" x="0" class="e">◦</tspan></text>
<text transform="translate(205.794 18.261)"><tspan y="0" x="0" class="a">U</tspan></text>
<text transform="translate(216.048 2.394)"><tspan y="0" x="0" class="g">C</tspan></text>
<text transform="translate(223.221 10.76)"><tspan y="0" x="0" class="b">1</tspan><tspan y="13.947" x="0" class="b">0</tspan></text>
<text transform="translate(229.603 2.394)"><tspan y="0" x="0" class="g">D</tspan></text>
<text transform="translate(239.444 18.261)"><tspan y="0" x="0" class="f">=</tspan></text>
<text transform="translate(251.719 18.261)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(261.182 2.394)"><tspan y="0" x="0" class="g">C</tspan></text>
<text transform="translate(268.355 10.76)"><tspan y="0" x="0" class="b">1</tspan><tspan y="13.947" x="0" class="b">1</tspan></text>
<text transform="translate(274.736 2.394)"><tspan y="0" x="0" class="g">D</tspan></text>
<text transform="translate(284.577 18.261)"><tspan y="0" x="0" class="f">=</tspan></text>
<text transform="translate(296.278 2.394)"><tspan y="0" x="0" class="g">C</tspan></text>
<text transform="translate(303.451 10.76)"><tspan y="0" x="0" class="b">2</tspan><tspan y="13.947" x="0" class="b">1</tspan></text>
<text transform="translate(309.833 2.394)"><tspan y="0" x="0" class="g">D</tspan></text>
</svg></div>
<p>and</p>
<div class="pretex-display"><svg height="2.43965em" version="1.1" class="pretex" viewbox="184 1 136 28"><text transform="translate(184.633 18.261)"><tspan y="0" x="0" class="a">U</tspan></text>
<text transform="translate(195.421 18.261)"><tspan y="0" x="0" class="e">◦</tspan></text>
<text transform="translate(203.937 18.261)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(213.4 2.394)"><tspan y="0" x="0" class="g">C</tspan></text>
<text transform="translate(220.573 10.76)"><tspan y="0" x="0" class="b">1</tspan><tspan y="13.947" x="0" class="b">0</tspan></text>
<text transform="translate(226.954 2.394)"><tspan y="0" x="0" class="g">D</tspan></text>
<text transform="translate(236.796 18.261)"><tspan y="0" x="0" class="f">=</tspan></text>
<text transform="translate(248.784 18.261)"><tspan y="0" x="0" class="a">U</tspan></text>
<text transform="translate(259.038 2.394)"><tspan y="0" x="0" class="g">C</tspan></text>
<text transform="translate(266.211 10.76)"><tspan y="0" x="0" class="b">1</tspan><tspan y="13.947" x="0" class="b">0</tspan></text>
<text transform="translate(272.593 2.394)"><tspan y="0" x="0" class="g">D</tspan></text>
<text transform="translate(282.434 18.261)"><tspan y="0" x="0" class="f">=</tspan></text>
<text transform="translate(294.135 2.394)"><tspan y="0" x="0" class="g">C</tspan></text>
<text transform="translate(301.308 10.76)"><tspan y="0" x="0" class="b">1</tspan><tspan y="13.947" x="0" class="b">1</tspan></text>
<text transform="translate(307.689 2.394)"><tspan y="0" x="0" class="g">D</tspan></text>
<text transform="translate(316.463 18.261)"><tspan y="0" x="0" class="b">.</tspan></text>
</svg></div>
<p>Since <span class="pretex-inline" style="width:2.39199em"><span style="height:0.6855em;vertical-align:-0.0115em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">T</tspan></text>
<text transform="translate(10.57)"><tspan y="0" x="0" class="e">◦</tspan></text>
<text transform="translate(18.799)"><tspan y="0" x="0" class="a">U</tspan></text>
</svg></span></span> and <span class="pretex-inline" style="width:2.39199em"><span style="height:0.6855em;vertical-align:-0.0115em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">U</tspan></text>
<text transform="translate(11.075)"><tspan y="0" x="0" class="e">◦</tspan></text>
<text transform="translate(19.591)"><tspan y="0" x="0" class="a">T</tspan></text>
</svg></span></span> have different outputs for the input vector <span class="pretex-inline" style="width:1.428em"><span style="height:1.417em;vertical-align:-0.44533em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0 -10.266)"><tspan y="0" x="0" class="g">A</tspan></text>
<text transform="translate(6.068 -5.899)"><tspan y="0" x="0" class="d">1</tspan><tspan y="9.7089996" x="-1.064 3.1901784" class="d">0,</tspan></text>
<text transform="translate(11.385 -10.266)"><tspan y="0" x="0" class="g">B</tspan></text>
</svg></span></span> they are different transformations.  (See this <a knowl="./knowl/matrix-mult-compose-noncom2.html?vers=7e6906" knowl-id="xref-matrix-mult-compose-noncom2" alt="Example 3.4.23 Non-commutative multiplication of matrices" title="Example 3.4.23 Non-commutative multiplication of matrices">example</a>.)</p>
