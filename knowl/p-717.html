<text transform="translate(8.562)"><tspan y="0" x="0" class="b">:</tspan></text>
<text transform="translate(15.425)"><tspan y="0" x="0" class="c">R</tspan></text>
<text transform="translate(25.795)"><tspan y="0" x="0" class="d">→</tspan></text>
<text transform="translate(40.078)"><tspan y="0" x="0" class="c">R</tspan></text>
</svg></span></span> by <span class="pretex-inline" style="width:4.67106em"><span style="height:1.07416em;vertical-align:-0.2175em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(1.435)"><tspan y="0" x="0" class="a">f</tspan></text>
<text transform="translate(7.495)"><tspan y="0" x="0" class="e">(</tspan></text>
<text transform="translate(12.866)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(19.396)"><tspan y="0" x="0 7.1788635" class="e">)=</tspan></text>
<text transform="translate(39.137)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(45.667 -4.579)"><tspan y="0" x="0" class="f">2</tspan></text>
<text transform="translate(50.419)"><tspan y="0" x="0" class="b">.</tspan></text>
</svg></span></span>  This is <em>not</em> an invertible function.  Indeed, we have <span class="pretex-inline" style="width:8.05897em"><span style="height:0.9845em;vertical-align:-0.2175em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(1.435)"><tspan y="0" x="0" class="a">f</tspan></text>
<text transform="translate(7.495)"><tspan y="0" x="0" class="e">(</tspan></text>
<text transform="translate(12.005)"><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(18.386)"><tspan y="0" x="0 7.1788635" class="e">)=</tspan></text>
<text transform="translate(37.266)"><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(46.315)"><tspan y="0" x="0" class="e">=</tspan></text>
<text transform="translate(59.451)"><tspan y="0" x="0" class="a">f</tspan></text>
<text transform="translate(65.511)"><tspan y="0" x="0" class="e">(</tspan></text>
<text transform="translate(70.021)"><tspan y="0" x="0" class="d">−</tspan></text>
<text transform="translate(78.411)"><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(84.792)"><tspan y="0" x="0" class="e">)</tspan></text>
<text transform="translate(89.303)"><tspan y="0" x="0" class="b">,</tspan></text>
</svg></span></span> so there is no way to undo <span class="pretex-inline" style="width:0.972em"><span style="height:0.9515em;vertical-align:-0.2175em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(1.435)"><tspan y="0" x="0" class="a">f</tspan></text>
<text transform="translate(7.495)"><tspan y="0" x="0" class="b">:</tspan></text>
</svg></span></span> the inverse transformation would not know if it should send <span class="pretex-inline" style="width:0.556em"><span style="height:0.6865em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="b">2</tspan></text>
</svg></span></span> to <span class="pretex-inline" style="width:0.556em"><span style="height:0.6865em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="b">2</tspan></text>
</svg></span></span> or <span class="pretex-inline" style="width:1.565em"><span style="height:0.7005em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="d">−</tspan></text>
<text transform="translate(8.39)"><tspan y="0" x="0 6.3812122" class="b">2.</tspan></text>
</svg></span></span>  More formally, if <span class="pretex-inline" style="width:4.14098em"><span style="height:0.8945em;vertical-align:-0.2175em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">g</tspan></text>
<text transform="translate(8.309)"><tspan y="0" x="0" class="b">:</tspan></text>
<text transform="translate(15.173)"><tspan y="0" x="0" class="c">R</tspan></text>
<text transform="translate(25.542)"><tspan y="0" x="0" class="d">→</tspan></text>
<text transform="translate(39.825)"><tspan y="0" x="0" class="c">R</tspan></text>
</svg></span></span> satisfies <span class="pretex-inline" style="width:5.67398em"><span style="height:0.9845em;vertical-align:-0.2175em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">g</tspan></text>
<text transform="translate(7.242)"><tspan y="0" x="0" class="e">(</tspan></text>
<text transform="translate(13.187)"><tspan y="0" x="0" class="a">f</tspan></text>
<text transform="translate(19.247)"><tspan y="0" x="0" class="e">(</tspan></text>
<text transform="translate(24.618)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(31.149)"><tspan y="0" x="0 4.5047226 11.683586" class="e">))=</tspan></text>
<text transform="translate(55.4)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(61.93)"><tspan y="0" x="0" class="b">,</tspan></text>
</svg></span></span> then</p>
<div class="pretex-display CK5BlRD9gsYk1JFes8uhX"><svg height="1.1327em" version="1.1" class="pretex" viewBox="118 4 267 13"><text transform="translate(118.867 13.948)"><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(127.916 13.948)"><tspan y="0" x="0" class="e">=</tspan></text>
<text transform="translate(140.478 13.948)"><tspan y="0" x="0" class="a">g</tspan></text>
<text transform="translate(146.859 13.948)"><tspan y="0" x="0" class="e">(</tspan></text>
<text transform="translate(152.804 13.948)"><tspan y="0" x="0" class="a">f</tspan></text>
<text transform="translate(158.864 13.948)"><tspan y="0" x="0" class="e">(</tspan></text>
<text transform="translate(163.375 13.948)"><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(169.756 13.948)"><tspan y="0" x="0 4.5047226 11.683586" class="e">))=</tspan></text>
<text transform="translate(194.007 13.948)"><tspan y="0" x="0" class="a">g</tspan></text>
<text transform="translate(200.388 13.948)"><tspan y="0" x="0" class="e">(</tspan></text>
<text transform="translate(204.898 13.948)"><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(211.28 13.948)"><tspan y="0" x="0" class="e">)</tspan></text>
<text transform="translate(230.469 13.948)"><tspan y="0" x="0 5.8188391 12.337775" class="b">and</tspan></text>
<text transform="translate(266.105 13.948)"><tspan y="0" x="0" class="d">−</tspan></text>
<text transform="translate(276.63 13.948)"><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(285.679 13.948)"><tspan y="0" x="0" class="e">=</tspan></text>
<text transform="translate(298.241 13.948)"><tspan y="0" x="0" class="a">g</tspan></text>
<text transform="translate(304.622 13.948)"><tspan y="0" x="0" class="e">(</tspan></text>
<text transform="translate(310.567 13.948)"><tspan y="0" x="0" class="a">f</tspan></text>
<text transform="translate(316.627 13.948)"><tspan y="0" x="0" class="e">(</tspan></text>
<text transform="translate(321.137 13.948)"><tspan y="0" x="0" class="d">−</tspan></text>
<text transform="translate(329.527 13.948)"><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(335.908 13.948)"><tspan y="0" x="0 4.5161996 11.695063" class="e">))=</tspan></text>
<text transform="translate(360.159 13.948)"><tspan y="0" x="0" class="a">g</tspan></text>
<text transform="translate(366.54 13.948)"><tspan y="0" x="0" class="e">(</tspan></text>
<text transform="translate(371.051 13.948)"><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(377.432 13.948)"><tspan y="0" x="0" class="e">)</tspan></text>
<text transform="translate(381.943 13.948)"><tspan y="0" x="0" class="b">,</tspan></text>
</svg></div>
<p class="CK5BlRD9gsYk1JFes8uhX">which is impossible: <span class="pretex-inline" style="width:1.97299em"><span style="height:0.9845em;vertical-align:-0.2175em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">g</tspan></text>
<text transform="translate(7.242)"><tspan y="0" x="0" class="e">(</tspan></text>
<text transform="translate(11.752)"><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(18.134)"><tspan y="0" x="0" class="e">)</tspan></text>
</svg></span></span> is a number, so it cannot be equal to <span class="pretex-inline" style="width:0.556em"><span style="height:0.6865em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="b">2</tspan></text>
</svg></span></span> and <span class="pretex-inline" style="width:1.287em"><span style="height:0.7005em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="d">−</tspan></text>
<text transform="translate(8.39)"><tspan y="0" x="0" class="b">2</tspan></text>
</svg></span></span> at the same time.</p>
