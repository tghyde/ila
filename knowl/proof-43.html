</svg></span></span></p>

</svg></span></span> matrices; the reader is encouraged to complete the proof in general using cofactor expansions.  We can write a <span class="pretex-inline" style="width:2.21499em"><span style="height:0.7005em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="c">2</tspan></text>

</svg></span></span> matrix as <span class="pretex-inline" style="width:4.49384em"><span style="height:1.331em;vertical-align:-0.3765em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
