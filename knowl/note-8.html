<article class="remark-like CQH6jj-vgCQjvxdaJPB1_"><h5 class="heading">
<span class="type">Note</span><span class="codenumber">2.3.8</span><span class="title">(Matrix Equations and Vector Equations)</span>
</h5>
<p>Let <span class="pretex-inline" style="width:5.20085em"><span style="height:0.716em;vertical-align:-0.231em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(5.498 2.594)"><tspan y="0" x="0" class="b">1</tspan></text>
<text transform="translate(10.25)"><tspan y="0" x="0" class="c">,</tspan></text>
<text transform="translate(15.615)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(20.539 2.594)"><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(25.291)"><tspan y="0" x="0 4.7973862 9.5832949 14.380681 19.16659" class="c">,...,</tspan></text>
<text transform="translate(49.823)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(54.938 2.594)"><tspan y="0" x="0" class="d">n</tspan></text>
</svg></span></span> and <span class="pretex-inline" style="width:0.607em"><span style="height:0.7415em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">b</tspan></text>
</svg></span></span> be vectors in <span class="pretex-inline" style="width:1.5524em"><span style="height:0.73633em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="e">R</tspan></text>
<text transform="translate(7.892 -4.579)"><tspan y="0" x="0" class="d">m</tspan></text>
<text transform="translate(14.626)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></span></span>  Consider the vector equation</p>
<div class="pretex-display"><svg height="1.21983em" version="1.1" class="pretex" viewBox="181 4 142 14"><text transform="translate(182.112 13.948)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(188.161 16.542)"><tspan y="0" x="0" class="b">1</tspan></text>
<text transform="translate(193.487 13.948)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(198.41 16.542)"><tspan y="0" x="0" class="b">1</tspan></text>
<text transform="translate(205.297 13.948)"><tspan y="0" x="0" class="f">+</tspan></text>
<text transform="translate(216.683 13.948)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(222.731 16.542)"><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(228.057 13.948)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(232.981 16.542)"><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(239.868 13.948)"><tspan y="0" x="0" class="f">+</tspan></text>
<text transform="translate(250.392 13.948)"><tspan y="0" x="0 4.8318172 9.6521568" class="g">···</tspan></text>
<text transform="translate(265.404 13.948)"><tspan y="0" x="0" class="f">+</tspan></text>
<text transform="translate(276.789 13.948)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(283.029 16.542)"><tspan y="0" x="0" class="d">n</tspan></text>
<text transform="translate(288.355 13.948)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(293.47 16.542)"><tspan y="0" x="0" class="d">n</tspan></text>
<text transform="translate(300.891 13.948)"><tspan y="0" x="0" class="f">=</tspan></text>
<text transform="translate(313.452 13.948)"><tspan y="0" x="0" class="a">b</tspan></text>
<text transform="translate(319.558 13.948)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></div>
<p>This is equivalent to the matrix equation <span class="pretex-inline" style="width:3.33699em"><span style="height:0.904em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 7.2419872" class="a">Ax</tspan></text>
<text transform="translate(16.441)"><tspan y="0" x="0" class="f">=</tspan></text>
<text transform="translate(29.002)"><tspan y="0" x="0" class="a">b</tspan></text>
<text transform="translate(35.108)"><tspan y="0" x="0" class="c">,</tspan></text>
</svg></span></span> where</p>
<div class="pretex-display"><svg height="5.57635em" version="1.1" class="pretex" viewBox="139 0 225 64"><text transform="translate(140.534 35.37)"><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(149.583 35.37)"><tspan y="0" x="0" class="f">=</tspan></text>
<text transform="translate(161.284 13.552)"><tspan y="0" x="0" class="h">A</tspan></text>
<text transform="translate(174.787 20.895)"><tspan y="0" x="0 20.210997 64.959824" class="g">|||</tspan></text>
<text transform="translate(171.849 34.843)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(176.772 37.436)"><tspan y="0" x="0" class="b">1</tspan></text>
<text transform="translate(192.061 34.843)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(196.985 37.436)"><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(211.7 34.843)"><tspan y="0" x="0 4.8203402 9.6521568" class="g">···</tspan></text>
<text transform="translate(236.714 34.843)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(241.829 37.436)"><tspan y="0" x="0" class="d">n</tspan></text>
<text transform="translate(174.787 48.79)"><tspan y="0" x="0 20.210997 64.959824" class="g">|||</tspan></text>
<text transform="translate(248.183 13.552)"><tspan y="0" x="0" class="h">B</tspan></text>
<text transform="translate(272.852 35.37)"><tspan y="0" x="0 5.8188391 12.337775" class="c">and</tspan></text>
<text transform="translate(307.215 35.37)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(316.413 35.37)"><tspan y="0" x="0" class="f">=</tspan></text>
<text transform="translate(328.114 1.685)"><tspan y="0" x="0" class="h">C</tspan><tspan y="22.885" x="0" class="h">G</tspan><tspan y="30.368" x="0" class="h">G</tspan><tspan y="38.540001" x="0" class="h">E</tspan></text>
<text transform="translate(338.424 11.186)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(344.473 13.78)"><tspan y="0" x="0" class="b">1</tspan></text>
<text transform="translate(338.424 25.134)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(344.473 27.728)"><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(341.799 36.581)"><tspan y="0" x="0" class="c">.</tspan><tspan y="3.9849999" x="0" class="c">.</tspan><tspan y="7.9699998" x="0" class="c">.</tspan></text>
<text transform="translate(338.329 58.499)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(344.568 61.093)"><tspan y="0" x="0" class="d">n</tspan></text>
<text transform="translate(349.321 1.685)"><tspan y="0" x="0" class="h">D</tspan><tspan y="22.885" x="0" class="h">H</tspan><tspan y="30.368" x="0" class="h">H</tspan><tspan y="38.540001" x="0" class="h">F</tspan></text>
<text transform="translate(360.276 35.37)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></div>
<p>Conversely, if <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
</svg></span></span> is any <span class="pretex-inline" style="width:2.52399em"><span style="height:0.609em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="a">m</tspan></text>
<text transform="translate(11.775)"><tspan y="0" x="0" class="g">×</tspan></text>
<text transform="translate(22.587)"><tspan y="0" x="0" class="a">n</tspan></text>
</svg></span></span> matrix, then <span class="pretex-inline" style="width:3.05899em"><span style="height:0.7415em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 7.2419872" class="a">Ax</tspan></text>
<text transform="translate(16.441)"><tspan y="0" x="0" class="f">=</tspan></text>
<text transform="translate(29.002)"><tspan y="0" x="0" class="a">b</tspan></text>
</svg></span></span> is equivalent to the vector equation</p>
<div class="pretex-display"><svg height="1.21983em" version="1.1" class="pretex" viewBox="181 4 142 14"><text transform="translate(182.112 13.948)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(188.161 16.542)"><tspan y="0" x="0" class="b">1</tspan></text>
<text transform="translate(193.487 13.948)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(198.41 16.542)"><tspan y="0" x="0" class="b">1</tspan></text>
<text transform="translate(205.297 13.948)"><tspan y="0" x="0" class="f">+</tspan></text>
<text transform="translate(216.683 13.948)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(222.731 16.542)"><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(228.057 13.948)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(232.981 16.542)"><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(239.868 13.948)"><tspan y="0" x="0" class="f">+</tspan></text>
<text transform="translate(250.392 13.948)"><tspan y="0" x="0 4.8318172 9.6521568" class="g">···</tspan></text>
<text transform="translate(265.404 13.948)"><tspan y="0" x="0" class="f">+</tspan></text>
<text transform="translate(276.789 13.948)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(283.029 16.542)"><tspan y="0" x="0" class="d">n</tspan></text>
<text transform="translate(288.355 13.948)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(293.47 16.542)"><tspan y="0" x="0" class="d">n</tspan></text>
<text transform="translate(300.891 13.948)"><tspan y="0" x="0" class="f">=</tspan></text>
<text transform="translate(313.452 13.948)"><tspan y="0" x="0" class="a">b</tspan></text>
<text transform="translate(319.558 13.948)"><tspan y="0" x="0" class="c">,</tspan></text>
</svg></div>
<p>where <span class="pretex-inline" style="width:5.20085em"><span style="height:0.716em;vertical-align:-0.231em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(5.498 2.594)"><tspan y="0" x="0" class="b">1</tspan></text>
<text transform="translate(10.25)"><tspan y="0" x="0" class="c">,</tspan></text>
<text transform="translate(15.615)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(20.539 2.594)"><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(25.291)"><tspan y="0" x="0 4.7973862 9.5832949 14.380681 19.16659" class="c">,...,</tspan></text>
<text transform="translate(49.823)"><tspan y="0" x="0" class="a">v</tspan></text>
<text transform="translate(54.938 2.594)"><tspan y="0" x="0" class="d">n</tspan></text>
</svg></span></span> are the columns of <span class="pretex-inline" style="width:0.834em"><span style="height:0.844em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(6.381)"><tspan y="0" x="0" class="c">,</tspan></text>
</svg></span></span> and <span class="pretex-inline" style="width:5.56986em"><span style="height:0.716em;vertical-align:-0.231em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(6.909 2.594)"><tspan y="0" x="0" class="b">1</tspan></text>
<text transform="translate(11.661)"><tspan y="0" x="0" class="c">,</tspan></text>
<text transform="translate(17.314)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(23.362 2.594)"><tspan y="0" x="0" class="b">2</tspan></text>
<text transform="translate(28.115)"><tspan y="0" x="0 4.7859092 9.5832949 14.369204 19.16659" class="c">,...,</tspan></text>
<text transform="translate(52.933)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(59.173 2.594)"><tspan y="0" x="0" class="d">n</tspan></text>
</svg></span></span> are the entries of <span class="pretex-inline" style="width:0.922em"><span style="height:0.499em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(7.391)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></span></span></p></article><span class="incontext CQH6jj-vgCQjvxdaJPB1_"><a href="matrix-equations.html#note-8">in-context</a></span>
