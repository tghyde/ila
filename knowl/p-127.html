<h5 class="heading Cmub91PHaV2ZGKJii8ZxK"><span class="type">Paragraph</span></h5>
<p class="Cmub91PHaV2ZGKJii8ZxK">The system of one linear equation</p>
<div class="pretex-display Cmub91PHaV2ZGKJii8ZxK Cmub91PHaV2ZGKJii8ZxK"><svg height="1.04557em" version="1.1" class="pretex" viewbox="218 5 68 12"><text transform="translate(219.394 13.948)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(228.059 13.948)"><tspan y="0" x="0" class="b">+</tspan></text>
<text transform="translate(240.018 13.948)"><tspan y="0" x="0" class="a">y</tspan></text>
<text transform="translate(248.568 13.948)"><tspan y="0" x="0" class="b">+</tspan></text>
<text transform="translate(259.093 13.948)"><tspan y="0" x="0" class="a">z</tspan></text>
<text transform="translate(267.385 13.948)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(279.086 13.948)"><tspan y="0" x="0" class="c">1</tspan></text>
</svg></div>
<p class="Cmub91PHaV2ZGKJii8ZxK">comes from the matrix</p>
<div class="pretex-display Cmub91PHaV2ZGKJii8ZxK Cmub91PHaV2ZGKJii8ZxK"><svg height="1.48122em" version="1.1" class="pretex" viewbox="215 2 74 17"><text transform="translate(215.293 3.682)"><tspan y="0" x="0" class="d">A</tspan></text>
<text transform="translate(221.898 13.42)"><tspan y="0" x="0 16.343248 32.686497" class="c">111</tspan></text>
<g transform="matrix(1,0,0,-1,265.948,17.605)"><path d="M 0,0 V 13.948" class="a"></path></g><text transform="translate(270.929 13.42)"><tspan y="0" x="0" class="c">1</tspan></text>
<text transform="translate(278.912 3.682)"><tspan y="0" x="0" class="d">B</tspan></text>
<text transform="translate(285.517 13.948)"><tspan y="0" x="0" class="c">,</tspan></text>
</svg></div>
<p class="Cmub91PHaV2ZGKJii8ZxK">which is already in reduced row echelon form.  The free variables are <span class="pretex-inline" style="width:0.684em"><span style="height:0.7025em;vertical-align:-0.2175em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(1.435)"><tspan y="0" x="0" class="a">y</tspan></text>
</svg></span></span> and <span class="pretex-inline" style="width:0.768em"><span style="height:0.5035em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">z</tspan></text>
<text transform="translate(5.624)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></span></span>  The parametric form for the general solution is</p>
<div class="pretex-display Cmub91PHaV2ZGKJii8ZxK Cmub91PHaV2ZGKJii8ZxK"><svg height="1.1327em" version="1.1" class="pretex" viewbox="183 4 137 13"><text transform="translate(183.941 13.948)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(189.313 13.948)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(195.843 13.948)"><tspan y="0" x="0" class="c">,</tspan></text>
<text transform="translate(203.67 13.948)"><tspan y="0" x="0" class="a">y</tspan></text>
<text transform="translate(209.397 13.948)"><tspan y="0" x="0" class="c">,</tspan></text>
<text transform="translate(215.79 13.948)"><tspan y="0" x="0" class="a">z</tspan></text>
<text transform="translate(221.414 13.948)"><tspan y="0" x="0 7.1788635 18.884256" class="b">)=(</tspan></text>
<text transform="translate(244.804 13.948)"><tspan y="0" x="0" class="c">1</tspan></text>
<text transform="translate(253.32 13.948)"><tspan y="0" x="0" class="e">−</tspan></text>
<text transform="translate(265.279 13.948)"><tspan y="0" x="0" class="a">y</tspan></text>
<text transform="translate(273.829 13.948)"><tspan y="0" x="0" class="e">−</tspan></text>
<text transform="translate(284.354 13.948)"><tspan y="0" x="0" class="a">z</tspan></text>
<text transform="translate(289.977 13.948)"><tspan y="0" x="0" class="c">,</tspan></text>
<text transform="translate(297.805 13.948)"><tspan y="0" x="0" class="a">y</tspan></text>
<text transform="translate(303.532 13.948)"><tspan y="0" x="0" class="c">,</tspan></text>
<text transform="translate(309.924 13.948)"><tspan y="0" x="0" class="a">z</tspan></text>
<text transform="translate(315.548 13.948)"><tspan y="0" x="0" class="b">)</tspan></text>
</svg></div>
<p class="Cmub91PHaV2ZGKJii8ZxK">for any values of <span class="pretex-inline" style="width:0.684em"><span style="height:0.7025em;vertical-align:-0.2175em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(1.435)"><tspan y="0" x="0" class="a">y</tspan></text>
</svg></span></span> and <span class="pretex-inline" style="width:0.768em"><span style="height:0.5035em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">z</tspan></text>
<text transform="translate(5.624)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></span></span>  This is the parametric equation for a plane in <span class="pretex-inline" style="width:1.36307em"><span style="height:0.87066em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="f">R</tspan></text>
<text transform="translate(7.701 -4.579)"><tspan y="0" x="0" class="g">3</tspan></text>
<text transform="translate(12.453)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></span></span></p>
