</svg></span></span> then it turns out that the square matrix <span class="pretex-inline" style="width:1.6454em"><span style="height:0.84833em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
