<span class="type">Solution</span><span class="codenumber">2.7.20.1</span>
</h5>
<p>We know from the previous examples that <span class="pretex-inline" style="width:4.66248em"><span style="height:0.754em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 6.4845052 9.6980648" class="a">dim</tspan></text>

<text transform="translate(43.94)"><tspan y="0" x="0 6.3812122" class="a">2.</tspan></text>
</svg></span></span>  By the <a knowl="./knowl/basis-theorem.html?vers=b58525" knowl-id="xref-basis-theorem" alt="Basis Theorem 2.7.19 " title="Basis Theorem 2.7.19 ">basis theorem</a>, it suffices to find any two noncollinear vectors in <span class="pretex-inline" style="width:1.027em"><span style="height:0.688em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="b">V</tspan></text>
<text transform="translate(8.596)"><tspan y="0" x="0" class="a">.</tspan></text>
</svg></span></span>  We write two linear combinations of the four given spanning vectors, chosen at random:</p>
