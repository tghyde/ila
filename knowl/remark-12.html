</h5>
<p>Let <span class="pretex-inline" style="width:8.20055em"><span style="height:0.998em;vertical-align:-0.231em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">B</tspan></text>
