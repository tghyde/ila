<h5 class="heading Cc0On-lGb6amRW2mMXvh9"><span class="type">Paragraph</span></h5>
<p class="Cc0On-lGb6amRW2mMXvh9">Let <span class="pretex-inline" style="width:0.556em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
</svg></span></span> be a <span class="pretex-inline" style="width:2.21499em"><span style="height:0.7005em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="b">3</tspan></text>
<text transform="translate(8.516)"><tspan y="0" x="0" class="c">×</tspan></text>
<text transform="translate(19.04)"><tspan y="0" x="0" class="b">3</tspan></text>
</svg></span></span> matrix with a complex eigenvalue <span class="pretex-inline" style="width:1.34307em"><span style="height:0.96967em;vertical-align:-0.23067em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="d">λ</tspan></text>
<text transform="translate(7.472 2.594)"><tspan y="0" x="0" class="e">1</tspan></text>
<text transform="translate(12.224)"><tspan y="0" x="0" class="b">.</tspan></text>
</svg></span></span>  Then <span class="pretex-inline" style="width:1.06507em"><span style="height:1.26967em;vertical-align:-0.23067em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><g transform="matrix(1,0,0,-1,0,-10.892)"><path d="M 0,0 H 7.472" class="a"></path></g><text><tspan y="0" x="0" class="d">λ</tspan></text>
<text transform="translate(7.472 2.594)"><tspan y="0" x="0" class="e">1</tspan></text>
</svg></span></span> is another eigenvalue, and there is one real eigenvalue <span class="pretex-inline" style="width:1.34307em"><span style="height:0.965em;vertical-align:-0.226em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="d">λ</tspan></text>
<text transform="translate(7.472 2.594)"><tspan y="0" x="0" class="e">2</tspan></text>
<text transform="translate(12.224)"><tspan y="0" x="0" class="b">.</tspan></text>
</svg></span></span>  Since there are three distinct eigenvalues, they have algebraic and geometric multiplicity one, so the <a knowl="./knowl/block-diag-thm.html?vers=ebc07a" knowl-id="xref-block-diag-thm" alt="Block Diagonalization Theorem 5.5.28 " title="Block Diagonalization Theorem 5.5.28 ">block diagonalization theorem</a> applies to <span class="pretex-inline" style="width:0.834em"><span style="height:0.688em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(6.381)"><tspan y="0" x="0" class="b">.</tspan></text>
</svg></span></span></p>
