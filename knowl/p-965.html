<p class="CYRCS7nG7UW7h_Lv5ViAm">A <span class="pretex-inline" style="width:2.21499em"><span style="height:0.7005em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">1</tspan></text>

<text transform="translate(14.805 -10.266)"><tspan y="0" x="0" class="d">B</tspan></text>
<text transform="translate(21.41)"><tspan y="0" x="0" class="a">.</tspan></text>
</svg></span></span>  In this case, the parallelepiped <span class="pretex-inline" style="width:0.668em"><span style="height:0.674em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="c">P</tspan></text>
</svg></span></span> determined by its one row is just the interval <span class="pretex-inline" style="width:2.36249em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="e">[</tspan></text>
<text transform="translate(4.671)"><tspan y="0" x="0 6.3812122" class="a">0,</tspan></text>
<text transform="translate(16.131)"><tspan y="0" x="0" class="c">a</tspan></text>
<text transform="translate(22.443)"><tspan y="0" x="0" class="e">]</tspan></text>
</svg></span></span> if <span class="pretex-inline" style="width:2.66099em"><span style="height:0.8565em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="c">a</tspan></text>
<text transform="translate(9.268)"><tspan y="0" x="0" class="b">≥</tspan></text>
<text transform="translate(20.968)"><tspan y="0" x="0 6.3812122" class="a">0,</tspan></text>
</svg></span></span> and it is <span class="pretex-inline" style="width:2.36249em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="e">[</tspan></text>
<text transform="translate(4.958)"><tspan y="0" x="0" class="c">a</tspan></text>
<text transform="translate(11.27)"><tspan y="0" x="0 4.7973862" class="a">,0</tspan></text>
<text transform="translate(22.443)"><tspan y="0" x="0" class="e">]</tspan></text>
</svg></span></span> if <span class="pretex-inline" style="width:2.66099em"><span style="height:0.7005em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="c">a</tspan></text>

<text transform="translate(20.968)"><tspan y="0" x="0 6.3812122" class="a">0.</tspan></text>
</svg></span></span>  In this case, the sign of the determinant determines whether the interval is to the left or the right of the origin.</p>
