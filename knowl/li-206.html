<text transform="translate(12.453)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></span></span>  Clearly <span class="pretex-inline" style="width:2.20363em"><span style="height:0.71567em;vertical-align:-0.23067em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="d">v</tspan></text>
<text transform="translate(5.498 2.594)"><tspan y="0" x="0" class="b">1</tspan></text>
