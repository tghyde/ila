<p class="CQg2goD8hAurq91JTuFLX">The function <span class="pretex-inline" style="width:5.05498em"><span style="height:0.8975em;vertical-align:-0.2205em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 5.6352072 11.408138 18.799326" class="a">exp:</tspan></text>

<text transform="translate(50.315)"><tspan y="0" x="0" class="b">R</tspan></text>
</svg></span></span> defined by <span class="pretex-inline" style="width:5.17372em"><span style="height:0.9875em;vertical-align:-0.2205em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 5.6352072 11.408138" class="a">exp</tspan></text>

<text transform="translate(23.103)"><tspan y="0" x="0" class="e">x</tspan></text>

<text transform="translate(48.8)"><tspan y="0" x="0" class="e">e</tspan></text>
<text transform="translate(54.527 -4.579)"><tspan y="0" x="0" class="f">x</tspan></text>
</svg></span></span> is one-to-one.  Indeed, if <span class="pretex-inline" style="width:5.89998em"><span style="height:0.9845em;vertical-align:-0.2175em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="e">T</tspan></text>
<text transform="translate(8.436)"><tspan y="0" x="0" class="d">(</tspan></text>
<text transform="translate(13.807)"><tspan y="0" x="0" class="e">x</tspan></text>
<text transform="translate(20.337)"><tspan y="0" x="0 7.1788635" class="d">)=</tspan></text>
<text transform="translate(39.791)"><tspan y="0" x="0" class="e">T</tspan></text>
<text transform="translate(47.653)"><tspan y="0" x="0" class="d">(</tspan></text>
<text transform="translate(53.598)"><tspan y="0" x="0" class="e">y</tspan></text>
<text transform="translate(60.013)"><tspan y="0" x="0" class="d">)</tspan></text>
<text transform="translate(64.524)"><tspan y="0" x="0" class="a">,</tspan></text>
</svg></span></span> then <span class="pretex-inline" style="width:3.45013em"><span style="height:0.89233em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="e">e</tspan></text>
<text transform="translate(6.014 -4.579)"><tspan y="0" x="0" class="f">x</tspan></text>
<text transform="translate(13.534)"><tspan y="0" x="0" class="d">=</tspan></text>
<text transform="translate(25.522)"><tspan y="0" x="0" class="e">e</tspan></text>
<text transform="translate(31.631 -4.579)"><tspan y="0" x="0" class="f">y</tspan></text>
<text transform="translate(36.407)"><tspan y="0" x="0" class="a">,</tspan></text>
</svg></span></span> so <span class="pretex-inline" style="width:6.72212em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 3.2365141" class="a">ln</tspan></text>

<text transform="translate(14.553)"><tspan y="0" x="0" class="e">e</tspan></text>
<text transform="translate(20.28 -4.579)"><tspan y="0" x="0" class="f">x</tspan></text>
<text transform="translate(25.132)"><tspan y="0" x="0 7.1788635" class="d">)=</tspan></text>
<text transform="translate(44.011)"><tspan y="0" x="0 3.2365141" class="a">ln</tspan></text>
<text transform="translate(53.767)"><tspan y="0" x="0" class="d">(</tspan></text>
<text transform="translate(58.564)"><tspan y="0" x="0" class="e">e</tspan></text>

<text transform="translate(73.959)"><tspan y="0" x="0" class="a">,</tspan></text>
</svg></span></span> and hence <span class="pretex-inline" style="width:2.85799em"><span style="height:0.7025em;vertical-align:-0.2175em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="e">x</tspan></text>
<text transform="translate(10.06)"><tspan y="0" x="0" class="d">=</tspan></text>
<text transform="translate(23.195)"><tspan y="0" x="0" class="e">y</tspan></text>
<text transform="translate(29.611)"><tspan y="0" x="0" class="a">.</tspan></text>
</svg></span></span>  The equation <span class="pretex-inline" style="width:4.13899em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.574)"><tspan y="0" x="0" class="e">T</tspan></text>
<text transform="translate(8.436)"><tspan y="0" x="0" class="d">(</tspan></text>
<text transform="translate(13.807)"><tspan y="0" x="0" class="e">x</tspan></text>
<text transform="translate(20.337)"><tspan y="0" x="0 7.1788635" class="d">)=</tspan></text>
<text transform="translate(39.504)"><tspan y="0" x="0" class="e">C</tspan></text>
</svg></span></span> has one solution <span class="pretex-inline" style="width:4.25399em"><span style="height:0.956em;vertical-align:-0.189em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="e">x</tspan></text>
<text transform="translate(10.06)"><tspan y="0" x="0" class="d">=</tspan></text>
<text transform="translate(21.76)"><tspan y="0" x="0 3.2365141" class="a">ln</tspan></text>
<text transform="translate(31.516)"><tspan y="0" x="0" class="d">(</tspan></text>
<text transform="translate(36.313)"><tspan y="0" x="0" class="e">C</tspan></text>
<text transform="translate(44.313)"><tspan y="0" x="0" class="d">)</tspan></text>
</svg></span></span> if <span class="pretex-inline" style="width:2.80799em"><span style="height:0.8565em;vertical-align:-0.17em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="e">C</tspan></text>
<text transform="translate(10.955)"><tspan y="0" x="0" class="g">&gt;</tspan></text>
<text transform="translate(22.656)"><tspan y="0" x="0 6.3812122" class="a">0,</tspan></text>
</svg></span></span> and it has zero solutions if <span class="pretex-inline" style="width:2.80799em"><span style="height:0.7505em;vertical-align:-0.064em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.287)"><tspan y="0" x="0" class="e">C</tspan></text>

</svg></span></span></p>
