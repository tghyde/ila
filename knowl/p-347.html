<h5 class="heading CqXPt9bsl84NvrH8FgLd8"><span class="type">Paragraph</span></h5>
<p class="CqXPt9bsl84NvrH8FgLd8">The null space is the solution set of the homogeneous system <span class="pretex-inline" style="width:3.28599em"><span style="height:0.7005em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 7.2419872" class="a">Ax</tspan></text>
<text transform="translate(16.441)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(28.142)"><tspan y="0" x="0 6.3812122" class="c">0.</tspan></text>
</svg></span></span>  To compute this, we need to row reduce <span class="pretex-inline" style="width:0.834em"><span style="height:0.688em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="a">A</tspan></text>
<text transform="translate(6.381)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></span></span>  Its reduced row echelon form is</p>
<div class="pretex-display CqXPt9bsl84NvrH8FgLd8"><svg height="3.48522em" version="1.1" class="pretex" viewBox="229 2 47 40"><text transform="translate(228.251 3.417)"><tspan y="0" x="0" class="d">E</tspan></text>
<text transform="translate(238.242 10.76)"><tspan y="0" x="0 16.343248" class="c">11</tspan><tspan y="13.947" x="0 16.343248" class="c">00</tspan><tspan y="27.895" x="0 16.343248" class="c">00</tspan></text>
<text transform="translate(262.568 3.417)"><tspan y="0" x="0" class="d">F</tspan></text>
<text transform="translate(272.559 25.235)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></div>
<p class="CqXPt9bsl84NvrH8FgLd8">This gives the equation <span class="pretex-inline" style="width:4.51698em"><span style="height:0.904em;vertical-align:-0.2175em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(9.526)"><tspan y="0" x="0" class="b">+</tspan></text>
<text transform="translate(21.485)"><tspan y="0" x="0" class="a">y</tspan></text>
<text transform="translate(30.569)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(42.27)"><tspan y="0" x="0 6.3812122" class="c">0,</tspan></text>
</svg></span></span> or</p>
<div class="pretex-display CqXPt9bsl84NvrH8FgLd8"><svg height="2.43965em" version="1.1" class="pretex" viewBox="131 1 242 28"><text transform="translate(130.974 4.471)"><tspan y="0" x="0" class="d">G</tspan></text>
<text transform="translate(140.988 9.638)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(151.183 9.638)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(163.88 9.638)"><tspan y="0" x="0" class="e">−</tspan></text>
<text transform="translate(173.704 9.638)"><tspan y="0" x="0" class="a">y</tspan><tspan y="14.944" x="-32.601002" class="a">y</tspan></text>
<text transform="translate(151.183 24.582)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(173.704 24.582)"><tspan y="0" x="0" class="a">y</tspan></text>
<text transform="translate(199.019 9.628)"><tspan y="0" x="0 4.2159214 8.0951815 11.018016 14.897276 21.347406 25.104244 27.659811 30.582645 32.725037 38.272305 42.052094 45.808933 49.221455 51.777023 55.901127 60.958702 63.414803 67.53891 70.461746" class="f">parametricvectorform</tspan></text>
<text transform="translate(197.062 18.261)"><tspan y="0" x="0 3.864306 10.115828 16.378826 22.630348 28.88187 35.133392 41.396393 47.647915 53.899437 60.162434 66.413956 70.278259" class="e">−−−−−−−−−−−−→</tspan></text>
<text transform="translate(293.1 2.394)"><tspan y="0" x="0" class="d">H</tspan></text>
<text transform="translate(301.363 10.76)"><tspan y="0" x="0" class="a">x</tspan><tspan y="13.947" x="0.34400001" class="a">y</tspan></text>
<text transform="translate(308.123 2.394)"><tspan y="0" x="0" class="d">I</tspan></text>
<text transform="translate(317.965 18.261)"><tspan y="0" x="0" class="b">=</tspan></text>
<text transform="translate(331.1 18.261)"><tspan y="0" x="0" class="a">y</tspan></text>
<text transform="translate(339.117 2.394)"><tspan y="0" x="0" class="d">H</tspan></text>
<text transform="translate(346.29 10.76)"><tspan y="0" x="0" class="e">−</tspan></text>
<text transform="translate(354.68 10.76)"><tspan y="0" x="0" class="c">1</tspan><tspan y="13.947" x="-4.1950002" class="c">1</tspan></text>
<text transform="translate(361.061 2.394)"><tspan y="0" x="0" class="d">I</tspan></text>
<text transform="translate(369.835 18.261)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></div>
<p class="CqXPt9bsl84NvrH8FgLd8">Hence the null space is <span class="pretex-inline" style="width:5.25799em"><span style="height:1.34817em;vertical-align:-0.3765em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0 6.3812122 12.705039 18.523878" class="c">Span</tspan></text>
<text transform="translate(25.043 -10.266)"><tspan y="0" x="0 6.1287179" class="d">CA</tspan></text>
<text transform="translate(36.176 -5.899)"><tspan y="0" x="0" class="g">−</tspan></text>
<text transform="translate(41.769 -5.899)"><tspan y="0" x="0" class="f">1</tspan><tspan y="9.7089996" x="-2.7969999" class="f">1</tspan></text>
<text transform="translate(46.023 -10.266)"><tspan y="0" x="0 4.9993811" class="d">BD</tspan></text>
<text transform="translate(57.156)"><tspan y="0" x="0" class="c">,</tspan></text>
</svg></span></span> which is a line in <span class="pretex-inline" style="width:1.36307em"><span style="height:0.87066em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="h">R</tspan></text>
<text transform="translate(7.701 -4.579)"><tspan y="0" x="0" class="f">2</tspan></text>
<text transform="translate(12.453)"><tspan y="0" x="0" class="c">.</tspan></text>
</svg></span></span> </p>
