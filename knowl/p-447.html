<h5 class="heading Coi3Bj6irpOTlg1ulapPa"><span class="type">Paragraph</span></h5>
<p class="Coi3Bj6irpOTlg1ulapPa">Informally, a <em>function</em> is a rule that accepts inputs and produces outputs.  For instance, <span class="pretex-inline" style="width:4.39306em"><span style="height:1.07416em;vertical-align:-0.2175em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(1.435)"><tspan y="0" x="0" class="a">f</tspan></text>
<text transform="translate(7.495)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(12.866)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(19.396)"><tspan y="0" x="0 7.1788635" class="b">)=</tspan></text>
<text transform="translate(39.137)"><tspan y="0" x="0" class="a">x</tspan></text>
<text transform="translate(45.667 -4.579)"><tspan y="0" x="0" class="c">2</tspan></text>
</svg></span></span> is a function that accepts one number <span class="pretex-inline" style="width:0.644em"><span style="height:0.4925em;vertical-align:-0.0075em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(0.861)"><tspan y="0" x="0" class="a">x</tspan></text>
</svg></span></span> as its input, and outputs the square of that number: <span class="pretex-inline" style="width:4.08099em"><span style="height:0.9845em;vertical-align:-0.2175em"></span><span><svg version="1.1" class="pretex" viewBox="0 -11.47704 11.47704 11.47704"><text transform="translate(1.435)"><tspan y="0" x="0" class="a">f</tspan></text>
<text transform="translate(7.495)"><tspan y="0" x="0" class="b">(</tspan></text>
<text transform="translate(12.005)"><tspan y="0" x="0" class="d">2</tspan></text>
<text transform="translate(18.386)"><tspan y="0" x="0 7.1788635" class="b">)=</tspan></text>
<text transform="translate(37.266)"><tspan y="0" x="0 6.3812122" class="d">4.</tspan></text>
</svg></span></span>  In this subsection, we interpret matrices as functions.</p>
