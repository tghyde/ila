<h5 class="heading"><span class="type">Paragraph</span></h5>
<p>One should think of a system of equations as being an implicit equation for its solution set, and of the parametric form as being the parameterized equation for the same set.  The parameteric form is much more explicit: it gives a concrete recipe for producing <!--Style me with CSS--><em>all</em> solutions.</p>
