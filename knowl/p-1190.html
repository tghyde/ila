<p class="C8VbRM5Ylud7q5mP5ud1w">is not diagonalizable for any number <span class="pretex-inline" style="width:0.929em"><span style="height:0.753em;vertical-align:-0.014em"></span><span><svg version="1.1" class="pretex" viewbox="0 -11.47704 11.47704 11.47704"><text><tspan y="0" x="0" class="e">λ</tspan></text>
