name: Build and publish

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# One publish at a time, in order
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build image is tagged by the git tree hash of
      # build-environment/, so it is rebuilt exactly when the
      # Dockerfile (or its support files) change.
      - name: Pull or build the ila-build image
        run: |
          TAG=$(git rev-parse HEAD:build-environment)
          IMAGE="ghcr.io/${{ github.repository_owner }}/ila-build:$TAG"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          if ! docker pull "$IMAGE"; then
            docker build -t "$IMAGE" build-environment
            docker push "$IMAGE"
          fi

      # The pretex cache holds compiled LaTeX -> SVG; restoring it is
      # what keeps CI builds fast.  Build and scons state are NOT
      # cached, so every run is a clean, correct full build.
      - name: Restore LaTeX cache
        uses: actions/cache@v4
        with:
          path: .ci-cache
          key: pretex-cache-${{ github.run_id }}
          restore-keys: |
            pretex-cache-

      - name: Build the book
        run: |
          mkdir -p .ci-cache .ci-tmp _site
          run_build() {
            docker run --rm \
              -v "$PWD":/base \
              -v "$PWD/_site":/home/vagrant/build \
              -v "$PWD/.ci-cache":/home/vagrant/cache \
              -v "$PWD/.ci-tmp":/home/vagrant/output-html \
              -w /base "$IMAGE" "$@"
          }
          run_build scons subpackages
          run_build scons
          sudo chown -R "$(id -u):$(id -g)" .ci-cache _site

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site
